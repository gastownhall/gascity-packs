name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.16"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: slack-full/adapter/go.mod
          cache-dependency-path: |
            slack-full/cli/go.sum

      - name: Install Python test dependencies
        run: python3 -m pip install PyYAML pytest jsonschema

      - name: Validate registry
        # --require-git: without git, no commit or content-hash verification runs at
        # all, so a missing worktree must fail rather than silently downgrade this to
        # a format-only check. (checkout above uses fetch-depth: 0, as it must.)
        run: python3 validate_registry.py --require-git

      - name: Run Python pack tests
        run: python3 -m pytest tests contributing-to-gascity/tests gascity/tests discord/tests github/tests oversight-rig/tests slack-full/tests slack-channel/tests pr-pipeline/tests profiler/tests runtime-herdr-core/tests/unit -q

      - name: Lint and exercise shared role prompt composition
        run: |
          go install github.com/gastownhall/gascity/cmd/gc@latest
          GC_BIN="$(go env GOPATH)/bin/gc"
          # oversight-rig is deliberately absent. Under the gc this step
          # installs it reports four bd-unknown-flag findings for `gc bd list
          # --rig`, which is valid: `gc bd` strips --rig in extractBdScopeFlags
          # before forwarding, and the scanner validated against bare bd's
          # manifest alone. Same upstream defect as the `pre-5220` section of
          # tests/gastown_lint_upstream_defects.txt, fixed by gascity 7724983de
          # and not in v1.4.1. Add oversight-rig here in the same change that
          # deletes that section. A dev gc already reports zero for it, so
          # pinning them would waive findings most contributors never see.
          # Refute: gc lint oversight-rig  (0 findings on main, 4 on v1.4.1)
          for pack in gascity gascity/roles bmad compound-engineering gstack superpowers profiler \
                      pr-pipeline slack-channel slack-full slack-mini runtime-herdr-core; do
            "$GC_BIN" lint "$pack"
          done
          GC_TEST_BIN="$GC_BIN" python3 -m pytest oversight-rig/tests/test_order_scopes.py -q
          GC_TEST_BIN="$GC_BIN" python3 -m pytest tests/test_gc_role_prompt_integration.py tests/test_pack_composition_warnings.py -q
          GC_TEST_BIN="$GC_BIN" python3 -m pytest tests/test_build_failure_policy_live_gc.py -q

      # Installed, not parsed. `gc lint` above reads each pack on its own and
      # the per-pack suites read their own TOML; neither can say what gc does
      # when a city loads the pack, which is where a user meets it. pr-pipeline
      # linted clean for months while putting a deprecation warning into every
      # importing city's `gc doctor`.
      - name: Stand each maintained pack up against gc
        run: |
          GC_TEST_BIN="$(go env GOPATH)/bin/gc" \
            python3 -m pytest tests/test_maintained_packs_live_gc.py -q

      # gastown is not in the lint loop above because seven of its findings are
      # defects in gc's linter rather than in the pack; see
      # tests/gastown_lint_upstream_defects.txt. This pins the finding set
      # instead, so a new one fails and a fixed one has to be un-waived.
      - name: Check gastown lint findings against the pinned set
        run: |
          GC_TEST_BIN="$(go env GOPATH)/bin/gc" \
            python3 -m pytest tests/test_gastown_lint_findings.py -q

      - name: Run Gastown shell tests
        run: |
          for test_script in gastown/tests/test_*.sh; do
            bash "$test_script"
          done

      - name: Run root module embed tests
        run: go test .

      - name: Run Slack full adapter tests
        working-directory: slack-full/adapter
        run: go test ./...

      - name: Run Slack full CLI tests
        working-directory: slack-full/cli
        run: go test ./...

      - name: Run Slack channel adapter tests
        working-directory: slack-channel/adapter
        run: go test ./...

      - name: Run Slack mini adapter tests
        working-directory: slack-mini/adapter
        run: go test ./...

      - name: Run runtime-cloudflare module tests
        working-directory: runtime-cloudflare/runtime
        run: |
          go vet ./...
          go test ./...

      # RPP smoke check for runtime-cloudflare. The Runtime Provider Protocol
      # and `gc runtime check` are on gascity main and in every gc release
      # since v1.4.0, so `@latest` can run this. It stays report-only
      # (continue-on-error) because it tracks an unpinned gc: pinning
      # @<version> and dropping continue-on-error is what makes it a gate.
      # The install is a tool install, not a Go import, so the pack keeps
      # zero gascity deps.
      - name: Run runtime-cloudflare RPP conformance
        working-directory: runtime-cloudflare
        continue-on-error: true
        run: |
          go install github.com/gastownhall/gascity/cmd/gc@latest
          GC_BIN="$(go env GOPATH)/bin/gc" ./conformance.sh

  # runtime-herdr-core is a typed, standard-library-only Python runtime with
  # a 3.9 floor, so it is type-checked and tested on the floor and on 3.12.
  # The unit tier and the conformance runs talk only to fake-hc; nothing here
  # downloads or runs a real herdr-core. Merges gate on the aggregator below.
  runtime-herdr-core:
    name: runtime-herdr-core (Python ${{ matrix.target }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9.25"
            target: "3.9"
          - python: "3.12.16"
            target: "3.12"
    defaults:
      run:
        working-directory: runtime-herdr-core
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      # Test-only tools, each pinned to its last release that still runs on
      # Python 3.9. The runtime imports nothing outside the standard library.
      - name: Install pinned test tools
        run: python -m pip install mypy==1.19.1 pytest==8.4.2 jsonschema==4.25.1 types-jsonschema==4.25.1.20251009

      - name: mypy --strict
        run: python -m mypy --config-file mypy.ini --python-version "${{ matrix.target }}"

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: slack-full/adapter/go.mod
          cache: false

      # gc's own RPP checks of the runtime, against fake-hc: `gc runtime
      # check` and `gc runtime conformance --json`, which must report
      # v2_ready with no failed requirement. gc is pinned to a gascity commit,
      # so a new conformance group lands here as a deliberate pin bump. Run
      # with a scratch GC_EXEC_STATE_DIR, then without it to prove the default
      # state root (the runner's home is ephemeral; CI=true lets it run).
      - name: RPP conformance against fake-hc
        env:
          GASCITY_PIN: bad83762c64a670ec2c3626f15e498705e464ec7
        run: |
          go install "github.com/gastownhall/gascity/cmd/gc@${GASCITY_PIN}"
          export GC_BIN="$(go env GOPATH)/bin/gc"
          export PYTHON="$(command -v python)"
          tests/conformance.sh --json
          tests/conformance.sh --json --default-root

      # The pack never kills city infrastructure with a session and spots
      # it by argv as gc does. Its table must match gc's
      # IsCityInfrastructureArgv at the pinned commit; drift fails here.
      # The module is downloaded outside any go.mod (the repository root
      # has one), into the cache `go install` above already filled.
      - name: Infrastructure argv matches the pinned gc
        env:
          GASCITY_PIN: bad83762c64a670ec2c3626f15e498705e464ec7
        run: |
          src="$(cd "$(mktemp -d)" && go mod download -json "github.com/gastownhall/gascity@${GASCITY_PIN}" | python -c 'import json, sys; print(json.load(sys.stdin)["Dir"])')"
          python tests/infra_argv_drift.py "$src/internal/runtime/proctable/infrastructure_argv.go"

      # fake-hc validates every reply against the hc schema vendored at the
      # pinned tag; this proves the vendored copy is that tag's released API.
      - name: Vendored hc schema is the pinned tag's
        if: matrix.target == '3.12'
        env:
          GC_HC_SCHEMA_FETCH: "1"
        run: python -m pytest tests/unit/test_fakehc_schema.py -q -k pinned_tags_released_schema

  # The one stable check name for the main ruleset to require: the matrix's
  # legs are named per Python version. It runs even when a leg fails or is
  # cancelled (a skipped required check can count as passing) and fails
  # unless every leg succeeded.
  runtime-herdr-core-result:
    name: runtime-herdr-core
    if: always()
    needs: [runtime-herdr-core]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Every runtime-herdr-core leg passed
        env:
          RESULT: ${{ needs.runtime-herdr-core.result }}
        run: |
          echo "runtime-herdr-core legs: $RESULT"
          test "$RESULT" = success
