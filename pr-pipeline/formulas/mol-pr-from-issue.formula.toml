description = """
From a triaged issue to a finished, unpublished branch. Runs pr-start →
ship → publish hand-off with halt-on-flag gates between steps. This is the
outbound-PR (author-side) analogue of the maintainer-side incoming-PR
adoption workflow.

**This formula performs no upstream write.** Its pool half ends at a
hand-off: the branch is committed locally, the exact publish commands are
recorded on the root bead, and the publisher named by `publish_owner`
performs the push and the PR open from its own login, after a human has
approved that artifact. The recommended deployment gives unattended pool seats a READ-ONLY
`GH_TOKEN`. Without it the pool itself can publish, and nothing but this
formula's prose stands between an unreviewed branch and the forge.

A coding agent (polecat or equivalent) follows the chain. Each gate step
inspects the prior step's evidence and either halts the chain or proceeds.
When a gate halts, the polecat writes `metadata.summary_for_human` on the
ROOT bead and closes its step. Per dr-1lf4h3 Phase 2, a downstream
loop-close handler picks up the root bead close and surfaces the halt to
the originating Slack thread via the PL.

The molecule root bead IS the control bead — run state is recorded in its
notes and metadata. Crash-safe: `gc bd mol current` resumes at the right step.

## Contract

1. Caller slings with `--var issue_number=<number>` (and optionally `--var skip_open_pr=true`)
2. Polecat works through 6 sequential steps with explicit per-step gates
3. Chain ends with either:
   - a finished branch at branch-ready, with the publish commands recorded
     on the root bead for the publisher, OR
   - a halt with `metadata.summary_for_human` set on the root bead

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| issue_number | caller | Upstream GitHub issue number (required) |
| skip_open_pr | caller | "true" to close at branch-ready without consulting the publish-readiness gate (default: "false"). Every run now ends at branch-ready; this selects how much evidence is gathered first. |
| auto_push | caller | "true" to run the publish-readiness gates and record their evidence. Authorizes no push and no PR open; every run ends at branch-ready. |
| publish_owner | caller | Who runs the recorded publish commands (default: "maintainer") |

## Failure Modes

| Situation | Action |
|-----------|--------|
| pr-start raises critical flag (gate, scope, duplicate PR) | gate-after-pr-start halts; summary_for_human set |
| ship readiness verdict != READY | gate-after-ship halts; summary_for_human set |
| auto_push=true but a readiness gate fails any hard check | gate-publish-readiness halts; gc.escalate_to=mayor set; summary_for_human names the failed gate |
| auto_push=false (default) or gate did not write evidence.gate_passed=true | hand-off-publish closes at branch-ready and says the gate did not run |
| a publish identifier cannot be read from the forge | hand-off-publish records what it resolved and names the missing one; the branch is still finished |

## Known scope notes (vapor phase — needs validation)

- **Implementation gap.** mol-pr-start's contract says "no code is
  written" — it only produces a plan markdown. mol-pr-ship operates on
  an already-implemented branch (its simplify and review-iterate stages
  can modify files but they expect implementation to exist). This
  formula's `pr-start` step is therefore explicitly broader than
  mol-pr-start: it does plan + create branch + WRITE THE CODE per the
  plan. The `ship` step then operates on the implemented branch as a
  pre-push gate.
- **PL-mediated halt surface.** Halt steps write
  `metadata.summary_for_human` on the root bead. Without dr-1lf4h3
  Phase 2, halts land as flat direct-post via the existing loop-close
  handler. With Phase 2, they surface in PL voice on the originating
  Slack thread."""
formula = "mol-pr-from-issue"
phase = "vapor"
# pour = true eager-materializes the graph steps. Without it this formula
# compiles RootOnly and every one of its nine steps is dropped at
# instantiation, so the root sits in_progress with nothing routed. The
# predicate (internal/formula/compile.go) is
#   rootOnly := (!f.Pour && f.Phase == "vapor") || len(f.Steps) == 0
# which keys only on pour and phase; the graph declaration form is never
# consulted, so declaring a compiler requirement does not protect against it.
# Note the failure is silent: RecipeHasReadySurface still returns true because
# RootOnly itself satisfies it, so the pool sling is accepted and only the
# steps go missing.
pour = true
version = 1

# The v2 compiler requirement, in the form gc reads today. This was
# `contract = "graph.v2"`, which gc still honors and reports as deprecated in
# `gc doctor` -- one `formula-requirements` warning in every city that imports
# this pack.
[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.issue_number]
description = "Upstream GitHub issue number to author a PR for"
required = true

[vars.skip_open_pr]
description = "Stop at the ship-green / branch-ready state; do NOT actually open the PR. Default false."
default = "false"

[vars.auto_push]
description = "Run the publish-readiness gates and record their evidence for the publisher. Default false. It authorizes no push and no PR open: nothing in this formula writes upstream under any value, and every run ends at branch-ready."
default = "false"

[vars.publish_owner]
description = "Who runs the recorded publish commands. Recorded as evidence.publish_owner so the hand-off names its publisher. Default: maintainer."
default = "maintainer"

[[steps]]
id = "pr-start"
title = "Plan + scaffold the PR for issue {{issue_number}}"
description = """
Plan + create branch + implement per plan. Combines mol-pr-start's
planning workflow (copy-with-prune) with the implementation work that
mol-pr-start's contract defers. Writes `evidence.*` on close.

**Contract extension rationale:** mol-pr-start's stated contract is "no
code is written" — it produces only a plan markdown. This step
extends that contract because the downstream `ship` step expects an
implemented branch to operate against. Planning alone is insufficient
in a chain that ends with a finished, unpublished branch and a publish
hand-off. The extension is intentional
and scoped to this macro formula.

**1. Find the root bead and confirm we're in a git repo:**
```bash
ROOT_ID=$(gc bd mol current --json | jq -r '.molecule_id')
REPO_ROOT=$(git rev-parse --show-toplevel 2>/dev/null) || {
    echo "Not in a git repository — cannot plan."
    gc bd update "$ROOT_ID" --set-metadata "gc.halt_chain=true" \\
                         --set-metadata "summary_for_human=Cannot plan issue #{{issue_number}}: not in a git checkout. No PR opened."
    gc bd close "$ROOT_ID" --reason "not a git checkout"
    exit 1
}
cd "$REPO_ROOT"
REPO=$(gh repo view --json nameWithOwner -q .nameWithOwner)
```

**2. Run the mol-pr-start planning pipeline against issue {{issue_number}}.**

Follow mol-pr-start's six step bodies in order (copy-with-prune from
`${GC_PACK_DIR}/formulas/mol-pr-start.formula.toml`):

  a. **intake** — read the issue via `gh issue view {{issue_number}}`; record
     `issue: {{issue_number}}`, `repo: $REPO`, `repo_root: $REPO_ROOT` on the
     root bead.

  b. **gates** — Two BLOCKING gates. Either fires → halt the chain:

     - **Gate 1 (Competing PR)**: an open PR is shown to COVER this issue
       by mol-pr-start's two-phase decision, OR `gh issue view
       {{issue_number}} --json state` is `CLOSED`. Run both phases as
       written there — `gh pr list --search` only nominates candidates, and
       a bare mention is never coverage. A candidate covers the issue only
       on a closing keyword bound to it (on a default-branch PR) or a
       schema-valid model verdict citing the PR body verbatim. Candidates
       that merely mention the issue are recorded as context and the chain
       CONTINUES: a false block here kills the whole authoring run.
     - **Gate 2 (Architectural refactor)**: active design docs marked
       Accepted/Implementing, open consolidation PRs from maintainers,
       or recent supersedes-pattern PRs in the area.

     If either gate triggers:
     ```bash
     gc bd update "$ROOT_ID" \\
       --set-metadata "gc.halt_chain=true" \\
       --set-metadata "summary_for_human=Issue #{{issue_number}} blocked by <gate>: <detail>. Recommended pivot: <one-line suggestion based on which gate fired>."
     ```
     Then close this step and stop (the gate-after-pr-start step picks
     up the halt). Do NOT proceed to implementation.

  c. **blast-radius** — Map callers, configs, concurrency, domain
     boundaries. Record the summary in root bead notes.

  d. **conventions** — Read CONTRIBUTING.md / AGENTS.md / CLAUDE.md if
     present; inspect sibling files; pick a test strategy.

  e. **produce-plan** — Write `.gc/pr-pipeline/plans/issue-{{issue_number}}.md`
     with sections: Root cause, Files to change, Blast radius,
     Convention notes, Test plan, Risks, Branch (name + base).

  f. **themes-audit** — Walk the plan against the 19 recurring adoption
     themes (silent errors, parallel call-path siblings, golden snapshot
     drift, etc.). Update the plan in-place where a theme applies.

**3. Create the branch.**
Read the branch name from the plan's "Branch" section, then:
```bash
git checkout -B "<branch-name>" origin/main
```

**4. Implement per the plan.**
mol-pr-start's contract says "no code is written" — this step extends
the contract with the implementation work. Walk the plan's "Files to
change" section and the test plan, write the code, commit as you go:
```bash
git add <files>
git commit -m "<conventional commit per plan>"
```

Implementation rules:
- Test-first when the test plan calls for it.
- Each commit should leave the build green; if a build break is needed
  for a multi-step refactor, sequence the commits so the breakage is
  bounded to a contiguous sequence.
- Stay within the plan's stated Files to change unless extending the
  scope is genuinely required. If scope expands, note it in root bead
  notes (`scope_extension: <reason>`).

**5. Write evidence on close:**
```bash
gc bd update "$ROOT_ID" \\
  --set-metadata "evidence.artifact_path=.gc/pr-pipeline/plans/issue-{{issue_number}}.md" \\
  --set-metadata "evidence.reviewer_verdict=pass" \\
  --set-metadata "evidence.reviewer_agent=<this polecat session>" \\
  --set-metadata "evidence.commit_sha=$(git rev-parse HEAD)" \\
  --set-metadata "evidence.branch=<branch-name>"
```

If implementation can't be done (e.g., plan says "this issue is
actually a question, not a fix"), set `gc.halt_chain=true` and
`summary_for_human=...` describing why and close the step.

**Exit criteria:** Plan written, branch created, implementation committed,
evidence written. OR: gc.halt_chain=true set with a clear summary."""

[[steps]]
id = "gate-after-pr-start"
title = "Gate: critical flags on pr-start?"
needs = ["pr-start"]
description = """
Inspect pr-start's evidence and metadata. Halt the chain if a critical
flag is present; otherwise close cleanly and proceed.

**1. Find the root bead and read pr-start state:**
```bash
ROOT_ID=$(gc bd mol current --json | jq -r '.molecule_id')
HALT=$(gc bd show "$ROOT_ID" --json | jq -r '.[0].metadata."gc.halt_chain" // "false"')
VERDICT=$(gc bd show "$ROOT_ID" --json | jq -r '.[0].metadata."evidence.reviewer_verdict" // ""')
```

**2. Decide:**

- If `HALT == "true"` OR `VERDICT` is empty (pr-start didn't write
  evidence) OR `VERDICT == "blocked"`:
  - **Preserve any existing `summary_for_human` written by pr-start
    itself** (pr-start's internal gates already write specific halt
    summaries). Only write a fallback if the field is still empty:
    ```bash
    EXISTING=$(gc bd show "$ROOT_ID" --json | jq -r '.[0].metadata.summary_for_human // ""')
    if [ -z "$EXISTING" ]; then
        gc bd update "$ROOT_ID" --set-metadata \\
          "summary_for_human=Halt at gate-after-pr-start for issue #{{issue_number}}: <one-line synthesis of why>. No PR opened."
    fi
    ```
  - Close THIS step with status=closed:
    ```bash
    gc bd close "$ROOT_ID" --reason "halt_chain set after pr-start"
    ```
  - Do NOT proceed. The downstream ship/hand-off steps will not run
    because the chain is halted. The loop-close handler picks up the
    root bead close downstream.

- Otherwise (verdict is pass and no halt flag), proceed without closing the
  root bead — the molecule advances to the `ship` step automatically once
  this step body completes. Display:
  ```
  [pr-from-issue] gate-after-pr-start: cleared. Proceeding to ship.
  ```

**Exit criteria:** Either halted (root closed, summary_for_human set) or
cleared (step body completes; molecule advances)."""

[[steps]]
id = "ship"
title = "Pre-push gate — run mol-pr-ship checks"
needs = ["gate-after-pr-start"]
description = """
Run mol-pr-ship's pre-push gate against the implemented branch.
Copy-with-prune from
`${GC_PACK_DIR}/formulas/mol-pr-ship.formula.toml`.

**1. Find the root bead and resolve the branch:**
```bash
ROOT_ID=$(gc bd mol current --json | jq -r '.molecule_id')
REPO_ROOT=$(git rev-parse --show-toplevel)
cd "$REPO_ROOT"
BRANCH=$(git branch --show-current)
# Resolve the default branch locally. `|| echo "main"` on the old
# `git remote show origin` pipeline could never fire: sed exits 0 on empty
# input, so a network failure produced DEFAULT="" and this check silently
# fell back to the hardcoded main/master arms below.
DEFAULT=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's|^origin/||')
if [ -z "$DEFAULT" ]; then
    git remote set-head origin --auto >/dev/null 2>&1 || true
    DEFAULT=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's|^origin/||')
fi
[ -n "$DEFAULT" ] || DEFAULT=main
if [ "$BRANCH" = "$DEFAULT" ] || [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
    gc bd update "$ROOT_ID" --set-metadata "gc.halt_chain=true" \\
      --set-metadata "summary_for_human=Cannot ship from default branch ($BRANCH). pr-start did not create a feature branch — chain stopped."
    gc bd close "$ROOT_ID" --reason "on default branch"
    exit 0
fi
mkdir -p .gc/pr-pipeline/ship
SAFE=$(echo "$BRANCH" | tr '/' '_')
REPORT_PATH=".gc/pr-pipeline/ship/${SAFE}.md"
```

**2. Run mol-pr-ship's four-stage pipeline:**

  a. **Stage 1 — simplify**: walk the diff, remove dead code, consolidate
     duplicates, fix naming, drop unused imports. Apply in-place commits.
     Verify the build is green after; revert simplify commits if not.

  b. **Stage 2 — review-iterate**: iterate self-review against the 11
     scorecard categories (Behavioral Correctness, Contract Fidelity,
     Blast Radius, Concurrency, Error Handling, Security, Resource
     Lifecycle, Release Safety, Test Evidence, Architectural Consistency,
     Debuggability). Pre-flag the seven recurring themes (test
     isolation, test retry, stale-state guards, fail-closed, bootstrap
     init, API contract, transient retry — see mol-pr-review for the
     canonical descriptions in
     `${GC_PACK_DIR}/formulas/mol-pr-review.formula.toml`).
     Fix blockers and majors in-place; commit each fix. Cap at 3
     iterations. If iteration 3 still has blockers/majors →
     readiness=BLOCKED.

  c. **Stage 3 — contributor-check**: mechanical gates per repo stack
     (build, lint/vet, tests, docs if Makefile target exists and docs
     touched). Record pass/fail per gate.

  d. **Stage 4 — report**: write the combined readiness report to
     `$REPORT_PATH`. Verdict is mechanical:
     - READY only when: simplify ∈ {complete, skipped} AND review_status =
       converged AND no required gate failed
     - Otherwise: BLOCKED

**3. Write evidence on close:**

Note: this step **overwrites** `evidence.artifact_path` set by pr-start
(which pointed to the plan markdown). The semantics of `evidence.*`
in this macro are "most-recent step's evidence" — chain-time ordering
matters. If a crash-resume brings ship back before pr-start re-runs,
the artifact_path key may still point to the plan path; verify it
points to the ship report (`.gc/pr-pipeline/ship/...`) before reading
it in gate-after-ship.

```bash
gc bd update "$ROOT_ID" \\
  --set-metadata "evidence.artifact_path=$REPORT_PATH" \\
  --set-metadata "evidence.reviewer_verdict=<pass|blocked>" \\
  --set-metadata "evidence.reviewer_agent=<this polecat session>" \\
  --set-metadata "evidence.commit_sha=$(git rev-parse HEAD)"
```

Map readiness → verdict:
- readiness=READY → `reviewer_verdict=pass`
- readiness=BLOCKED → `reviewer_verdict=blocked`

**Critical:** This step MUST NOT run `git push` or `gh pr create`.
Nothing in this formula pushes or opens a PR. The `hand-off-publish`
step records the publish commands for the publisher instead.

**Exit criteria:** Report written, verdict recorded, evidence set."""

[[steps]]
id = "gate-after-ship"
title = "Gate: major concerns on ship?"
needs = ["ship"]
description = """
Inspect ship's evidence.reviewer_verdict. Halt the chain if not pass;
otherwise close cleanly and proceed to the publish hand-off.

**1. Find the root bead and read ship state:**
```bash
ROOT_ID=$(gc bd mol current --json | jq -r '.molecule_id')
VERDICT=$(gc bd show "$ROOT_ID" --json | jq -r '.[0].metadata."evidence.reviewer_verdict" // ""')
REPORT_PATH=$(gc bd show "$ROOT_ID" --json | jq -r '.[0].metadata."evidence.artifact_path" // ""')
```

**2. Decide:**

- If `VERDICT != "pass"`:
  - Read the blockers section of the ship report at `$REPORT_PATH`.
  - Write `summary_for_human` synthesizing the blockers:
    ```bash
    gc bd update "$ROOT_ID" --set-metadata \\
      "summary_for_human=Ship gate halted on issue #{{issue_number}}: <one-line blocker summary>. Full readiness report at $REPORT_PATH. Branch left ready for human review — no PR opened."
    ```
  - Set halt_chain:
    ```bash
    gc bd update "$ROOT_ID" --set-metadata "gc.halt_chain=true"
    ```
  - Close THIS step:
    ```bash
    gc bd close "$ROOT_ID" --reason "ship verdict != pass"
    ```
  - Do NOT proceed to the publish hand-off.

- Otherwise (verdict = pass), proceed without closing the root bead —
  the molecule advances to the `hand-off-publish` step automatically once this
  step body completes. Display:
  ```
  [pr-from-issue] gate-after-ship: cleared. Proceeding to the publish hand-off.
  ```

**Exit criteria:** Either halted (root closed, summary_for_human + halt_chain
set) or cleared (step body completes; molecule advances)."""

[[steps]]
id = "gate-publish-readiness"
title = "Gate: mechanical eligibility check before push"
needs = ["gate-after-ship"]
description = """
Mechanical eligibility gate per the autonomous-pr-ship design
(dr-1l9hc4). This step
records readiness evidence for the publisher when a positive
`auto_push=true` signal arrived with the dispatch AND every mechanical
check below passes. It authorizes no push.

**No LLM judgment in this step.** Every gate is a count, regex match, or
shell exit code. The only soft input is the polecat's own `polecat_confidence`
metadata (treated as a mechanical read; default "medium"). Anything that
would require judgment routes to mayor via `summary_for_human` and
`gc.escalate_to=mayor`.

When `auto_push != "true"`, this step is a no-op and the chain falls
through to `hand-off-publish`, which closes at branch-ready either way.
`auto_push` no longer authorizes a push -- nothing in this formula pushes.
What it now selects is whether these readiness gates run and leave their
evidence for the publisher. The `skip_open_pr=true` path is preserved.

**1. Find the root bead and resolve identifiers:**
```bash
ROOT_ID=$(gc bd mol current --json | jq -r '.molecule_id')
AUTO_PUSH="{{auto_push}}"
SKIP_OPEN_PR="{{skip_open_pr}}"
ISSUE_NUM={{issue_number}}
REPO_ROOT=$(git rev-parse --show-toplevel)
cd "$REPO_ROOT"
BRANCH=$(git branch --show-current)
```

**2. Skip when auto_push != "true" or skip_open_pr = "true":**

```bash
if [ "$AUTO_PUSH" != "true" ] || [ "$SKIP_OPEN_PR" = "true" ]; then
    echo "[gate-publish-readiness] auto_push=$AUTO_PUSH skip_open_pr=$SKIP_OPEN_PR; skipping gate. hand-off-publish closes at branch-ready."
    exit 0
fi
```

No evidence is written and `gc.halt_chain` is NOT set — the chain advances
to `hand-off-publish`, which sees the absence of `evidence.gate_passed=true`
and says so in its summary.

**3. Hard gates — first failure halts the chain and routes to mayor.**

Helper:
```bash
halt_gate() {
    local gate="$1"
    local detail="$2"
    gc bd update "$ROOT_ID" \\
      --set-metadata "gc.halt_chain=true" \\
      --set-metadata "gc.escalate_to=mayor" \\
      --set-metadata "summary_for_human=Auto-push eligibility halt for issue #${ISSUE_NUM}: ${gate}: ${detail}. Branch ${BRANCH} ready at $(git rev-parse HEAD) for human review. Escalating to mayor for routing decision."
    gc bd close "$ROOT_ID" --reason "auto-push gate halt: ${gate}"
    exit 0
}
```

  a. **kill-switch** (checked first so the gate fails fast when disarmed):
  ```bash
PUBLISH_OWNER=$(cat <<'OWNER'
{{publish_owner}}
OWNER
)
  if [ ! -e "${HOME}/.gc/auto-push-armed.flag" ]; then
      gc bd update "$ROOT_ID" \\
        --set-metadata "evidence.review_required=true" \\
        --set-metadata "gc.halt_chain=true" \\
        --set-metadata "gc.escalate_to=mayor" \\
        --set-metadata "summary_for_human=Readiness-gate switch ${HOME}/.gc/auto-push-armed.flag is absent, so no readiness evidence was recorded for issue #${ISSUE_NUM}. Halting at branch-ready; nothing was published, and publishing stays $PUBLISH_OWNER's hand-off either way."
      gc bd close "$ROOT_ID" --reason "auto-push gate halt: kill-switch absent"
      exit 0
  fi
  ```

  b. **diff-size** — `git diff origin/main...HEAD --numstat` added+removed ≤ 500:
  ```bash
  DIFF_LOC=$(git diff origin/main...HEAD --numstat | awk '{a+=$1; r+=$2} END {print (a+r)+0}')
  if [ "${DIFF_LOC:-0}" -gt 500 ]; then
      halt_gate "diff-size" "${DIFF_LOC} LOC > 500 cap"
  fi
  ```

  c. **diff-files** — files changed ≤ 8:
  ```bash
  DIFF_FILES=$(git diff origin/main...HEAD --name-only | wc -l | tr -d ' ')
  if [ "${DIFF_FILES:-0}" -gt 8 ]; then
      halt_gate "diff-files" "${DIFF_FILES} files > 8 cap"
  fi
  ```

  d. **path-protection** — no paths matching the repo-agnostic baseline
  (`.github/**`, `**/secrets/**`, `.beads/**`, `**/migrations/**`,
  `hooks/**`) plus any city-supplied patterns in `GC_PROTECTED_PATHS`
  (a `|`-delimited list of POSIX extended-regex patterns matched against
  `git diff --name-only` output). The baseline covers paths that are
  sensitive in any repo; a city whose target repo has its own critical
  surfaces extends it via the env var — e.g. a Go control-plane city
  protects its runtime with
  `GC_PROTECTED_PATHS='^cmd/[^/]+/dispatch_runtime\\.go$|^cmd/[^/]+/session_lifecycle_[^/]+\\.go$|^internal/api/|^internal/config/|^bin/'`:
  ```bash
  BASELINE='^\\.github/|(^|/)secrets/|^\\.beads/|(^|/)migrations/|^hooks/'
  PATTERN="$BASELINE"
  [ -n "${GC_PROTECTED_PATHS:-}" ] && PATTERN="${PATTERN}|${GC_PROTECTED_PATHS}"
  PROTECTED=$(git diff origin/main...HEAD --name-only | grep -E "$PATTERN" || true)
  if [ -n "$PROTECTED" ]; then
      OFFENDERS=$(echo "$PROTECTED" | tr '\\n' ',' | sed 's/,$//')
      halt_gate "path-protection" "touches protected paths: ${OFFENDERS}"
  fi
  ```

  e. **issue-label** — none of {breaking-change, requires-design,
  requires-discussion, epic, tracking, arch, discussion-needed, policy}:
  ```bash
  UPSTREAM_REPO=$(gh repo view --json parent --jq '.parent.nameWithOwner // empty')
  [ -z "$UPSTREAM_REPO" ] && UPSTREAM_REPO=$(gh repo view --json nameWithOwner --jq '.nameWithOwner')
  LABELS=$(gh issue view "$ISSUE_NUM" --repo "$UPSTREAM_REPO" --json labels --jq '[.labels[].name] | join(",")')
  BLOCKERS=""
  for L in breaking-change requires-design requires-discussion epic tracking arch discussion-needed policy; do
      echo ",$LABELS," | grep -q ",${L}," && BLOCKERS="${BLOCKERS}${L},"
  done
  if [ -n "$BLOCKERS" ]; then
      halt_gate "issue-label" "blocking labels: ${BLOCKERS%,}"
  fi
  ```

  f. **issue-state** — OPEN, no existing open PR referencing via Fixes/Closes:
  ```bash
  STATE=$(gh issue view "$ISSUE_NUM" --repo "$UPSTREAM_REPO" --json state --jq '.state')
  if [ "$STATE" != "OPEN" ]; then
      halt_gate "issue-state" "issue #${ISSUE_NUM} state=${STATE}, expected OPEN"
  fi
  EXISTING_PR=$(gh pr list --repo "$UPSTREAM_REPO" --state open \\
      --search "in:body \\"Fixes #${ISSUE_NUM}\\" OR \\"Closes #${ISSUE_NUM}\\"" \\
      --json url --jq '.[0].url // empty')
  if [ -n "$EXISTING_PR" ]; then
      halt_gate "issue-state" "existing open PR references issue #${ISSUE_NUM}: ${EXISTING_PR}"
  fi
  ```

  g. **base-ci** — no fresh main CI failure within 6h:
  ```bash
  SIX_H_AGO=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \\
      || python3 -c "import datetime; print((datetime.datetime.utcnow() - datetime.timedelta(hours=6)).strftime('%Y-%m-%dT%H:%M:%SZ'))")
  FRESH_FAIL=$(gh run list --repo "$UPSTREAM_REPO" --branch main \\
      --status failure --limit 5 --json createdAt \\
      --jq "[.[] | select(.createdAt >= \\"$SIX_H_AGO\\")] | length")
  if [ "${FRESH_FAIL:-0}" -gt 0 ]; then
      halt_gate "base-ci" "${FRESH_FAIL} fresh main CI failure(s) within 6h; refusing to stack auto-push on a broken base"
  fi
  ```

  h. **commit-count** — ≤ 5 commits ahead of origin/main:
  ```bash
  COMMITS=$(git rev-list origin/main..HEAD --count)
  if [ "${COMMITS:-0}" -gt 5 ]; then
      halt_gate "commit-count" "${COMMITS} commits ahead > 5 cap; squash before auto-push"
  fi
  ```

  i. **branch-name** — matches `^(fix|feat)/.+-[0-9]+$`:
  ```bash
  if ! echo "$BRANCH" | grep -qE '^(fix|feat)/.+-[0-9]+$'; then
      halt_gate "branch-name" "${BRANCH} does not match ^(fix|feat)/.+-[0-9]+\\$ — conventional naming required for auto-push class"
  fi
  ```

  j. **polecat-confidence** — must equal "high" (read from
  `metadata.polecat_confidence` written by an earlier step; default
  "medium" treated as gate-fail):
  ```bash
  CONFIDENCE=$(gc bd show "$ROOT_ID" --json | jq -r '.[0].metadata.polecat_confidence // "medium"')
  if [ "$CONFIDENCE" != "high" ]; then
      halt_gate "polecat-confidence" "polecat_confidence=${CONFIDENCE}, required: high"
  fi
  ```

**4. All gates passed — write the readiness evidence:**

```bash
gc bd update "$ROOT_ID" \\
  --set-metadata "evidence.gate_passed=true" \\
  --set-metadata "evidence.gate_diff_loc=${DIFF_LOC}" \\
  --set-metadata "evidence.gate_diff_files=${DIFF_FILES}" \\
  --set-metadata "evidence.gate_commits=${COMMITS}" \\
  --set-metadata "evidence.gate_confidence=${CONFIDENCE}"
echo "[gate-publish-readiness] all gates pass; readiness evidence written."
```

This evidence is read by a HUMAN publisher, not by a hook. It arms
nothing. The `GASCITY_SHIP_BYPASS` token this step used to export was
retired, along with the `gascity-ship-gate` carve-out that
consumed it. Under the recommended read-only pool credential no token
written here can make an upstream write succeed; with a write-capable
credential, nothing in this step stops one, which is why none is written.

**Exit criteria:** Either halted (root closed, `gc.halt_chain=true` and
`gc.escalate_to=mayor` set, summary_for_human routes to mayor) or cleared
(evidence.gate_passed=true written; molecule advances to
hand-off-publish)."""

[[steps]]
id = "hand-off-publish"
title = "Record the publish hand-off for the publisher"
needs = ["gate-publish-readiness"]
description = """
The pool half of this chain ENDS HERE. This step performs NO upstream
write: no `git push`, no `gh pr create`, no `gh` write verb of any kind.
It resolves the identifiers a publisher needs, composes the PR title and
body, records the exact commands that would publish the branch, and
closes the molecule at branch-ready.

**Why this step does not publish.** The recommended deployment gives unattended pool seats a READ-ONLY
`GH_TOKEN`. Without it the pool itself can publish, and nothing but this
formula's prose stands between an unreviewed branch and the forge. Under that
deployment a push or a create from here cannot succeed whatever the
formula says, and the old `GASCITY_SHIP_BYPASS` carve-out armed a bypass
for a write that then failed at the forge, AFTER the implementation work
was done. The work stays in the pool; the write moves to the publisher
named by `publish_owner`, who runs it from its own login after a human
has approved that specific artifact.

**1. Find the root bead and resolve identifiers:**
```bash
ROOT_ID=$(gc bd mol current --json | jq -r '.molecule_id')
BRANCH=$(git branch --show-current)
ISSUE_NUM={{issue_number}}
SKIP_OPEN_PR="{{skip_open_pr}}"
GATE_PASSED=$(gc bd show "$ROOT_ID" --json | jq -r '.[0].metadata."evidence.gate_passed" // ""')
COMMIT_SHA=$(git rev-parse HEAD)
```

**2. Resolve the publish identifiers. These are READS.**

`gh repo view` and `gh issue view` are reads and work under the pool's
read-only credential. Resolving them here is what makes the recorded
commands exact rather than templates the publisher has to fill in:
```bash
FORK_REPO=$(gh repo view --json nameWithOwner --jq '.nameWithOwner')
FORK_OWNER=$(echo "$FORK_REPO" | cut -d/ -f1)
UPSTREAM_REPO=$(gh repo view --json parent --jq '.parent.nameWithOwner // empty')
[ -n "$UPSTREAM_REPO" ] || UPSTREAM_REPO="$FORK_REPO"
UPSTREAM_BASE=$(gh repo view "$UPSTREAM_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name // "main"')
ISSUE_TITLE=$(gh issue view "$ISSUE_NUM" --repo "$UPSTREAM_REPO" --json title --jq '.title')
```

If one of these reads fails, record what you did resolve and name the one
that failed. A missing identifier makes the hand-off less useful; it does
not make the branch less finished, and it is never a reason to attempt a
write.

**3. Compose the PR title and body, and leave them on disk.**

Not a `mktemp`: the publisher runs in a different process, so a temp file
deleted at the end of this step is no use to them. Composing the body is
real work and it stays in the pool; only the write leaves:
```bash
PLAN_PATH=".gc/pr-pipeline/plans/issue-${ISSUE_NUM}.md"
PR_MARKER="<!-- gc-pr-bead-id:${ROOT_ID} -->"
BODY_DIR="${GC_CITY_PATH:?}/.gc/staged-gh/$ROOT_ID-issue-${ISSUE_NUM}"
mkdir -p "$BODY_DIR"
PR_BODY_PATH="$BODY_DIR/pr-body.md"
cat > "$PR_BODY_PATH" <<MD
Fixes #$ISSUE_NUM.

Closes #$ISSUE_NUM.

Generated by mol-pr-from-issue from issue #$ISSUE_NUM. See plan at $PLAN_PATH.

$PR_MARKER
MD
```

PR title: a conventional-commit style summary derived from the issue.
Set it as `PR_TITLE` here; it goes into `evidence.pr_title` and, shell-
quoted, into the create command below. Do not leave a placeholder for the
publisher to invent:
```bash
PR_TITLE=$(cat <<'TITLE'
<conventional commit summary>
TITLE
)
```

**4. Record the exact publish commands on the root bead.**

Two commands, in the order the publisher runs them, with every identifier
already resolved. Anything they have to edit is a defect in this step:
```bash
PUBLISH_OWNER=$(cat <<'OWNER'
{{publish_owner}}
OWNER
)
GIT_DIR_ABS=$(git rev-parse --path-format=absolute --git-common-dir)
git update-ref "refs/staged-gh/$ROOT_ID" "$COMMIT_SHA"
PUBLISH_PUSH="git --git-dir=$(printf %q "$GIT_DIR_ABS") push $(printf %q "https://github.com/$FORK_REPO.git") $(printf %q "$COMMIT_SHA:refs/heads/$BRANCH")"
PUBLISH_CREATE="gh pr create --repo $(printf %q "$UPSTREAM_REPO") --base $(printf %q "$UPSTREAM_BASE") --head $(printf %q "$FORK_OWNER:$BRANCH") --title $(printf %q "$PR_TITLE") --body-file $(printf %q "$PR_BODY_PATH")"

gc bd update "$ROOT_ID" \\
  --set-metadata "evidence.artifact_path=git:$COMMIT_SHA" \\
  --set-metadata "evidence.reviewer_verdict=pass" \\
  --set-metadata "evidence.reviewer_agent=<this polecat session>" \\
  --set-metadata "evidence.branch=$BRANCH" \\
  --set-metadata "evidence.commit_sha=$COMMIT_SHA" \\
  --set-metadata "evidence.pr_title=$PR_TITLE" \\
  --set-metadata "evidence.pr_body_path=$PR_BODY_PATH" \\
  --set-metadata "evidence.publish_push_cmd=$PUBLISH_PUSH" \\
  --set-metadata "evidence.publish_create_cmd=$PUBLISH_CREATE" \\
  --set-metadata "evidence.publish_owner=$PUBLISH_OWNER" \\
  --set-metadata "gc.outcome=branch-ready"
```

**5. Close the molecule at branch-ready.**

Three terminal shapes, distinguishable by `summary_for_human`. All three
are the SAME kind of outcome -- a finished branch that nobody published --
and none of them is a failure:
```bash
PUBLISH_OWNER=$(cat <<'OWNER'
{{publish_owner}}
OWNER
)
if [ "$SKIP_OPEN_PR" = "true" ]; then
    REASON="skip_open_pr=true; branch ready to publish"
    NOTE="skip_open_pr=true was set, so the publish-readiness gate was not consulted."
elif [ "$GATE_PASSED" = "true" ]; then
    REASON="publish-readiness gate passed; branch ready to publish"
    NOTE="The publish-readiness gate passed; its evidence is on this bead for the publisher to weigh."
else
    REASON="auto_push not armed; branch ready to publish"
    NOTE="auto_push was not armed, so the publish-readiness gate did not run. The branch is finished regardless."
fi

gc bd update "$ROOT_ID" --set-metadata "summary_for_human=Branch $BRANCH is ready at $COMMIT_SHA for issue #$ISSUE_NUM: $ISSUE_TITLE. Nothing has been pushed and no pull request exists. $NOTE Publishing is $PUBLISH_OWNER's step, from its own login, after a human approves this artifact; the exact push and create commands are on this bead as evidence.publish_push_cmd and evidence.publish_create_cmd."
gc bd close "$ROOT_ID" --reason "$REASON"
```

**Do not treat an unpublished branch as unfinished work.** The generated bd
session-completion workflow says work is not complete until `git push`
succeeds. That does not reach this formula: on a publication-hold rig a
reviewed, unpushed branch is the correct terminal state.

**Exit criteria:** publish commands recorded on the root bead, PR body on
disk, molecule closed at branch-ready. No upstream write performed."""

[[steps]]
id = "drain"
title = "Signal completion"
needs = ["hand-off-publish"]
description = """
Final step. Signal the controller to reclaim this polecat session.

```bash
gc runtime drain-ack
```

Run this command and nothing else. The molecule completes when this step
closes. The downstream loop-close handler picks up the root bead close
and surfaces `metadata.summary_for_human` to the originating Slack thread
via the PL.

**Exit criteria:** drain-ack signaled; molecule complete."""
