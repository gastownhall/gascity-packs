[runtime]
work_graph = "beads"
execution = "gas-city"
state_store = "gas-city"
review_evidence = "gc.build.review.v1"
ordinary_artifacts = [
  "gc.build.requirements.v1",
  "gc.build.plan.v1",
  "gc.build.decomposition.v1",
  "gc.build.implementation-summary.v1",
  "gc.build.review.v1",
  "gc.build.final-report.v1",
]

[selectors]
planning_formula = "pstack-planning"
decomposition_formula = "pstack-decomposition"
implementation_formula = "pstack-implementation"
implementation_item_formula = "pstack-work-item"
code_review_formula = "pstack-review"
review_fix_formula = "pstack-fix-loop"

[modes]
interaction_mode = ["interactive", "autonomous", "headless"]
review_mode = ["report", "agent", "interactive"]
implementation_strategy = ["drain", "convoy-step"]
drain_policy = ["separate", "same-session"]
