description = "Fan out bounded durable investigation work and aggregate claims."
formula = "pstack-swarm"
version = 1

target_required = false

[requires]
formula_compiler = ">=2.0.0"

[catalog]
name = "pstack-swarm"
description = "Sequential fanout and fanin frame. Gas City does not expand gc.graph_operator."

[[steps]]
id = "frame"
title = "Frame swarm"
metadata = { "gc.run_target" = "pstack.coordinator", "gc.build.artifact_schema" = "pstack.decision.v1", "gc.build.artifact_path_keys" = "pstack.artifact_path", "pstack.artifact_schema" = "pstack.decision.v1", "pstack.artifact_path" = ".gc/pstack/swarm-frame.md" }
description_file = "../assets/workflows/pstack-methods/frame.md"
[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "fanout"
title = "Fan out durable child work"
needs = ["frame"]
metadata = { "gc.run_target" = "pstack.investigator", "gc.graph_operator" = "fanout" }
description_file = "../assets/workflows/pstack-methods/fanout.md"

[[steps]]
id = "fanin"
title = "Aggregate child claims"
needs = ["fanout"]
metadata = { "gc.run_target" = "pstack.review-synthesizer", "gc.graph_operator" = "fanin", "gc.build.artifact_schema" = "pstack.swarm-result.v1", "gc.build.artifact_path_keys" = "pstack.artifact_path", "pstack.artifact_schema" = "pstack.swarm-result.v1", "pstack.artifact_path" = ".gc/pstack/swarm-result.md" }
description_file = "../assets/workflows/pstack-methods/fanin.md"
[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
