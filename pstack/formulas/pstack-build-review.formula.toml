description = "Gas City review fanout and bounded PStack fix loop."
formula = "pstack-build-review"
type = "expansion"
version = 1
contract = "graph.v2"

[vars]
[vars.implementation_target]
description = "Role target used to apply review findings."
default = "pstack.implementation-worker"
[vars.artifact_path_keys]
description = "Comma-separated artifact metadata keys accepted by the review report validator."
default = "gc.build.review_report_path"

[[template]]
id = "{target}.setup-pstack-review"
title = "Prepare PStack review"
metadata = { "gc.run_target" = "pstack.coordinator" }
description_file = "../assets/workflows/pstack-build-review/{target}.setup-pstack-review.md"

[[template]]
id = "{target}.pstack-review-loop"
title = "Run PStack review until approved"
needs = ["{target}.setup-pstack-review"]
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/pstack-build-review/{target}.pstack-review-loop.md"

[template.check]
max_attempts = 6

[template.check.check]
mode = "exec"
path = ".gc/scripts/checks/implementation-review-approved.sh"
timeout = "10m"

[[template.children]]
id = "{target}.acceptance-review"
title = "PStack acceptance review"
metadata = { "gc.run_target" = "pstack.reviewer" }
description_file = "../assets/workflows/pstack-build-review/{target}.acceptance-review.md"

[[template.children]]
id = "{target}.gap-analysis-review"
title = "PStack gap analysis review"
metadata = { "gc.run_target" = "pstack.reviewer" }
description_file = "../assets/workflows/pstack-build-review/{target}.gap-analysis-review.md"

[[template.children]]
id = "{target}.synthesize-review"
title = "Synthesize PStack review"
needs = ["{target}.acceptance-review", "{target}.gap-analysis-review"]
metadata = { "gc.run_target" = "pstack.review-synthesizer" }
description_file = "../assets/workflows/pstack-build-review/{target}.synthesize-review.md"

[[template.children]]
id = "{target}.apply-review-findings"
title = "Apply PStack review findings"
needs = ["{target}.synthesize-review"]
metadata = { "gc.run_target" = "{implementation_target}", "gc.continuation_group" = "pstack-review-fixes" }
description_file = "../assets/workflows/pstack-build-review/{target}.apply-review-findings.md"

[[template]]
id = "{target}"
title = "Finalize PStack review"
needs = ["{target}.pstack-review-loop"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.build.artifact_schema" = "gc.build.review.v1", "gc.build.artifact_path_keys" = "{artifact_path_keys}" }
description_file = "../assets/workflows/pstack-build-review/{target}.md"

[template.check]
max_attempts = 3

[template.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
