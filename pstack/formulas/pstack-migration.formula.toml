description = "PStack migrate callers before deleting legacy APIs."
formula = "pstack-migration"
version = 1

extends = ["pstack-build"]
target_required = true

[requires]
formula_compiler = ">=2.0.0"

[catalog]
name = "pstack-migration"
description = "PStack migrate callers before deleting legacy APIs."

[[steps]]
id = "callers"
title = "Inventory and classify callers"
needs = ["requirements"]
metadata = { "gc.run_target" = "pstack.architect", "pstack.artifact_schema" = "gc.build.decomposition.v1" }
description_file = "../assets/workflows/pstack-variants/pstack-migration/callers.md"

[[steps]]
id = "lever"
title = "Pilot migration lever"
needs = ["callers"]
metadata = { "gc.run_target" = "pstack.architect", "gc.build.artifact_schema" = "pstack.lever-decision.v1", "gc.build.artifact_path_keys" = "pstack.artifact_path", "pstack.artifact_schema" = "pstack.lever-decision.v1", "pstack.artifact_path" = "{{artifact_root}}/pstack/lever-decision.md" }
description_file = "../assets/workflows/pstack-variants/pstack-migration/lever.md"
[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "principle-selection"
title = "Select principles after migration lever"
needs = ["requirements", "lever"]
metadata = { "gc.run_target" = "pstack.investigator", "gc.build.artifact_schema" = "pstack.principle-application.v1", "gc.build.artifact_path_keys" = "pstack.artifact_path", "pstack.artifact_schema" = "pstack.principle-application.v1", "pstack.artifact_path" = "{{artifact_root}}/pstack/principle-selection.md", "pstack.principle_manifest" = "{{principle_manifest}}" }
description_file = "../assets/workflows/pstack-build/principles.md"
[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "migrate"
title = "Migrate callers in waves"
needs = ["lever", "implement", "implement-same-session"]
metadata = { "gc.run_target" = "pstack.architect" }
description_file = "../assets/workflows/pstack-variants/pstack-migration/migrate.md"

[[steps]]
id = "delete"
title = "Delete legacy API after callers move"
needs = ["migrate"]
metadata = { "gc.run_target" = "pstack.architect" }
description_file = "../assets/workflows/pstack-variants/pstack-migration/delete.md"

[[steps]]
id = "verify"
title = "Verify absence and compatibility"
needs = ["delete"]
metadata = { "gc.run_target" = "pstack.verifier", "gc.build.artifact_schema" = "pstack.verification.v1", "gc.build.artifact_path_keys" = "pstack.artifact_path", "pstack.artifact_schema" = "pstack.verification.v1", "pstack.artifact_path" = "{{artifact_root}}/pstack/verification.md" }
description_file = "../assets/workflows/pstack-variants/pstack-migration/verify.md"
[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "finalize"
title = "Finalize pstack migration"
needs = ["review", "verify"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.build.artifact_schema" = "gc.build.final-report.v1", "gc.build.artifact_path_keys" = "gc.build.final_report_path" }
description_file = "../assets/workflows/pstack-build/finalize.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
