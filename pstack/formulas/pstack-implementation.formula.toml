description = "PStack implementation of the public implement methodology contract."
formula = "pstack-implementation"
version = 1

extends = ["implement"]
target_required = true
internal = true

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.implementation_target]
description = "PStack implementation role."
default = "pstack.implementation-worker"

[[steps]]
id = "drain-separate"
title = "Drain PStack work in separate sessions"
needs = ["prepare"]
condition = "{{drain_policy}} == separate"
metadata = { "gc.run_target" = "{{implementation_target}}" }
description_file = "../assets/workflows/pstack-implementation/drain-separate.md"

[steps.drain]
context = "separate"
formula = "pstack-work"
member_access = "exclusive"

[[steps]]
id = "drain-same-session"
title = "Drain PStack work in one shared session"
needs = ["prepare"]
condition = "{{drain_policy}} == same-session"
metadata = { "gc.run_target" = "{{implementation_target}}" }
description_file = "../assets/workflows/pstack-implementation/drain-same-session.md"

[steps.drain]
context = "shared"
formula = "pstack-work-item"
on_item_failure = "skip_remaining"
member_access = "exclusive"

[steps.drain.item]
single_lane = true
