description = "PStack explain how a bounded system or workflow works."
formula = "pstack-how"
version = 1
contract = "graph.v2"
target_required = false
mode = "report"

[catalog]
name = "pstack-how"
description = "PStack explain how a bounded system or workflow works."

[vars]
[vars.subject_path]
description = "Input context or subject path."
required = true

[vars.artifact_path]
description = "Output evidence artifact path."
required = true

[[steps]]
id = "collect"
title = "Collect bounded evidence"
metadata = { "gc.run_target" = "pstack.investigator", "pstack.skill" = "how" }
description_file = "../assets/workflows/pstack-methods/collect.md"

[[steps]]
id = "write"
title = "Write PStack evidence"
needs = ["collect"]
metadata = { "gc.run_target" = "pstack.investigator", "gc.build.artifact_schema" = "pstack.decision.v1", "gc.build.artifact_path_keys" = "pstack.artifact_path", "pstack.artifact_schema" = "pstack.decision.v1", "pstack.artifact_path" = "{{artifact_path}}" }
description_file = "../assets/workflows/pstack-methods/write.md"
[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
