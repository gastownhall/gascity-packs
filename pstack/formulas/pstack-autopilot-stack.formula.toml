description = "PStack compose stack-oriented bounded builds."
formula = "pstack-autopilot-stack"
version = 1

extends = ["pstack-build"]
target_required = true

[requires]
formula_compiler = ">=2.0.0"

[catalog]
name = "pstack-autopilot-stack"
description = "PStack compose stack-oriented bounded builds."

[[steps]]
id = "frontier"
title = "Select rolling frontier"
needs = ["requirements"]
metadata = { "gc.run_target" = "pstack.architect", "gc.build.artifact_schema" = "pstack.frontier.v1", "gc.build.artifact_path_keys" = "pstack.artifact_path", "pstack.artifact_schema" = "pstack.frontier.v1", "pstack.artifact_path" = "{{artifact_root}}/pstack/frontier.md" }
description_file = "../assets/workflows/pstack-variants/pstack-autopilot-stack/frontier.md"
[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "run"
title = "Run bounded stack build"
needs = ["frontier"]
metadata = { "gc.run_target" = "pstack.architect" }
description_file = "../assets/workflows/pstack-variants/pstack-autopilot-stack/run.md"

[[steps]]
id = "verify"
title = "Verify stack outcome"
needs = ["run", "implement", "implement-same-session"]
metadata = { "gc.run_target" = "pstack.verifier", "gc.build.artifact_schema" = "pstack.verification.v1", "gc.build.artifact_path_keys" = "pstack.artifact_path", "pstack.artifact_schema" = "pstack.verification.v1", "pstack.artifact_path" = "{{artifact_root}}/pstack/verification.md" }
description_file = "../assets/workflows/pstack-variants/pstack-autopilot-stack/verify.md"
[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
[[steps]]
id = "finalize"
title = "Finalize pstack stack autopilot"
needs = ["review", "verify"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.build.artifact_schema" = "gc.build.final-report.v1", "gc.build.artifact_path_keys" = "gc.build.final_report_path" }
description_file = "../assets/workflows/pstack-build/finalize.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
