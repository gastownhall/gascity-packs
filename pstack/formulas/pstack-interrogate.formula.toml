description = "Select relevant review dimensions, deduplicate findings, and issue a lead judgment."
formula = "pstack-interrogate"
version = 1

target_required = false

[requires]
formula_compiler = ">=2.0.0"

[catalog]
name = "pstack-interrogate"
description = "Sequential select, review, and judgment. Review lanes are not expanded children."

[[steps]]
id = "select"
title = "Select review dimensions"
metadata = { "gc.run_target" = "pstack.coordinator", "pstack.graph_operator" = "selector" }
description_file = "../assets/workflows/pstack-methods/interrogate-select.md"

[[steps]]
id = "review"
title = "Run selected review lanes"
needs = ["select"]
metadata = { "gc.run_target" = "pstack.reviewer", "gc.graph_operator" = "fanout" }
description_file = "../assets/workflows/pstack-methods/interrogate-review.md"

[[steps]]
id = "judgment"
title = "Deduplicate and issue judgment"
needs = ["review"]
metadata = { "gc.run_target" = "pstack.review-synthesizer", "gc.build.artifact_schema" = "gc.build.review.v1", "gc.build.artifact_path_keys" = "pstack.artifact_path", "pstack.artifact_path" = ".gc/pstack/interrogate-judgment.md" }
description_file = "../assets/workflows/pstack-methods/interrogate-judgment.md"
[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
