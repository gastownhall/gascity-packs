# PStack-specific evidence schema; immutable ID: pstack.standing-orders.v1
schema_id: pstack.standing-orders.v1
artifact: standing-orders
allowed_statuses:
  - draft
  - approved
  - blocked
  - superseded
required_front_matter:
  - schema
  - workflow.id
  - workflow.formula
  - producer.formula
  - producer.stage
  - status
  - trace
required_fields:
  - order
  - trigger
  - scope
  - expiry
  - evidence_target
evidence_fields:
  - source_revision
  - source_path
  - claim_refs
  - verification_status
