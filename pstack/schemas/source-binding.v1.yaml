# PStack-specific evidence schema; immutable ID: pstack.source-binding.v1
schema_id: pstack.source-binding.v1
artifact: source-binding
allowed_statuses:
  - draft
  - approved
  - blocked
  - superseded
required_front_matter:
  - schema
  - workflow.id
  - workflow.formula
  - producer.formula
  - producer.stage
  - status
  - trace
required_fields:
  - source
  - revision
  - path
  - digest
  - license
evidence_fields:
  - source_revision
  - source_path
  - claim_refs
  - verification_status
