# PStack-specific evidence schema; immutable ID: pstack.source-binding.v1
schema_id: pstack.source-binding.v1
artifact: source-binding
allowed_statuses:
  - draft
  - approved
  - blocked
  - superseded
coverage_statuses:
  - covered
  - not_applicable
  - deferred
  - blocked
  - out_of_scope
  - superseded

required_front_matter:
  - schema
  - workflow.id
  - workflow.formula
  - producer.formula
  - producer.stage
  - status
  - producer.attempt
  - trace
required_fields:
  - id
  - source.path
  - source.section
  - source.commit
  - target.formula
  - target.node
  - realization_type
  - rationale
evidence_fields:
  - source_revision
  - source_path
  - claim_refs
  - verification_status
