# PStack-specific evidence schema; immutable ID: pstack.program-status.v1
schema_id: pstack.program-status.v1
artifact: program-status
allowed_statuses:
  - draft
  - approved
  - blocked
  - superseded
required_front_matter:
  - schema
  - workflow.id
  - workflow.formula
  - producer.formula
  - producer.stage
  - status
  - trace
required_fields:
  - goal
  - phase
  - predicate
  - blockers
  - restart_token
  - evidence
evidence_fields:
  - source_revision
  - source_path
  - claim_refs
  - verification_status
