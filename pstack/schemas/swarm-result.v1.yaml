# PStack-specific evidence schema; immutable ID: pstack.swarm-result.v1
schema_id: pstack.swarm-result.v1
artifact: swarm-result
allowed_statuses:
  - draft
  - approved
  - blocked
  - superseded
required_front_matter:
  - schema
  - workflow.id
  - workflow.formula
  - producer.formula
  - producer.stage
  - status
  - trace
required_fields:
  - children
  - claims
  - findings
  - aggregation
  - unresolved
evidence_fields:
  - source_revision
  - source_path
  - claim_refs
  - verification_status
