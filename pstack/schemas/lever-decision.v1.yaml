# PStack-specific evidence schema; immutable ID: pstack.lever-decision.v1
schema_id: pstack.lever-decision.v1
artifact: lever-decision
allowed_statuses:
  - draft
  - approved
  - blocked
  - superseded
coverage_statuses:
  - covered
  - not_applicable
  - deferred
  - blocked
  - out_of_scope
  - superseded

required_front_matter:
  - schema
  - workflow.id
  - workflow.formula
  - producer.formula
  - producer.stage
  - status
  - producer.attempt
  - trace
required_fields:
  - repeated_cost
  - lever
  - pilot
  - fanout_threshold
  - decision
evidence_fields:
  - source_revision
  - source_path
  - claim_refs
  - verification_status
