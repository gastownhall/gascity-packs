# PStack-specific evidence schema; immutable ID: pstack.arena-candidate.v1
schema_id: pstack.arena-candidate.v1
artifact: arena-candidate
allowed_statuses:
  - draft
  - approved
  - blocked
  - superseded
coverage_statuses:
  - covered
  - not_applicable
  - deferred
  - blocked
  - out_of_scope
  - superseded

required_front_matter:
  - schema
  - workflow.id
  - workflow.formula
  - producer.formula
  - producer.stage
  - status
  - producer.attempt
  - trace
required_fields:
  - candidate
  - shape
  - assumptions
  - evidence
  - tradeoffs
evidence_fields:
  - source_revision
  - source_path
  - claim_refs
  - verification_status
