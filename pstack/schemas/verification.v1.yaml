# PStack-specific evidence schema; immutable ID: pstack.verification.v1
schema_id: pstack.verification.v1
artifact: verification
allowed_statuses:
  - verified
  - failed
  - blocked
  - insufficient
coverage_statuses:
  - covered
  - not_applicable
  - deferred
  - blocked
  - out_of_scope
  - superseded

required_front_matter:
  - schema
  - workflow.id
  - workflow.formula
  - producer.formula
  - producer.stage
  - status
  - producer.attempt
  - trace
required_fields:
  - subject.kind
  - subject.id
  - revision
  - checks
  - evidence
  - verdict
evidence_fields:
  - source_revision
  - source_path
  - claim_refs
  - verification_status
