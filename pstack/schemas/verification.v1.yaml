# PStack-specific evidence schema; immutable ID: pstack.verification.v1
schema_id: pstack.verification.v1
artifact: verification
allowed_statuses:
  - draft
  - approved
  - blocked
  - superseded
required_front_matter:
  - schema
  - workflow.id
  - workflow.formula
  - producer.formula
  - producer.stage
  - status
  - trace
required_fields:
  - revision
  - predicate
  - command
  - output
  - scope
  - status
evidence_fields:
  - source_revision
  - source_path
  - claim_refs
  - verification_status
