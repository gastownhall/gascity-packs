description = """
Generate activity digest for the mayor.

After claiming this vapor wisp, run:

```bash
gc bd formula show mol-digest-generate --json
```

Follow the step descriptions in order. When finished, close this bead, then run:

```bash
gc runtime drain-ack
```

The drain-ack tells the controller this session is done.

This is a **periodic formula** — dispatched by the deacon's
`periodic-formulas` step when the cooldown trigger elapses. Configured
in `city.toml` under `[formulas]`:

```toml
[[formulas.periodic]]
formula = "mol-digest-generate"
trigger = "cooldown"
interval = "24h"
pool = "dog"
```

The deacon checks if enough time has passed since the last run
(tracked via `type:order-run` beads), pours a wisp, and labels it
for the dog pool. A dog picks it up and runs this formula.

## What it produces

A formatted markdown digest covering:
- Issues filed and closed (by rig, by type)
- Merge activity
- Incidents and escalations
- Agent health summary
- Trends (backlog direction, throughput)

The digest is mailed to the mayor and archived as a digest bead.

When the city health probe's human-queue check (gc.human_queue.v1) is
present, the digest also renders a **Human Queue** section: per-rig depth,
oldest age and 30-day drain rate of human-attention decision beads, plus
open regulated (GDPR/MDR/PHI/HDS/DPA/DPO) Class B items. Unreadable stores
render as "unreadable", never as zeros.

Read each step's description before acting — Config values override defaults."""
formula = "mol-digest-generate"
phase = "vapor"

[vars]
[vars.period]
description = "The digest period type (daily, weekly)"
default = "daily"

[vars.event_timeout]
description = "Seconds to wait for slow queries before giving up"
default = "30"

[[steps]]
id = "determine-period"
title = "Determine digest time range"
description = """
Establish the time range for this digest.

**1. Determine period type:**
Use {{period}} (from formula vars, defaults to "daily").

**2. Calculate time range:**

| Period | Since | Until |
|--------|-------|-------|
| daily | Yesterday 00:00 UTC | Today 00:00 UTC |
| weekly | Last Monday 00:00 UTC | This Monday 00:00 UTC |

```bash
# For daily:
SINCE=$(date -u -d 'yesterday 00:00' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
        date -u -v-1d -j -f '%H:%M' '00:00' +%Y-%m-%dT%H:%M:%SZ)
UNTIL=$(date -u -d 'today 00:00' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
        date -u -j -f '%H:%M' '00:00' +%Y-%m-%dT%H:%M:%SZ)
```

Note the timestamps for the digest header.

Continue to data collection when the time range is established."""

[[steps]]
id = "collect-data"
title = "Collect activity data from all rigs"
description = """
Gather activity data from each rig.

**1. List rigs:**
```bash
gc rig list
```

**2. For each rig, collect:**

a) **Issues filed and closed:**
```bash
gc bd list --created-after=$SINCE --json --limit=0
gc bd list --status=closed --closed-after=$SINCE --json --limit=0
```

b) **Merge activity:**
```bash
git -C <rig-path> log --merges --since=$SINCE --oneline main
```

c) **Incidents:**
```bash
gc bd list --label=incident --created-after=$SINCE --json
```

**3. Collect town-level data:**

a) **Session lifecycle events:**
```bash
gc events --since=$SINCE --type=session.woke,session.stopped,session.crashed --json
```

b) **Escalations:**
```bash
gc bd list --label=escalation --created-after=$SINCE --json
```

c) **Warrants filed:**
```bash
gc bd list --label=warrant --created-after=$SINCE --json
```

d) **Human Queue stock snapshot** (stock, not flow — per-store depth/age/
drain-rate of human-attention decision beads, measured continuously by the
city health probe, not by this digest):

```bash
cat "${GC_CITY:-$PWD}/.gc/runtime/health.json" \
  | jq '.probes["human-queue"]'
```

The envelope shape (gc.human_queue.v1): `stores[]` carries per store
`store`, `status` ("ok" or "unknown"), `class_a_open`, `class_b_open`,
`class_b_oldest_age_d`, `class_b_filed_30d`, `class_b_closed_30d`,
`class_b_drain_rate`; a city-level `regulated_class_b[]` lists open
regulated (GDPR/MDR/PHI/HDS/DPA/DPO) Class B items with their age.

FAIL-CLOSED RULES — these are what make the section trustworthy:

- A store with `status == "unknown"` is UNREADABLE, not empty. Render it
  as "unreadable" in the digest. NEVER render a missing/None count as 0 —
  "all clear" over a set that was never examined is the exact failure mode
  this probe exists to prevent.
- Class A ("Decide: Merge PR #N" tacit-consent gates) is context only.
  Its consumer is machine gate-sweep; report its depth but do NOT ask the
  human to act on it — a stale Class A is an infra bug, not human work.
- If the file is missing, or `.probes["human-queue"]` is absent/null
  (probe not deployed in this city, or older than the human-queue check),
  SKIP the Human Queue section entirely — write a one-line note
  "(human-queue probe not present this cycle)" instead of an empty or
  zeroed table. Do NOT re-derive the classification from `gc bd list`:
  the deterministic probe owns that logic and duplicating it here is how
  the two drift.

Continue to digest generation when all data is collected."""

[[steps]]
id = "generate-and-send"
title = "Generate digest, send to mayor, archive"
description = """
Transform data into a formatted digest and deliver it.

**1. Generate digest markdown:**

```markdown
# Gas Town {{period}} Digest: {{date}}

## Summary
- **Issues filed**: N (tasks: X, bugs: Y)
- **Issues closed**: N
- **Net change**: +/-N

## By Rig
| Rig | Filed | Closed | Merges |
|-----|-------|--------|--------|
| ... | ...   | ...    | ...    |

## Highlights
- Notable completions
- Incidents (if any)

## Agent Health
- Agents started/stopped/crashed: N/N/N
- Warrants filed: N (pardoned: X, executed: Y)

## Human Queue
(human attention STOCK, from the health probe's gc.human_queue.v1 envelope —
omit this whole section with a one-line note if the probe was absent this
cycle; see the fail-closed rules in the collect-data step)

| Rig | Class A | Class B | Oldest B (d) | 30d filed/closed | Drain |
|-----|---------|---------|--------------|------------------|-------|
| ... | ...     | ...     | ...          | ...              | ...   |

- Unreadable stores (status "unknown"): list them by name — never as zeros.
- Stalled queues (Class B > 0, drain ~0): call out by name at the top.
- Regulated open Class B items (GDPR/MDR/PHI/HDS/DPA/DPO): `<id> (<store>,
  <age>d)`. These are the items that legally cannot be resolved by a timer.
- Class A depth is FYI only (machine gate-sweep owns it); a Class A backlog
  is an infra bug to report, not human work to request.

## Trends
- Backlog: increasing / stable / decreasing
- Throughput: N issues/day
```

**2. Send to mayor:**
```bash
gc mail send mayor/ -s "Gas Town Digest: $DATE" -m "$DIGEST"
```

**3. Archive as bead:**
```bash
gc bd create --type=task \
  --title="Digest: $DATE" \
  --labels=digest,{{period}}
```

**4. Close work bead, signal reconciler, and exit:**
```bash
gc bd close <work-bead> --reason "Digest generated and sent"
gc runtime drain-ack
exit
```

The deacon records this run via a `type:order-run` bead for cooldown
tracking on the next patrol cycle."""
