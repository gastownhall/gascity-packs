  gc bd --rig "$GC_RIG" show "$WORK_BEAD_ID" --json |
  jq -er --arg id "$WORK_BEAD_ID" '
    if type == "array" and length == 1 and .[0].id == $id and
       .[0].status == "open" and ((.[0].assignee // "") == "") and
       ((.[0].metadata // {}) | type) == "object"
    then .[0].metadata.branch // ""
    else error("source identity/state changed")
    end
  ') || exit 1
WITNESS_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness"
if ! gc gastown polecat-step exec \
     --allow-workspace-transition \
     --convoy "{{convoy_id}}" \
     --step-ref "mol-polecat-work.workspace-setup" \
     -- gc gastown polecat-lease workspace \
       --source "$WORK_BEAD_ID" \
       --convoy "{{convoy_id}}" \
