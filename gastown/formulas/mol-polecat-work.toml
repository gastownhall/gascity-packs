description = """
Polecat work lifecycle — feature-branch variant.

Extends mol-polecat-base with feature-branch workspace setup and
refinery-based submission. The polecat creates a feature branch,
implements the work, then pushes and reassigns to the refinery for
merge review.

## Polecat Contract (Self-Cleaning Model)

1. Receive work (molecule poured with this formula, assigned to you)
2. Follow steps in order (read descriptions, execute, move to next)
3. Submit: push branch, set metadata on work bead, assign to refinery, exit
4. You are GONE — Refinery merges, closes the bead

**No MR beads.** Work beads flow directly: pool → polecat → refinery → closed.
The polecat sets `metadata.branch` and `metadata.target` on the work bead
and reassigns it to the refinery. The refinery merges and closes.

**NEVER CLOSE THE SOURCE WORK BEAD.** You must not run `gc bd close` on the
implementation bead or set its status=closed. Even if you believe the code is
already merged, reassign it to refinery — only the refinery verifies merges and
closes source work. Graph-v2 workflow step beads are different: after their
prescribed action succeeds, use the exact completion path in that stage's
description so `gc.outcome=pass`, ownership, and workflow provenance are all
verified. Never substitute `gc bd close` for that path.
`{{base_branch}}` may come from the work bead's own `metadata.target` or
be inherited from a parent convoy with `metadata.target` set.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| binding_prefix | import binding | Agent identity prefix for bound Gas Town imports. |
| affected_tests_command | rig `formula_vars` | Shell-safe command that reads `git diff --name-only origin/{{base_branch}}...HEAD` and runs the matching test subset. Empty = run full `test_command`. |

**Rejection-aware.** If the work bead has `metadata.branch` and
`metadata.rejection_reason`, a previous attempt was rejected by the
refinery. Resume the existing branch — don't redo all the work.

## Failure Modes

| Situation | Action |
|-----------|--------|
| Tests fail | Fix them. Do not proceed with failures. |
| Blocked on external | Mail Witness, mark yourself stuck |
| Context filling | `gc runtime request-restart` (blocks until controller kills you) |
| Unsure what to do | Mail Witness, don't guess |"""
formula = "mol-polecat-work"
extends = ["mol-polecat-base"]

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.binding_prefix]
description = "Import binding prefix for gastown agent identities, including trailing dot when bound."
default = ""

[vars.affected_tests_command]
description = "Shell-safe affected-tests command. Must read `git diff --name-only origin/{{base_branch}}...HEAD` and run the matching test subset. From rig `formula_vars` or empty to run full test_command."
default = ""

[[steps]]
id = "body"
title = "Polecat work body scope"
needs = ["load-context", "workspace-setup", "preflight-tests", "implement", "self-review", "submit-and-exit"]
description = """
Terminal latch for the complete polecat worker lifecycle.

Every agent-visible stage is a member of this scope. Paired `scope-check`
control beads turn a failed stage into a fail-fast scope abort, skip the
remaining worker stages, and close this body with `gc.outcome=fail`.
There is deliberately no teardown step: hard workspace or publication
conflicts must preserve their worktree and lease evidence for recovery."""
metadata = { "gc.kind" = "scope", "gc.scope_name" = "polecat-work", "gc.scope_role" = "body" }

[[steps]]
id = "load-context"
title = "Load context and verify assignment"
description = """
Initialize your session and understand your assignment.

**1. Prime your environment:**
```bash
gc prime                    # Load role context
gc bd prime                    # Load beads context
```

**2. Derive your work bead and check your hook:**
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-polecat-base requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
gc bd list --assignee=$GC_AGENT --status=in_progress
```

The work bead is your assigned issue. Read it carefully:
```bash
gc bd show "$WORK_BEAD_ID"           # Full issue details
gc bd show "$WORK_BEAD_ID" --json | jq '.[0].metadata'  # Check for existing metadata
```

**3. Check for rejection (IMPORTANT):**

If `metadata.rejection_reason` exists, this bead was previously attempted
and rejected by the refinery. Read the reason carefully:
- Rebase conflict → you'll resume the existing branch and rebase
- Test failure → you'll resume the branch and fix the issue

If `metadata.branch` exists, a branch already exists from the prior attempt.
You will use it in workspace-setup instead of creating a new one.

**4. Check inbox for additional context:**
```bash
gc mail inbox
# Read any HANDOFF or assignment messages, then archive after absorbing context
# gc mail read <id> → process → gc mail archive <id>
```

**5. Understand the requirements:**
- What exactly needs to be done?
- What files are likely involved?
- Are there dependencies or blockers?
- What does "done" look like?
- If rejected: what specifically needs fixing?

If blocked or unclear, mail Witness:
```bash
gc mail send <rig>/witness -s "HELP: Unclear requirements" -m "Issue: $WORK_BEAD_ID
Question: <what you need clarified>"
```

**Exit criteria:** You understand the work and can begin.

**Required final action for this stage:** Only after the exit criteria are
true, run exactly:
```bash
gc gastown polecat-step complete \
  --convoy "{{convoy_id}}" \
  --step-ref "mol-polecat-work.load-context"
```
Do not run `gc bd close` on this step. Do not claim the next step until the
command prints `POLECAT_STEP_COMPLETE`."""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "setup", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "polecat-work", "gc.session_affinity" = "require" }

[[steps]]
id = "workspace-setup"
title = "Set up worktree and feature branch"
needs = ["load-context"]
description = """
Ensure you have an isolated git worktree and a clean feature branch.
Every check is idempotent — safe to re-run after crash/restart.

**Config: base_branch = {{base_branch}}**
**Config: setup_command = {{setup_command}}**

`{{base_branch}}` is resolved by `gc sling` in this order:
1. `metadata.target` on the work bead
2. `metadata.target` on the parent convoy chain
3. the rig repo's default branch

**1. Fetch latest and derive your work bead:**
```bash
git fetch --prune origin
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-polecat-work requires an input convoy with exactly one tracked member" >&2
  gc runtime drain-ack
  exit 1
fi
```

**2. Ensure worktree exists.**

Check if `metadata.work_dir` already records your worktree path:
```bash
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.work_dir // empty')
```

**If worktree path exists in metadata** — reuse it:
```bash
cd "$WORKTREE"              # Enter existing worktree
```
If the directory is missing (witness cleaned it, disk issue), fall through
to create a new one.

**If no worktree** — create one scoped to the bead, not the agent:
```bash
WORKTREE_PATH=$(pwd)/worktrees/"$WORK_BEAD_ID"
git worktree add "$WORKTREE_PATH" --detach origin/{{base_branch}}
cd "$WORKTREE_PATH"
```
Record immediately so restarts and witness recovery can find it:
```bash
gc bd update "$WORK_BEAD_ID" --set-metadata work_dir="$WORKTREE_PATH"
```

Worktrees are scoped to the work bead (not the agent name) so that:
- An agent can pick up new work even if an old worktree is being recovered
- Multiple orphaned worktrees can coexist without collision
- The witness cleans them independently per-bead

**3. Ensure branch exists.**

Check if `metadata.branch` already records a branch:
```bash
BRANCH=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.branch // empty')
```

**If branch exists in metadata** — use the deterministic lease command.
It performs authoritative synchronization and, for a rejected branch, owns
the detached rebase plus the crash-safe Git ref transactions. Do not reproduce
that protocol manually or replace its lease refs with bead metadata:
```bash
WITNESS_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness"
if ! gc gastown polecat-lease workspace \
     --source "$WORK_BEAD_ID" \
     --convoy "{{convoy_id}}" \
     --base "{{base_branch}}" \
     --branch "$BRANCH" \
     --witness "$WITNESS_TARGET"; then
    echo "Deterministic workspace/lease recovery stopped; follow its exact diagnostic." >&2
    exit 1
fi
```

If the command reports a rebase conflict, resolve it while detached and run
`git rebase --continue`. Then explicitly publish the reviewed result:
```bash
gc gastown polecat-lease publish-rebase \
  --source "$WORK_BEAD_ID" \
  --convoy "{{convoy_id}}" \
  --base "{{base_branch}}" \
  --branch "$BRANCH" \
  --witness "$WITNESS_TARGET"
```
Never reset or recreate `refs/gascity/polecat-push-leases/*`. They are the
authoritative crash/race state; the similarly named bead metadata is only a
verified operator-visible mirror.

**If no branch** — create one and record it. Always branch from the
freshly-fetched `origin/{{base_branch}}`, never from local
{{base_branch}} or whatever branch happens to be checked out.
Polecat worktrees are reused across beads, so the local copy of
{{base_branch}} may lag the remote — branching from a stale local ref
inherits already-merged commits with stale hashes and causes the next
refinery rebase to reject for spurious "duplicate" conflicts.

```bash
git fetch origin {{base_branch}}                     # ensure origin ref is current
BRANCH="polecat/$WORK_BEAD_ID"
git branch -D "$BRANCH" 2>/dev/null || true          # drop any stale local branch with the same name
git checkout -B "$BRANCH" "origin/{{base_branch}}"   # force-create from the freshly-fetched remote tip
gc bd update "$WORK_BEAD_ID" \
  --set-metadata branch="$BRANCH" \
  --set-metadata fork_sha="$(git rev-parse "origin/{{base_branch}}")"
```

Recording the branch early means:
- Witness can find and salvage your work if you crash
- Rejection-aware resume knows which branch to check out
- The submit step updates the metadata (branch may change after rebase)

`fork_sha` is the base commit this branch was cut from. The refinery uses it to
tell a genuine already-merged branch (>=1 commit since fork) from a starved
0-commit branch (tip still at the fork point) when both look like ancestors of
the target.

**4. Ensure clean working state:**
```bash
git status                  # Should be clean
```

**5. Run project setup (if configured):**
```bash
{{setup_command}}
```
Empty setup_command → skip.

**Exit criteria:** In your worktree, on a clean feature branch, rebased
on latest {{base_branch}}, deps installed, worktree and branch recorded
on the bead.

**Required final action for this stage:** Only after the exit criteria are
true, run exactly:
```bash
gc gastown polecat-step complete \
  --convoy "{{convoy_id}}" \
  --step-ref "mol-polecat-work.workspace-setup"
```
Do not run `gc bd close` on this step. Do not claim the next step until the
command prints `POLECAT_STEP_COMPLETE`."""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "setup", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "polecat-work", "gc.session_affinity" = "require" }

[[steps]]
id = "preflight-tests"
title = "Verify pre-flights pass on base branch"
needs = ["workspace-setup"]
description = """
Check if the codebase is healthy BEFORE starting your work.

**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: test_command = {{test_command}}**

**Skip the test commands if resuming a rejected branch** — pre-flights were
already verified on the prior attempt. You must still use the required
completion command below.

**1. Run pre-flights (skip empty commands silently):**
```bash
{{typecheck_command}}
{{lint_command}}
{{test_command}}
```

**2. If pre-flights pass:** proceed.

**3. If pre-flights fail on {{base_branch}}:**

File a bead and proceed. Do NOT fix pre-existing failures — that's
not your assignment.

FORBIDDEN: Pushing to {{base_branch}}. FORBIDDEN: Fixing pre-existing failures.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
gc bd create --title "Pre-existing failure: <description>" --type bug --priority 1
gc mail send <rig>/witness -s "NOTICE: {{base_branch}} has failing pre-flights" \
  -m "Filed: <bead-id>. Proceeding with $WORK_BEAD_ID."
```

**Exit criteria:** Pre-flights pass (or pre-existing bug filed), ready to
implement.

**Required final action for this stage:** Only after the exit criteria are
true, run exactly:
```bash
gc gastown polecat-step complete \
  --convoy "{{convoy_id}}" \
  --step-ref "mol-polecat-work.preflight-tests"
```
Do not run `gc bd close` on this step. Do not claim the next step until the
command prints `POLECAT_STEP_COMPLETE`."""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "polecat-work", "gc.session_affinity" = "require" }

[[steps]]
id = "implement"
title = "Implement the solution"
needs = ["preflight-tests"]
description = """
Do the actual implementation work.

**Working principles:**
- Follow existing codebase conventions
- Make atomic, focused commits
- Keep changes scoped to the assigned issue
- Don't gold-plate or scope-creep

**If resuming a rejected branch:** Read `metadata.rejection_reason`
from load-context. Focus on fixing the specific issue that caused
rejection — don't redo everything.

Derive your work bead in this shell context:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
```

**Commit frequently with detailed messages.** Every commit gets a
subject AND a body. The body is what makes the repo navigable a year
from now — the reviewer (and future-you) needs to understand *why* the
change exists, not just *what* the diff did. The diff already shows
the what.

```bash
git add <files>
git commit -m "<type>: <imperative subject> ($WORK_BEAD_ID)" -m "$(cat <<'BODY'
<1-3 paragraph explanation:>
- The motivation: which bug, regression, design decision, or upstream
  request drove this commit
- What the change actually does at a higher level than the diff
- Anything non-obvious about the approach: trade-offs taken, paths not
  chosen, hidden constraints honored
- Validation: which tests/benchmarks/manual checks confirmed correctness

Note any follow-ups, deferred edge cases, or downstream impacts here.
BODY
)"
```

Commit types: feat, fix, refactor, perf, test, docs, chore

**Examples of strong subjects + bodies:**
- `fix(session): preserve lifecycle metadata during crash adoption (ga-xxxx)`
  body: explains the stale session projection, the resume path that
  lost metadata, the projection update, and the focused adoption test
- `perf(events): batch typed payload registration lookups (ga-xxxx)`
  body: cites the event fan-out profile, names the registry call site
  that drove the regression, and notes why the cache stays read-only

**Weak commits to avoid** (refinery/reviewer can't tell what's going on):
- `fix: stuff (ga-xxxx)`
- `perf: speed up the slow loop`
- `refactor` with no body

**Discovered work (outside scope):**
```bash
gc bd create --title "Found: <description>" --type bug --priority 2
```
Do NOT fix unrelated issues in this branch.

**If stuck (>15 minutes):**
```bash
gc mail send <rig>/witness -s "HELP: Stuck on implementation" -m "Issue: $WORK_BEAD_ID
Problem: <what's blocking you>
Tried: <what you've attempted>"
```

**If context filling up:**
```bash
gc runtime request-restart
```
This blocks until the controller kills your session. The next session
resumes from context (re-reads formula steps, checks git/bead state).

**Exit criteria:** Implementation complete, all changes committed.

**Required final action for this stage:** Only after the exit criteria are
true, run exactly:
```bash
gc gastown polecat-step complete \
  --convoy "{{convoy_id}}" \
  --step-ref "mol-polecat-work.implement"
```
Do not run `gc bd close` on this step. Do not claim the next step until the
command prints `POLECAT_STEP_COMPLETE`."""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "polecat-work", "gc.session_affinity" = "require" }

[[steps]]
id = "self-review"
title = "Self-review and run tests (affected-aware)"
needs = ["implement"]
description = """
Review your changes and verify they work. Override of mol-polecat-base
`self-review` to support affected-test detection — when the rig configures
`affected_tests_command`, only the tests touched by your diff run, instead
of the full suite. Saves polecat time and reduces CI clog from PRs whose
locally-runnable failures should have been caught before push.

**Config: setup_command = {{setup_command}}**
**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: build_command = {{build_command}}**
**Config: test_command = {{test_command}}**
**Config: affected_tests_command = {{affected_tests_command}}**

**1. Review the diff:**
```bash
git diff origin/{{base_branch}}...HEAD
git log --oneline origin/{{base_branch}}..HEAD
git diff --stat origin/{{base_branch}}...HEAD
```

Check for: bugs, security issues, style violations, missing error handling,
debug cruft, unintended file changes. Fix anything you find.

**2. Run quality checks (skip empty commands):**
```bash
{{setup_command}}
{{typecheck_command}}
{{lint_command}}
{{build_command}}
```

**3. Run tests — affected subset if rig provides one, full suite otherwise:**
```bash
if [ -n "{{affected_tests_command}}" ]; then
    # Rig has an affected-tests detector. Run only the tests our diff
    # touches — same logic the rig's CI uses to dispatch test workflows.
    # The command must read `git diff --name-only origin/{{base_branch}}...HEAD`
    # internally and execute the relevant test subset.
    {{affected_tests_command}}
else
    # No affected detector — run the full suite (legacy behavior).
    {{test_command}}
fi
```

**ALL CHECKS MUST PASS.** If your change caused the failure, fix it.
If pre-existing, file a bead.

Refusing to push on local failure is a feature: the rig's CI will run the
same affected subset (and more), and a PR that already fails locally will
fail in CI too — wasting reviewer attention and CI minutes. Fix before
submitting.

**4. Ensure everything is committed:**
```bash
git status                  # Must be clean
git log origin/{{base_branch}}..HEAD --oneline  # Must show your commits
```

If uncommitted changes exist, commit them with a body explaining what
slipped through the `implement` step (typically a self-review touch-up,
test addition, or formatter run):
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
git add -A
git commit -m "<type>: <imperative subject> ($WORK_BEAD_ID)" -m "$(cat <<'BODY'
<Explain what these residual changes are: a self-review fix,
test-only addition, formatter run, etc. Be specific.>
BODY
)"
```

NEVER discard implementation changes with `git checkout -- .`

**Exit criteria:** All checks pass (affected subset OR full suite), all
changes committed, working tree clean.

**Required final action for this stage:** Only after the exit criteria are
true, run exactly:
```bash
gc gastown polecat-step complete \
  --convoy "{{convoy_id}}" \
  --step-ref "mol-polecat-work.self-review"
```
Do not run `gc bd close` on this step. Do not claim the next step until the
command prints `POLECAT_STEP_COMPLETE`."""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "polecat-work", "gc.session_affinity" = "require" }

[[steps]]
id = "submit-and-exit"
title = "Submit work to refinery and exit"
needs = ["self-review"]
description = """
Hand off your work and self-clean. You cease to exist after this step.

**1. Branch-shape gate (fails closed — non-negotiable).**

Before anything else, verify you are on a per-bead branch. The refinery
merges the branch recorded in your bead's `metadata.branch`, which must
follow the `polecat/<bead-id>` convention; if you push from a different
branch (your agent home branch, a stray local checkout, etc.), the
handoff contract is broken and the bead is permanently stranded as
"assigned to refinery, no merge target". See gastownhall/gascity#2082.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
CURRENT_BRANCH=$(git branch --show-current)
EXPECTED_BRANCH="polecat/$WORK_BEAD_ID"
if [ "$CURRENT_BRANCH" != "$EXPECTED_BRANCH" ]; then
    echo "BRANCH SHAPE GATE FAILED"
    echo "  current branch:  $CURRENT_BRANCH"
    echo "  expected branch: $EXPECTED_BRANCH"
    echo ""
    echo "Refinery handoff merges metadata.branch, which must be 'polecat/<bead-id>'."
    echo "Pushing this commit and reassigning to refinery would strand the work."
    echo ""
    echo "Recover by re-running the workspace-setup step:"
    echo "  - Create the per-bead worktree at \\$(pwd)/worktrees/$WORK_BEAD_ID"
    echo "  - Create branch '$EXPECTED_BRANCH' from origin/{{base_branch}}"
    echo "  - Cherry-pick your commits from $CURRENT_BRANCH onto the new branch"
    echo "  - Re-run submit-and-exit"
    echo ""
    echo "Do NOT proceed past this gate."
    gc runtime drain-ack
    exit 1
fi
```

Also confirm `metadata.branch` reflects this branch (workspace-setup
recorded it, but a divergent local state would be invisible to the
refinery without this re-check):
```bash
METADATA_BRANCH=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.branch // empty')
if [ "$METADATA_BRANCH" != "$EXPECTED_BRANCH" ]; then
    gc bd update "$WORK_BEAD_ID" --set-metadata branch="$EXPECTED_BRANCH"
fi
```

**2. Final clean-state verification (safeguard):**
```bash
git status --porcelain
```
If ANY output (untracked files, uncommitted changes):
```bash
git add -A
git commit -m "chore: capture remaining work ($WORK_BEAD_ID)" -m "$(cat <<'BODY'
<Explain the remaining changes discovered by final clean-state
verification and why they are safe to hand off.>
BODY
)"
```
This is a belt-and-suspenders check — self-review should have caught this,
but we never push with untracked work left behind.

**3. Push your branch:**
```bash
AUTO_PUSH=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata | if has("auto_push") then (.auto_push | tostring) else "" end')
if [ "$AUTO_PUSH" = "false" ]; then
  AUTO_PUSH_BOOL=false
else
  AUTO_PUSH_BOOL=true
fi
WITNESS_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness"
# BEGIN_GASTOWN_POLECAT_LEASE_SUBMIT
if ! gc gastown polecat-lease submit \
     --source "$WORK_BEAD_ID" \
     --convoy "{{convoy_id}}" \
     --base "{{base_branch}}" \
     --branch "$EXPECTED_BRANCH" \
     --witness "$WITNESS_TARGET" \
     --auto-push "$AUTO_PUSH_BOOL"; then
  echo "Deterministic submit/lease command stopped; no refinery handoff is allowed." >&2
  exit 1
fi
# END_GASTOWN_POLECAT_LEASE_SUBMIT
```
For safety, `auto_push=false` is supported only when no rejection-rebase lease
exists. On a rejection-rebased branch the command stops before submit freeze;
the source and live Graph step remain recoverable, and no push or handoff occurs.

```bash
if [ "$AUTO_PUSH" = "false" ]; then
  echo "auto_push=false: halting at branch-ready (no push, no refinery handoff)"
  BRANCH=$(git branch --show-current)
  if ! gc bd update "$WORK_BEAD_ID" \
       --status=open --assignee="" \
       --set-metadata branch="$BRANCH" \
       --set-metadata target={{base_branch}} \
       --set-metadata branch_ready=true \
       --set-metadata halt_reason=auto_push_false \
       --set-metadata gc.routed_to="" \
       --notes "Branch ready: auto_push=false (no push, no refinery handoff)"; then
    echo "Failed to record auto_push=false branch-ready state; refusing to drain." >&2
    exit 1
  fi
  BRANCH_READY_JSON=$(gc bd show "$WORK_BEAD_ID" --json 2>/dev/null)
  BRANCH_READY_CODE=$?
  BRANCH_READY_STATUS=$(printf '%s' "$BRANCH_READY_JSON" | jq -r '.[0].status // empty' 2>/dev/null)
  BRANCH_READY_ASSIGNEE=$(printf '%s' "$BRANCH_READY_JSON" | jq -r '.[0].assignee // empty' 2>/dev/null)
  BRANCH_READY_BRANCH=$(printf '%s' "$BRANCH_READY_JSON" | jq -r '.[0].metadata.branch // empty' 2>/dev/null)
  BRANCH_READY_FLAG=$(printf '%s' "$BRANCH_READY_JSON" | jq -r '.[0].metadata.branch_ready // empty | tostring' 2>/dev/null)
  if [ "$BRANCH_READY_CODE" -ne 0 ] || [ "$BRANCH_READY_STATUS" != "open" ] ||
     [ -n "$BRANCH_READY_ASSIGNEE" ] || [ "$BRANCH_READY_BRANCH" != "$BRANCH" ] ||
     [ "$BRANCH_READY_FLAG" != "true" ]; then
    echo "auto_push=false branch-ready state did not verify; refusing to drain." >&2
    exit 1
  fi

  # Complete this claimed Graph-v2 step only after branch-ready state succeeds.
  # Use an exact, read-only session query: never call gc hook here because it can
  # atomically claim unrelated routed work when the expected step is absent.
  # BEGIN_GASTOWN_AUTO_PUSH_FALSE_STEP_COMPLETION
  EXPECTED_ASSIGNEE="${BEADS_ACTOR:-${GC_SESSION_NAME:-${GC_SESSION_ID:-${GC_AGENT:-}}}}"
  if [ -z "$EXPECTED_ASSIGNEE" ]; then
    echo "Cannot identify the current session assignee; refusing to drain." >&2
    exit 1
  fi
  STEP_LIST_JSON=$(gc bd list --assignee "$EXPECTED_ASSIGNEE" --status=in_progress --limit=0 --json 2>/dev/null)
  STEP_LIST_CODE=$?
  STEP_MATCHES=$(printf '%s' "$STEP_LIST_JSON" | jq -c 'if type == "array" then [.[] | select(.metadata["gc.step_ref"] == "mol-polecat-work.submit-and-exit")] else [] end' 2>/dev/null)
  STEP_COUNT=$(printf '%s' "$STEP_MATCHES" | jq -r 'length' 2>/dev/null)
  if [ "$STEP_LIST_CODE" -ne 0 ] || [ "$STEP_COUNT" != "1" ]; then
    echo "Expected exactly one claimed submit step, found ${STEP_COUNT:-unreadable}; refusing to drain." >&2
    exit 1
  fi
  STEP_BEAD_ID=$(printf '%s' "$STEP_MATCHES" | jq -r '.[0].id // empty' 2>/dev/null)
  if [ -z "$STEP_BEAD_ID" ]; then
    echo "Claimed submit step has no exact id; refusing to drain." >&2
    exit 1
  fi
  STEP_JSON=$(gc bd show "$STEP_BEAD_ID" --json 2>/dev/null)
  STEP_CODE=$?
  STEP_STATUS=$(printf '%s' "$STEP_JSON" | jq -r '.[0].status // empty' 2>/dev/null)
  STEP_ASSIGNEE=$(printf '%s' "$STEP_JSON" | jq -r '.[0].assignee // empty' 2>/dev/null)
  STEP_REF=$(printf '%s' "$STEP_JSON" | jq -r '.[0].metadata["gc.step_ref"] // empty' 2>/dev/null)
  ROOT_BEAD_ID=$(printf '%s' "$STEP_JSON" | jq -r '.[0].metadata["gc.root_bead_id"] // empty' 2>/dev/null)
  if [ "$STEP_CODE" -ne 0 ] || [ "$STEP_STATUS" != "in_progress" ] ||
     [ "$STEP_ASSIGNEE" != "$EXPECTED_ASSIGNEE" ] ||
     [ "$STEP_REF" != "mol-polecat-work.submit-and-exit" ] ||
     [ -z "$ROOT_BEAD_ID" ]; then
    echo "Claimed submit step identity/state mismatch; refusing to drain." >&2
    exit 1
  fi
  ROOT_JSON=$(gc bd show "$ROOT_BEAD_ID" --json 2>/dev/null)
  ROOT_CODE=$?
  ROOT_INPUT_CONVOY=$(printf '%s' "$ROOT_JSON" | jq -r '.[0].metadata["gc.input_convoy_id"] // empty' 2>/dev/null)
  if [ "$ROOT_CODE" -ne 0 ] || [ "$ROOT_INPUT_CONVOY" != "{{convoy_id}}" ]; then
    echo "Claimed submit step does not belong to input convoy {{convoy_id}}; refusing to drain." >&2
    exit 1
  fi
  if ! gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=pass --status=closed \
       --notes "Submit complete: auto_push=false branch-ready state recorded on $WORK_BEAD_ID"; then
    echo "Failed to close claimed submit step $STEP_BEAD_ID; refusing to drain." >&2
    exit 1
  fi
  VERIFY_JSON=$(gc bd show "$STEP_BEAD_ID" --json 2>/dev/null)
  VERIFY_STATUS=$(printf '%s' "$VERIFY_JSON" | jq -r '.[0].status // empty' 2>/dev/null)
  VERIFY_OUTCOME=$(printf '%s' "$VERIFY_JSON" | jq -r '.[0].metadata["gc.outcome"] // empty' 2>/dev/null)
  if [ "$VERIFY_STATUS" != "closed" ] || [ "$VERIFY_OUTCOME" != "pass" ]; then
    echo "Submit step $STEP_BEAD_ID did not verify closed/pass; refusing to drain." >&2
    exit 1
  fi
  gc runtime drain-ack
  # END_GASTOWN_AUTO_PUSH_FALSE_STEP_COMPLETION
  exit 0
fi
```

**4. Update metadata on the work bead:**
```bash
if ! gc bd update "$WORK_BEAD_ID" \
     --set-metadata target={{base_branch}} \
     --notes "Implemented: <brief summary>"; then
  echo "Failed to record refinery handoff metadata; refusing to drain." >&2
  exit 1
fi
```
Branch was recorded in workspace-setup and is already in metadata.
This adds the target for the refinery. If an existing pull request was
provided by the caller, `metadata.existing_pr` is preserved for refinery
validation. The refinery records canonical `pr_url` only after verifying
the PR is open and matches the branch, base, and origin repository.

**5. Reassign to refinery and verify the exact handoff:**
```bash
REFINERY_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery"
if ! gc bd update "$WORK_BEAD_ID" --status=open --assignee="$REFINERY_TARGET" --set-metadata gc.routed_to=""; then
  echo "Failed to assign $WORK_BEAD_ID to $REFINERY_TARGET; refusing to drain." >&2
  exit 1
fi
HANDOFF_JSON=$(gc bd show "$WORK_BEAD_ID" --json 2>/dev/null)
HANDOFF_CODE=$?
HANDOFF_STATUS=$(printf '%s' "$HANDOFF_JSON" | jq -r '.[0].status // empty' 2>/dev/null)
HANDOFF_ASSIGNEE=$(printf '%s' "$HANDOFF_JSON" | jq -r '.[0].assignee // empty' 2>/dev/null)
if [ "$HANDOFF_CODE" -ne 0 ] || [ "$HANDOFF_STATUS" != "open" ] ||
   [ "$HANDOFF_ASSIGNEE" != "$REFINERY_TARGET" ]; then
  echo "Refinery handoff did not verify exact status/assignee; refusing to drain." >&2
  exit 1
fi
```

`${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery` resolves to
`$GC_RIG/{{binding_prefix}}refinery` when running inside a rig session,
or `{{binding_prefix}}refinery` when running in an HQ-only city where
the workspace is the rig. Writing a rendered empty rig prefix produces
`/{{binding_prefix}}refinery` and strands beads outside the refinery pool.

Set `assignee` to the configured refinery named-session identity and clear
`gc.routed_to` because the direct assignment is the handoff. Generic pool
demand is represented by unassigned work with `gc.routed_to=<target>`, so
named-session work should not retain pool-demand metadata.

The refinery will pick this up, rebase onto {{base_branch}}, run tests,
merge, and close the bead. If there's a conflict, the refinery puts the
bead back in the pool with `rejection_reason` metadata — a new polecat
picks it up and resumes from the existing branch.

**6. Clean up the local branch after verified handoff.**

Do not detach or delete the local branch before step 5 verifies the exact
refinery assignment. If the process crashes before that verification, a restart
must still be on the valid per-bead branch so submit-and-exit can retry safely.
After verification, the durable source state is terminal evidence for the
restart guard, so local cleanup is safe.

```bash
BRANCH=$(git branch --show-current)
if [ -n "$BRANCH" ]; then
  if git checkout --detach; then
    git branch -D "$BRANCH" ||
      echo "WARN: verified handoff succeeded, but local branch $BRANCH could not be deleted"
  else
    echo "WARN: verified handoff succeeded, but worktree could not detach from $BRANCH"
  fi
fi
```

Cleanup is best-effort after the verified durable handoff. A cleanup warning
must not undo or duplicate that handoff.

**7. Signal refinery to check for work immediately (belt-and-suspenders):**
```bash
REFINERY_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery"
gc session wake "$REFINERY_TARGET" || true
gc session nudge "$REFINERY_TARGET" "Run 'gc prime' to check merge queue and begin processing." || true
```

The `gc bd update` in step 5 generates a `bead.updated` event the refinery's
event-watch will see, but that can take up to `event_timeout` seconds. Wake
starts a stopped on_demand session; nudge leaves a visible prompt for a running
one as soon as it is ready for input. Failure is non-fatal: the refinery finds
the work on its next poll.

**8. Complete the claimed Graph-v2 step, then signal reconciler and exit.**

The source work bead remains open for the refinery. Close only this formula's
claimed `submit-and-exit` step, and only after the handoff above succeeded.
Use an exact, read-only assignee query: `gc hook --claim` is forbidden here
because it can claim unrelated routed work if the expected step is absent.

```bash
