description = """
Polecat work lifecycle — feature-branch variant.

Extends mol-polecat-base with feature-branch workspace setup and
refinery-based submission. The polecat creates a feature branch,
implements the work, then pushes and reassigns to the refinery for
merge review.

## Polecat Contract (Self-Cleaning Model)

1. Receive work (molecule poured with this formula, assigned to you)
2. Follow steps in order (read descriptions, execute, move to next)
3. Submit: push branch, set metadata on work bead, assign to refinery, exit
4. You are GONE — Refinery merges, closes the bead

**No MR beads.** Work beads flow directly: pool → polecat → refinery → closed.
The polecat sets `metadata.branch` and `metadata.target` on the work bead
and reassigns it to the refinery. The refinery merges and closes.

**NEVER CLOSE THE SOURCE WORK BEAD.** You must not run `gc bd close` on the
implementation bead or set its status=closed. Even if you believe the code is
already merged, reassign it to refinery — only the refinery verifies merges and
closes source work. Graph-v2 workflow step beads are different: after their
prescribed action succeeds, use the exact completion path in that stage's
description so `gc.outcome=pass`, ownership, and workflow provenance are all
verified. Never substitute `gc bd close` for that path.
`{{base_branch}}` may come from the work bead's own `metadata.target` or
be inherited from a parent convoy with `metadata.target` set.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| binding_prefix | import binding | Agent identity prefix for bound Gas Town imports. |
| affected_tests_command | rig `formula_vars` | Shell-safe command that reads `git diff --name-only origin/{{base_branch}}...HEAD` and runs the matching test subset. Empty = run full `test_command`. |

**Rejection-aware.** If the work bead has `metadata.branch` and
`metadata.rejection_reason`, a previous attempt was rejected by the
refinery. Resume the existing branch — don't redo all the work.

## Failure Modes

| Situation | Action |
|-----------|--------|
| Tests fail | Fix them. Do not proceed with failures. |
| Blocked on external | Mail Witness, mark yourself stuck |
| Context filling | `gc runtime request-restart` (blocks until controller kills you) |
| Unsure what to do | Mail Witness, don't guess |"""
formula = "mol-polecat-work"
extends = ["mol-polecat-base"]

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.binding_prefix]
description = "Import binding prefix for gastown agent identities, including trailing dot when bound."
default = ""

[vars.affected_tests_command]
description = "Shell-safe affected-tests command. Must read `git diff --name-only origin/{{base_branch}}...HEAD` and run the matching test subset. From rig `formula_vars` or empty to run full test_command."
default = ""

[[steps]]
id = "body"
title = "Polecat work body scope"
needs = ["load-context", "workspace-setup", "preflight-tests", "implement", "self-review", "submit-and-exit"]
description = """
Terminal latch for the complete polecat worker lifecycle.

Every agent-visible stage is a member of this scope. Paired `scope-check`
control beads turn a failed stage into a fail-fast scope abort, skip the
remaining worker stages, and close this body with `gc.outcome=fail`.
There is deliberately no teardown step: hard workspace or publication
conflicts must preserve their worktree and lease evidence for recovery."""
metadata = { "gc.kind" = "scope", "gc.scope_name" = "polecat-work", "gc.scope_role" = "body" }

[[steps]]
id = "load-context"
title = "Load context and verify assignment"
description = """
Initialize your session and understand your assignment.

**1. Prime your environment:**
```bash
gc prime                    # Load role context
gc bd prime                    # Load beads context
```

**2. Derive your work bead and check your hook:**
```bash
CONVOY_STATUS=$(GC_NO_API=1 gc convoy status "{{convoy_id}}" --json) || exit 1
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -er \
  --arg convoy "{{convoy_id}}" '
  if type == "object" and .schema_version == "1" and
     .convoy.id == $convoy and (.children | type) == "array" and
     (.children | length) == 1 and (.children[0].id | type) == "string" and
     (.children[0].id | length) > 0
  then .children[0].id
  else error("expected exact input convoy with one source")
  end
') || {
  echo "mol-polecat-base requires an input convoy with exactly one tracked member" >&2
  exit 1
}
gc bd list --assignee=$GC_AGENT --status=in_progress
```

The work bead is your assigned issue. Read it carefully:
```bash
CONVOY_STATUS=$(GC_NO_API=1 gc convoy status "{{convoy_id}}" --json) || exit 1
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -er \
  --arg convoy "{{convoy_id}}" '
  if type == "object" and .schema_version == "1" and
     .convoy.id == $convoy and (.children | type) == "array" and
     (.children | length) == 1 and (.children[0].id | type) == "string" and
     (.children[0].id | length) > 0
  then .children[0].id
  else error("expected exact input convoy with one source")
  end
') || {
  echo "mol-polecat-base requires an input convoy with exactly one tracked member" >&2
  exit 1
}
gc bd show "$WORK_BEAD_ID"           # Full issue details
gc bd show "$WORK_BEAD_ID" --json | jq '.[0].metadata'  # Check for existing metadata
```

Every shell fence is independent. Never rely on `WORK_BEAD_ID`, a `cd`, a
function, or another shell variable surviving into a later command.

**3. Check for rejection (IMPORTANT):**

If `metadata.rejection_reason` exists, this bead was previously attempted
and rejected by the refinery. Read the reason carefully:
- Rebase conflict → you'll resume the existing branch and rebase
- Test failure → you'll resume the branch and fix the issue

If `metadata.branch` exists, a branch already exists from the prior attempt.
You will use it in workspace-setup instead of creating a new one.

**4. Check inbox for additional context:**
```bash
gc mail inbox
# Read any HANDOFF or assignment messages, then archive after absorbing context
# gc mail read <id> → process → gc mail archive <id>
```

**5. Understand the requirements:**
- What exactly needs to be done?
- What files are likely involved?
- Are there dependencies or blockers?
- What does "done" look like?
- If rejected: what specifically needs fixing?

If blocked or unclear, mail Witness:
```bash
CONVOY_STATUS=$(GC_NO_API=1 gc convoy status "{{convoy_id}}" --json) || exit 1
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -er \
  --arg convoy "{{convoy_id}}" '
  if type == "object" and .schema_version == "1" and
     .convoy.id == $convoy and (.children | type) == "array" and
     (.children | length) == 1 and (.children[0].id | type) == "string" and
     (.children[0].id | length) > 0
  then .children[0].id
  else error("expected exact input convoy with one source")
  end
') || {
  echo "mol-polecat-base requires an input convoy with exactly one tracked member" >&2
  exit 1
}
gc mail send <rig>/witness -s "HELP: Unclear requirements" -m "Issue: $WORK_BEAD_ID
Question: <what you need clarified>"
```

**Exit criteria:** You understand the work and can begin.

**Required final action for this stage:** Only after the exit criteria are
true, run exactly:
```bash
gc gastown polecat-step complete \
  --convoy "{{convoy_id}}" \
  --step-ref "mol-polecat-work.load-context"
```
Do not run `gc bd close` on this step. Do not claim the next step until the
command prints `POLECAT_STEP_COMPLETE`."""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "setup", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "polecat-work", "gc.session_affinity" = "require" }

[[steps]]
id = "workspace-setup"
title = "Set up worktree and feature branch"
needs = ["load-context"]
description = """
Ensure you have an isolated git worktree and a clean feature branch.
Every check is idempotent — safe to re-run after crash/restart.

**Config: base_branch = {{base_branch}}**
**Config: setup_command = {{setup_command}}**

`{{base_branch}}` is resolved by `gc sling` in this order:
1. `metadata.target` on the work bead
2. `metadata.target` on the parent convoy chain
3. the rig repo's default branch

**1–2. Create or recover the durable task artifact in one invocation.**

Run this entire fence as one fail-fast shell command. It is self-contained and
does not trust the process cwd or state from an earlier tool call:
```bash
# BEGIN POLECAT_ARTIFACT_BOOTSTRAP
set -euo pipefail
unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR \
  GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_NAMESPACE \
  GIT_CONFIG GIT_CONFIG_SYSTEM GIT_CONFIG_GLOBAL GIT_CONFIG_NOSYSTEM \
  GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_IMPLICIT_WORK_TREE \
  GIT_GRAFT_FILE GIT_NO_REPLACE_OBJECTS GIT_REPLACE_REF_BASE GIT_PREFIX \
  GIT_INTERNAL_SUPER_PREFIX GIT_SUPER_PREFIX GIT_SHALLOW_FILE \
  GIT_QUARANTINE_PATH GIT_CEILING_DIRECTORIES \
  GIT_DISCOVERY_ACROSS_FILESYSTEM
for git_config_name in "${!GIT_CONFIG_KEY_@}" "${!GIT_CONFIG_VALUE_@}"; do
  unset "$git_config_name"
done
unset git_config_name

block_workspace_hard_failure() {
  local code=$1 reason=$2
  gc gastown polecat-step block \
    --convoy "{{convoy_id}}" \
    --step-ref "mol-polecat-work.workspace-setup" \
    --code "$code" \
    --reason "$reason"
  exit $?
}

if [ -z "${GC_CITY_PATH:-}" ] || [ -z "${GC_RIG:-}" ] ||
   [ -z "${GC_RIG_ROOT:-}" ]; then
  echo "GC_CITY_PATH, GC_RIG, and GC_RIG_ROOT are required for task worktrees." >&2
  exit 1
fi
case "$GC_RIG" in
  ""|"."|".."|*[!A-Za-z0-9._-]*)
    echo "Unsafe rig name for artifact path: $GC_RIG" >&2
    exit 1
    ;;
esac
CITY_ROOT=$(CDPATH= cd -- "$GC_CITY_PATH" 2>/dev/null && pwd -P) || {
  echo "City root is missing: $GC_CITY_PATH" >&2
  exit 1
}
RIG_ROOT=$(CDPATH= cd -- "$GC_RIG_ROOT" 2>/dev/null && pwd -P) || {
  echo "Rig root is missing: $GC_RIG_ROOT" >&2
  exit 1
}

CONVOY_STATUS=$(GC_NO_API=1 gc convoy status "{{convoy_id}}" --json) || {
  echo "Could not read authoritative input convoy {{convoy_id}}." >&2
  exit 1
}
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -er \
  --arg convoy "{{convoy_id}}" '
  if type == "object" and .schema_version == "1" and
     .convoy.id == $convoy and
     (.children | type) == "array" and (.children | length) == 1 and
     (.children[0].id | type) == "string" and
     (.children[0].id | length) > 0
  then .children[0].id
  else error("expected the exact input convoy with one tracked member")
  end
') || {
  echo "mol-polecat-work requires an input convoy with exactly one tracked member" >&2
  exit 1
}
case "$WORK_BEAD_ID" in
  ""|"."|".."|*[!A-Za-z0-9._-]*)
    echo "Unsafe work bead id for artifact path: $WORK_BEAD_ID" >&2
    exit 1
    ;;
esac

BEAD_JSON=$(GC_NO_API=1 \
  GC_CITY="$CITY_ROOT" \
  GC_CITY_PATH="$CITY_ROOT" \
  GC_RIG="$GC_RIG" \
  GC_RIG_ROOT="$RIG_ROOT" \
  GC_STORE_ROOT="$RIG_ROOT" \
  GC_STORE_SCOPE=rig \
  gc bd --rig "$GC_RIG" show "$WORK_BEAD_ID" --json) || {
  echo "Could not read work bead metadata for $WORK_BEAD_ID." >&2
  exit 1
}
BEAD_META=$(printf '%s' "$BEAD_JSON" | jq -ce \
  --arg id "$WORK_BEAD_ID" '
  if type == "array" and length == 1 and (.[0] | type) == "object" and
     .[0].id == $id and .[0].status == "open" and
     ((.[0].assignee // "") == "") and
     ((.[0].metadata // {}) | type) == "object"
  then .[0].metadata // {}
  else error("expected exactly one work bead object")
  end
') || {
  echo "Invalid work bead response for $WORK_BEAD_ID; refusing to create or adopt an artifact." >&2
  exit 1
}
ARTIFACT_DIR=$(printf '%s' "$BEAD_META" | jq -r '.artifact_dir // empty')
LEGACY_WORK_DIR=$(printf '%s' "$BEAD_META" | jq -r '.work_dir // empty')

git -C "$RIG_ROOT" fetch --prune origin

# BEGIN ARTIFACT_WORKTREE_VALIDATOR
artifact_git_common_dir() {
  local repo_dir=$1 common_dir
  common_dir=$(git -C "$repo_dir" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) ||
    return 1
  (CDPATH= cd -- "$common_dir" 2>/dev/null && pwd -P)
}

ARTIFACT_POINTER_LINE=
artifact_read_one_line_file() {
  local file=$1 line count=0
  ARTIFACT_POINTER_LINE=
  [ -f "$file" ] && [ ! -L "$file" ] || return 1
  while IFS= read -r line || [ -n "$line" ]; do
    count=$((count + 1))
    [ "$count" -eq 1 ] || return 1
    ARTIFACT_POINTER_LINE=$line
  done <"$file"
  [ "$count" -eq 1 ]
}

artifact_resolve_file_ref() {
  local base=$1 ref=$2 candidate parent parent_real
  case "$ref" in
    /*) candidate=$ref ;;
    *) candidate="$base/$ref" ;;
  esac
  parent=$(dirname -- "$candidate") || return 1
  parent_real=$(CDPATH= cd -- "$parent" 2>/dev/null && pwd -P) ||
    return 1
  printf '%s/%s\n' "$parent_real" "$(basename -- "$candidate")"
}

artifact_is_registered_worktree() {
  local rig_root=$1 candidate=$2 listed count=0
  local git_dir backpointer_ref backpointer_real

  git -C "$rig_root" worktree list --porcelain -z >/dev/null 2>&1 ||
    return 1
  while IFS= read -r -d '' listed; do
    [ "$listed" = "worktree $candidate" ] && count=$((count + 1))
  done < <(git -C "$rig_root" worktree list --porcelain -z 2>/dev/null)
  [ "$count" -eq 1 ] || return 1

  git_dir=$(git -C "$candidate" rev-parse \
    --path-format=absolute --absolute-git-dir 2>/dev/null) || return 1
  git_dir=$(CDPATH= cd -- "$git_dir" 2>/dev/null && pwd -P) || return 1
  artifact_read_one_line_file "$git_dir/gitdir" || return 1
  backpointer_ref=$ARTIFACT_POINTER_LINE
  backpointer_real=$(artifact_resolve_file_ref \
    "$git_dir" "$backpointer_ref") || return 1
  [ "$backpointer_real" = "$candidate/.git" ]
}

validate_artifact_worktree() {
  local candidate=$1 city_root=$2 rig_name=$3 rig_root=$4 bead_id=$5
  local policy=${6:-existing}
  local candidate_real candidate_top candidate_common rig_common
  local rig_namespace rig_namespace_real canonical_path
  local worktrees_parent provider_home provider_root provider_name

  [ -n "$candidate" ] && [ -d "$candidate" ] || return 1
  candidate_real=$(CDPATH= cd -- "$candidate" 2>/dev/null && pwd -P) || return 1

  # Only the exact bead-scoped .../worktrees/<bead-id> shape is reusable.
  [ "$(basename -- "$candidate_real")" = "$bead_id" ] || return 1
  [ "$(basename -- "$(dirname -- "$candidate_real")")" = "worktrees" ] || return 1

  # Same-repository is not an ownership boundary: multiple cities and rigs can
  # share one Git common dir. Require this city's exact canonical path or the
  # one historical provider-nested layout that Gastown actually created.
  rig_namespace="$city_root/.gc/worktrees/$rig_name"
  rig_namespace_real=$(CDPATH= cd -- "$rig_namespace" 2>/dev/null && pwd -P) ||
    return 1
  [ "$rig_namespace_real" = "$rig_namespace" ] || return 1
  canonical_path="$rig_namespace_real/artifacts/worktrees/$bead_id"
  if [ "$candidate_real" = "$canonical_path" ]; then
    [ "$policy" != legacy-only ] || return 1
  else
    [ "$policy" != canonical-only ] || return 1
    worktrees_parent=$(dirname -- "$candidate_real")
    provider_home=$(dirname -- "$worktrees_parent")
    provider_root=$(dirname -- "$provider_home")
    provider_name=$(basename -- "$provider_home")
    [ "$provider_root" = "$rig_namespace_real/polecats" ] || return 1
    case "$provider_name" in
      ""|"."|".."|*[!A-Za-z0-9._-]*) return 1 ;;
    esac
  fi

  # Reject a plain subdirectory of a worktree and worktrees from another repo.
  candidate_top=$(git -C "$candidate_real" rev-parse --show-toplevel 2>/dev/null) ||
    return 1
  candidate_top=$(CDPATH= cd -- "$candidate_top" 2>/dev/null && pwd -P) || return 1
  [ "$candidate_top" = "$candidate_real" ] || return 1
  candidate_common=$(artifact_git_common_dir "$candidate_real") || return 1
  rig_common=$(artifact_git_common_dir "$rig_root") || return 1
  [ "$candidate_common" = "$rig_common" ] || return 1
  artifact_is_registered_worktree "$rig_root" "$candidate_real" || return 1

  printf '%s\n' "$candidate_real"
}
# END ARTIFACT_WORKTREE_VALIDATOR

# Canonical metadata wins. If it is absent, a valid legacy path can be adopted
# in place. Unsafe canonical state stops; only unsafe deprecated state may fall
# back to a newly created canonical worktree.
WORKTREE=
if [ -n "$ARTIFACT_DIR" ]; then
  if WORKTREE=$(validate_artifact_worktree \
      "$ARTIFACT_DIR" "$CITY_ROOT" "$GC_RIG" "$RIG_ROOT" \
      "$WORK_BEAD_ID" existing); then
    echo "Reusing artifact_dir=$WORKTREE"
  else
    echo "Canonical artifact_dir is missing or unsafe: $ARTIFACT_DIR" >&2
    echo "STOP. Preserve it for manual recovery; only an absent canonical key may fall back or create." >&2
    block_workspace_hard_failure \
      "workspace.canonical-artifact-invalid" \
      "canonical artifact_dir is missing, redirected, or unsafe"
  fi
elif [ -n "$LEGACY_WORK_DIR" ]; then
  if WORKTREE=$(validate_artifact_worktree \
      "$LEGACY_WORK_DIR" "$CITY_ROOT" "$GC_RIG" "$RIG_ROOT" \
      "$WORK_BEAD_ID" legacy-only); then
    echo "Adopting validated in-place legacy work_dir=$WORKTREE as artifact_dir."
    echo "It remains provider-nested until terminal cleanup; new artifacts are always canonical."
  else
    echo "Ignoring unsafe legacy work_dir=$LEGACY_WORK_DIR; creating a new per-bead worktree." >&2
  fi
fi

if [ -z "$WORKTREE" ]; then
  ARTIFACT_HOME="$CITY_ROOT/.gc/worktrees/$GC_RIG/artifacts"
  if [ -L "$ARTIFACT_HOME" ] ||
     { [ -e "$ARTIFACT_HOME" ] && [ ! -d "$ARTIFACT_HOME" ]; }; then
    echo "Task artifact root is redirected or is not a directory: $ARTIFACT_HOME" >&2
    block_workspace_hard_failure \
      "workspace.artifact-root-unsafe" \
      "task artifact root is redirected or is not a directory"
  fi
  mkdir -p -- "$ARTIFACT_HOME"
  ARTIFACT_HOME_REAL=$(CDPATH= cd -- "$ARTIFACT_HOME" 2>/dev/null && pwd -P) || {
    echo "Cannot resolve task artifact root." >&2
    block_workspace_hard_failure \
      "workspace.artifact-root-unresolvable" \
      "task artifact root cannot be resolved"
  }
  if [ "$ARTIFACT_HOME_REAL" != "$ARTIFACT_HOME" ]; then
    echo "Task artifact root is redirected outside the city/rig namespace." >&2
    block_workspace_hard_failure \
      "workspace.artifact-root-redirected" \
      "task artifact root resolves outside the city and rig namespace"
  fi
  WORKTREE_PARENT="$ARTIFACT_HOME/worktrees"
  if [ -L "$WORKTREE_PARENT" ] ||
     { [ -e "$WORKTREE_PARENT" ] && [ ! -d "$WORKTREE_PARENT" ]; }; then
    echo "Task worktree parent is redirected or is not a directory: $WORKTREE_PARENT" >&2
    block_workspace_hard_failure \
      "workspace.worktree-parent-unsafe" \
      "task worktree parent is redirected or is not a directory"
  fi
  mkdir -p -- "$WORKTREE_PARENT"
  WORKTREE_PARENT=$(CDPATH= cd -- "$WORKTREE_PARENT" 2>/dev/null && pwd -P) || {
    echo "Cannot resolve task worktree parent under the city artifact root." >&2
    block_workspace_hard_failure \
      "workspace.worktree-parent-unresolvable" \
      "task worktree parent cannot be resolved"
  }
  if [ "$WORKTREE_PARENT" != "$ARTIFACT_HOME/worktrees" ]; then
    echo "Task worktree parent is redirected outside the city artifact root." >&2
    block_workspace_hard_failure \
      "workspace.worktree-parent-redirected" \
      "task worktree parent resolves outside the artifact root"
  fi
  WORKTREE_PATH="$WORKTREE_PARENT/$WORK_BEAD_ID"

  if [ -e "$WORKTREE_PATH" ]; then
    # Recover the narrow crash window after git worktree add but before the
    # metadata write. Never reuse an unrelated directory at this path.
    if WORKTREE=$(validate_artifact_worktree \
        "$WORKTREE_PATH" "$CITY_ROOT" "$GC_RIG" "$RIG_ROOT" \
        "$WORK_BEAD_ID" canonical-only); then
      echo "Recovering existing validated per-bead worktree=$WORKTREE"
    else
      echo "Canonical artifact path already exists but is not this bead's validated worktree: $WORKTREE_PATH" >&2
      echo "STOP. Preserve and resolve the collision manually; do not create an alternate artifact." >&2
      block_workspace_hard_failure \
        "workspace.artifact-path-collision" \
        "canonical artifact path exists but is not this bead's registered worktree"
    fi
  fi

  if [ -z "$WORKTREE" ]; then
    git -C "$RIG_ROOT" worktree prune
    git -C "$RIG_ROOT" worktree add "$WORKTREE_PATH" --detach origin/{{base_branch}}
    WORKTREE=$(validate_artifact_worktree \
      "$WORKTREE_PATH" "$CITY_ROOT" "$GC_RIG" "$RIG_ROOT" \
      "$WORK_BEAD_ID" canonical-only) || {
        echo "New task worktree failed validation: $WORKTREE_PATH" >&2
        block_workspace_hard_failure \
          "workspace.new-worktree-invalid" \
          "new task worktree failed canonical registration validation"
      }
  fi
fi

# Record the canonical key immediately, then retire any legacy task key.
GC_NO_API=1 \
GC_CITY="$CITY_ROOT" \
GC_CITY_PATH="$CITY_ROOT" \
GC_RIG="$GC_RIG" \
GC_RIG_ROOT="$RIG_ROOT" \
GC_STORE_ROOT="$RIG_ROOT" \
GC_STORE_SCOPE=rig \
gc bd --rig "$GC_RIG" update "$WORK_BEAD_ID" \
  --set-metadata artifact_dir="$WORKTREE" \
  --unset-metadata work_dir || {
    echo "Could not record artifact_dir; refusing to enter an untracked task worktree." >&2
    exit 1
  }
printf 'POLECAT_ARTIFACT_READY source=%s artifact=%s\n' \
  "$WORK_BEAD_ID" "$WORKTREE"
# END POLECAT_ARTIFACT_BOOTSTRAP
```

Worktrees are scoped to the work bead (not the agent name) so that:
- An agent can pick up new work even if an old worktree is being recovered
- Multiple orphaned worktrees can coexist without collision
- The witness cleans them independently per-bead

**3. Ensure branch exists.**

Check if `metadata.branch` already records a branch:
```bash
CONVOY_STATUS=$(GC_NO_API=1 gc convoy status "{{convoy_id}}" --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -er \
  --arg convoy "{{convoy_id}}" '
  if type == "object" and .schema_version == "1" and
     .convoy.id == $convoy and (.children | type) == "array" and
     (.children | length) == 1 and (.children[0].id | type) == "string" and
     (.children[0].id | length) > 0
  then .children[0].id
  else error("expected exact input convoy with one source")
  end
')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-polecat-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
BRANCH=$(GC_NO_API=1 \
  GC_STORE_ROOT="$GC_RIG_ROOT" \
  GC_STORE_SCOPE=rig \
  gc bd --rig "$GC_RIG" show "$WORK_BEAD_ID" --json |
  jq -er --arg id "$WORK_BEAD_ID" '
    if type == "array" and length == 1 and .[0].id == $id and
       .[0].status == "open" and ((.[0].assignee // "") == "") and
       ((.[0].metadata // {}) | type) == "object"
    then .[0].metadata.branch // ""
    else error("source identity/state changed")
    end
  ') || exit 1
if [ -n "$BRANCH" ]; then
  printf 'POLECAT_WORKSPACE_BRANCH_STATE source=%s state=present branch=%s\n' \
    "$WORK_BEAD_ID" "$BRANCH"
else
  printf 'POLECAT_WORKSPACE_BRANCH_STATE source=%s state=absent\n' \
    "$WORK_BEAD_ID"
fi
```

**If branch exists in metadata** — use the deterministic lease command.
It performs authoritative synchronization and, for a rejected branch, owns
the detached rebase plus the crash-safe Git ref transactions. Do not reproduce
that protocol manually or replace its lease refs with bead metadata:
```bash
CONVOY_STATUS=$(GC_NO_API=1 gc convoy status "{{convoy_id}}" --json) || exit 1
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -er \
