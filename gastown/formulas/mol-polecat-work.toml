Every repository command runs through the exact live stage's read-only artifact
executor. Each invocation re-derives the sole source from the workflow convoy,
validates its `metadata.artifact_dir`, and enters that Git worktree. A `cd` or
shell variable from an earlier tool call never counts. For non-shell file
tools, first run the executor with `-- pwd`, then use only absolute paths below
that returned artifact root.

Derive your work bead when a non-repository operation needs its ID:
```bash
CONVOY_STATUS=$(GC_NO_API=1 gc convoy status "{{convoy_id}}" --json) || exit 1
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -er \
  --arg convoy "{{convoy_id}}" '
