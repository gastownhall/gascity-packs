description = """
Deacon patrol loop. Poured as a root-only wisp on startup:

  gc bd mol wisp mol-deacon-patrol --root-only --var binding_prefix='{{binding_prefix}}'
  gc bd update $WISP --assignee=$GC_AGENT

Each wisp is ONE iteration: check inbox, run town-wide coordination
tasks, pour the next iteration. On crash, re-read the formula steps
and determine where you left off from context.

Formula steps are NOT materialized as child beads. Read the step
descriptions below and work through them in order.

The loop mechanism: every exit path (happy or early) pours the next
wisp before burning this one, after first resolving this one; it pours
nothing when it cannot name this wisp. The prompt bootstraps the first wisp
and, on every startup, reconciles your assigned patrol wisps to exactly one.

## Deacon Role

The deacon is the **LLM sidekick to the controller**. It handles periodic
tasks that require judgment or observation — things the Go controller
can't or shouldn't do.

1. **Work-layer health** — are witnesses and refineries making progress?
   (Not "are they running" — that's the controller's job.)
2. **Utility agent health** — detect stuck dogs, dispatch shutdown dance.
3. **Orphan process cleanup** — kill leaked claude/node subagent processes.
4. **System diagnostics** — run `gc doctor`, act on findings.

Mechanical tasks (gate evaluation, cross-rig deps, orphan bead sweeps,
wisp compaction) are handled by exec orders in the maintenance
pack — no LLM needed.

## Idle Town Principle

The deacon should be silent/invisible when the town is healthy and idle.
Skip health checks when no active work exists. Use exponential backoff
between patrol cycles.

## What the deacon does NOT do

- Start/stop/restart agents (controller handles this)
- Per-rig orphaned bead recovery (witness handles this)
- Code implementation (polecats do this)
- Kill agents directly (files warrants, dog pool runs shutdown dance)
- Pool sizing (controller pool reconciliation)

Read each step's description before acting — Config values override defaults."""
formula = "mol-deacon-patrol"

[vars]
[vars.binding_prefix]
description = "Import binding prefix for gastown agent identities, including trailing dot when bound."
default = ""

[vars.event_timeout]
description = "Seconds to sleep before re-checking. Replaces former event-watch loop which hot-spun on cache-reconcile firehose."
default = "60"

[[steps]]
id = "check-inbox"
title = "Context check, then mail"
description = """
**1. Context check (FIRST — before any work):**
```bash
RSS=$(ps -o rss= -p $$ | tr -d ' ')
RSS_MB=$((RSS / 1024))
```

If RSS > 1500 MB or context feels heavy, request a restart:
```bash
gc runtime request-restart
```
This sets `GC_RESTART_REQUESTED` metadata on the session and blocks
forever. The controller will kill and restart the session on the next
reconcile tick. The current wisp stays assigned and the new session
the new session re-reads formula steps and resumes from context.

**2. Check mail:**
```bash
gc mail inbox
```

Handle each message type:

**HELP / Escalation:**
Assess the request. Can you help directly? If not, escalate:
```bash
gc mail send mayor/ -s "ESCALATION: <agent> needs help" -m "<details>"
```
Archive after handling.

**DOG_DONE:**
A utility agent completed its task (e.g., shutdown dance, dep
propagation). Note the outcome for observability. Archive.

**Other / informational:**
Archive after reading.

**Hygiene principle**: Archive messages after they're fully processed.
Inbox should be near-empty after this step.

Close this step and proceed."""

[[steps]]
id = "orphan-process-cleanup"
title = "Kill orphaned claude subagent processes"
needs = ["check-inbox"]
description = """
Claude Code's Task tool spawns subagent processes that sometimes don't
clean up. These accumulate and consume significant memory.

**Detection:** Orphaned subagent processes have TTY = "?" in `ps` output.
They are child processes of claude/node that lost their parent.

```bash
ps aux | grep -E 'claude|node' | grep '?'
```

**Judgment required:** Not all TTY=? processes are orphaned. Some are
legitimate background processes. Look for:
- Processes consuming significant memory (>500MB RSS)
- Processes that have been running much longer than any active session
- Multiple identical processes (accumulated from repeated crashes)

**Action:** Kill confirmed orphans:
```bash
kill <pid>
```

Use judgment — this is exactly why an LLM does it, not Go code.

Close this step after check (even if no orphans found)."""

[[steps]]
id = "health-scan"
title = "Check work-layer health"
needs = ["orphan-process-cleanup"]
description = """
Monitor whether work is flowing through rig coordination agents.
The controller handles "is the agent running?" The deacon handles
"is work progressing?"

**Skip docked/parked rigs.** Only check active rigs.

**For each active rig, assess witness health:**

Check witness patrol wisp freshness. Each patrol cycle burns a wisp.
If the last wisp is much older than the maximum backoff cap (300s) plus
buffer, the witness may be stuck. But if there's no active work in the
rig, the witness is legitimately idle — not stuck.

**For each active rig, assess refinery health:**

Check refinery patrol wisp freshness + queue state:
- Wisp recently burned → healthy (actively cycling)
- Wisp open, no work assigned to refinery → idle, fine
- Wisp open, work assigned to refinery, stale `UpdatedAt` → stuck

**No hardcoded thresholds.** Read wisp timestamps, queue state, and
the nature of the current work. Make a judgment call about whether
something is stuck. This is exactly why an LLM does it, not Go code.

**For stuck coordination agents, file a warrant:**
```bash
gc bd create --type=task --labels=warrant \
  --title="Stuck: <rig>/<role>" \
  --metadata '{"target":"<session>","reason":"<reason>","requester":"deacon","gc.routed_to":"{{binding_prefix}}dog"}'
```

The dog pool runs `mol-shutdown-dance` for due process.

**Escalate to mayor** only for systemic issues (multiple rigs affected,
patterns of failure).

Close this step after assessment."""

[[steps]]
id = "queue-starvation-check"
title = "Cross-check assigned work against visible work signal"
needs = ["health-scan"]
description = """
Cross-check assigned work against visible work signal. A session can
look healthy-idle in a patrol wisp view while its queue is silently
starving — the refinery (upstream #1833) self-polled for 13h42m with
seven beads in its queue and no visible work signal, because its poll
filter resolved to an identity that didn't match its own.

The deacon's wisp-freshness check catches "no patrol activity" but not
"active polling, wrong filter, queue silently piling up." This step
closes that gap.

**Step 1: For each active coordination/merge session, compute the pair:**
- `A` = count of open beads assigned to the session's agent identity
- `B` = the most recent bead.updated_at across those beads (work signal)

```bash
gc agents list --json --active | jq -r '.[] | .agent_id' | while read -r AGENT; do
    ASSIGNED=$(gc bd list --status=open --assignee="$AGENT" --json --limit=0 | jq 'length')
    LATEST=$(gc bd list --status=open --assignee="$AGENT" --json --limit=0 \\
        | jq -r '[.[].updated_at] | max // ""')
    printf '%s\\t%s\\t%s\\n' "$AGENT" "$ASSIGNED" "$LATEST"
done
```

The latest bead.updated_at is the cheapest proxy for "did this session
move work recently?" — every claim, status transition, metadata update,
or note bumps it.

**Step 2: Flag when queue > 0 and signal is stale (judgment call,
guideline ~30min):**

If `A > 0` AND `now - B` has grown well past the patrol's natural
cadence (default guideline: 30min — roughly 6x the 300s max patrol
backoff), the session is holding work without making progress. This
is exactly why an LLM does it, not Go code. Consider:
- Coordination agents (refinery, witness) naturally cycle in seconds
  when work is present; 30min is an eternity, not a lull.
- Polecats may take longer per step; be more lenient before flagging.
- A freshly-assigned bead with no prior activity gets `updated_at` at
  assignment time; if it's hours old, the session picked it up but
  never acted.

**Step 3: For flagged sessions, nudge first, then warrant:**

```bash
gc session nudge "$STUCK_SESSION" "Queue has $ASSIGNED open beads, no bead activity for <duration>. Run gc hook."
```

If the nudge doesn't unstick within the next patrol cycle, escalate
by filing a warrant for the dog pool:

```bash
gc bd create --type=task --labels=warrant \\
    --title="Stuck queue: <session> — $ASSIGNED beads, no activity $duration" \\
    --metadata '{"target":"<session>","reason":"queue starvation: N beads, no bead.updated_at progress","requester":"deacon","gc.routed_to":"{{binding_prefix}}dog"}'
```

The dog runs `mol-shutdown-dance` and the controller respawns a fresh
session that re-reads the queue with a correct filter.

**Step 4: A genuinely-idle session (no assigned beads) is NOT flagged.**
If `A == 0`, this step is a no-op for that session. Idle-but-ready
refineries and witnesses are healthy.

Close this step after the cross-check runs for every active session."""

[[steps]]
id = "utility-agent-health"
title = "Check utility agent (dog) health"
needs = ["queue-starvation-check"]
description = """
Detect utility agents (dogs) that are alive but stuck on their work.

The controller detects dead agents. But "working too long" is a
work-layer judgment: is this task genuinely slow, or is the agent stuck?
The controller can't know this. The deacon can, by checking bead and
wisp timestamps.

**Step 1: Find active utility agent work:**
```bash
gc bd list --status=in_progress --metadata-field gc.routed_to={{binding_prefix}}dog --json --limit=0
```

**Step 2: For each, assess progress:**

Check the work bead's `UpdatedAt` and the agent's wisp freshness.
Consider the nature of the work — a shutdown dance with 240s timeouts
will naturally take longer than a quick dep propagation.

No hardcoded thresholds. Use judgment.

**Step 3: For stuck utility agents, file a warrant:**
```bash
gc bd create --type=task --labels=warrant \
  --title="Stuck dog: <agent>" \
  --metadata '{"target":"<session>","reason":"<reason>","requester":"deacon","gc.routed_to":"{{binding_prefix}}dog"}'
```

A different dog from the pool picks up the warrant and runs the
shutdown dance. If the pool is at capacity with all dogs stuck,
escalate to mayor.

Close this step after assessment."""

[[steps]]
id = "dolt-health"
title = "Run Dolt data-plane health check"
needs = ["utility-agent-health"]
description = """
Run `gc dolt health --json` to inspect the Dolt data plane and flag anomalies.

This step surfaces problems that individual patrol steps won't catch:
commit bloat (compactor dog may have failed), stale backups (backup dog
may have failed), orphan databases, and zombie Dolt server processes.

**Step 1: Run the health check and classify it — one script**

`gc dolt health` is a command of the Dolt pack, not of gc itself, and it
reports on a Dolt server that gc manages. A city with no gc-managed Dolt has
nothing for it to report, and says so in one of three ways: a city that does
not import the Dolt pack (for example one on an exec or other beads provider)
answers `unknown command "dolt"`; a scope whose server bd runs behind its
proxy answers with a `skipped` report; and a city whose server bd owns
directly (a direct-transport city) has no gc-managed runtime state, so the
command exits 78 with `dolt-state.json (missing)`. None of these is a Dolt
outage. A gc-managed server that is down also exits 78, with its state file
present but no server running, and that one is an outage. So capture the
exit code and stderr instead of piping the output straight into a parser:
"not applicable", "down", "the check itself failed" and "here is a report"
must stay different answers. Do not probe with `gc dolt --help` first: it
exits 0 whether or not `gc dolt` exists.

```bash
DOLT_HEALTH_ERR=$(mktemp)
DOLT_HEALTH_JSON=$(gc dolt health --json 2>"$DOLT_HEALTH_ERR")
DOLT_HEALTH_RC=$?
DOLT_HEALTH_STDERR=$(head -c 2000 "$DOLT_HEALTH_ERR")
rm -f "$DOLT_HEALTH_ERR"
# Exit 78 is the Dolt pack failing to resolve a gc-managed server's port: with
# no runtime state file there is no gc-managed Dolt in this city, and with a
# state file but no running server the gc-managed Dolt is down. gc --json
# reports a missing command as error.code json_command_not_found; without the
# JSON envelope it says `unknown command "dolt"` on stderr.
if [ "$DOLT_HEALTH_RC" -ne 0 ]; then
  if [ "$DOLT_HEALTH_RC" -eq 78 ] && printf '%s' "$DOLT_HEALTH_STDERR" | grep -q 'cannot resolve runtime port' &&
     printf '%s' "$DOLT_HEALTH_STDERR" | grep -q 'dolt-state.json (missing)'; then
    echo "DOLT_HEALTH: not-applicable (no gc-managed Dolt runtime in this city; bd owns the server or none exists)"
  elif [ "$DOLT_HEALTH_RC" -eq 78 ] && printf '%s' "$DOLT_HEALTH_STDERR" | grep -q 'present but not running'; then
    echo "DOLT_HEALTH: outage (the gc-managed Dolt server is not running) -> CRITICAL row"
  elif printf '%s' "$DOLT_HEALTH_JSON" | jq -e '.error.code == "json_command_not_found"' >/dev/null 2>&1 ||
     printf '%s\\n%s\\n' "$DOLT_HEALTH_STDERR" "$DOLT_HEALTH_JSON" | grep -q -e 'unknown command "dolt"' -e 'unknown command "health"'; then
    echo "DOLT_HEALTH: not-applicable (gc dolt health does not exist in this city; no Dolt pack)"
  else
    echo "DOLT_HEALTH: error (gc dolt health --json exited $DOLT_HEALTH_RC)"
    gc mail send mayor/ --dedup deacon-dolt-health-could-not-run -s "DEACON: gc dolt health could not run" \\
      -m "gc dolt health --json exited $DOLT_HEALTH_RC, so Dolt data-plane health was NOT measured this cycle.
stderr: $DOLT_HEALTH_STDERR"
  fi
elif ! printf '%s' "$DOLT_HEALTH_JSON" | jq -e 'type == "object"' >/dev/null 2>&1; then
  echo "DOLT_HEALTH: error (gc dolt health --json printed no JSON report)"
  gc mail send mayor/ --dedup deacon-dolt-health-could-not-run -s "DEACON: gc dolt health could not run" \\
    -m "gc dolt health --json exited 0 without a JSON report, so Dolt data-plane health was NOT measured this cycle.
stderr: $DOLT_HEALTH_STDERR"
else
  printf '%s' "$DOLT_HEALTH_JSON" | jq -r '
    if (.skipped | type) == "object" then "DOLT_HEALTH: not-applicable (" + (.skipped.reason // "skipped") + ")"
    elif .applicable == false then "DOLT_HEALTH: not-applicable (" + (.reason // "no Dolt data plane") + ")"
    else "DOLT_HEALTH: evaluate" end'
  printf '%s\\n' "$DOLT_HEALTH_JSON"
fi
```

Act on the `DOLT_HEALTH:` line:

- `not-applicable (<reason>)`: log `Dolt health: not applicable (<reason>)` and
  move on to the next step. Do NOT escalate and do NOT nudge a dog. A
  not-applicable report's other fields, if any, are placeholders —
  `server.reachable` is `false` because no gc-managed Dolt server exists, not
  because one is down.
- `outage (...)`: the gc-managed Dolt server is down: its runtime state file
  exists but no server is running. This is Step 2's `server.reachable ==
  false` row without a report to read; send Step 3's **Server down
  (CRITICAL)** escalation.
- `error (...)`: the script already sent one non-critical escalation. It is
  deduplicated (`--dedup`), so the mayor holds one such message until it is
  archived, not one per cycle. Health was not measured, so there is nothing to
  evaluate; move on.
- `evaluate`: evaluate the report it printed against the table in Step 2.

The report (HealthReport schema):
- `server`: running, reachable, pid, port, latency_ms
- `databases[]`: name, commits, open_beads
- `backups`: dolt_freshness, dolt_age_sec, dolt_stale
- `processes`: zombie_count, zombie_pids
- `orphans[]`: name, size

Note: `--json` exits 0 when the payload is well-formed; health state is
signalled in-band. Key decisions off `server.reachable`, not
`server.running` — a process can hold the port while its goroutines
are wedged (the latter is what first prompted this check to exist).

**Step 2: Evaluate thresholds** (only on `DOLT_HEALTH: evaluate`)

| Signal | Threshold | Meaning |
|--------|-----------|---------|
| `server.reachable == false` | — | Dolt server is down or unresponsive (CRITICAL) |
| `server.latency_ms > 5000` | 5 s | Server may be overloaded |
| `databases[].commits > 50000` | 50 k | Compactor dog may have stalled |
| `backups.dolt_stale == true` | >30 min | Backup dog may have failed |
| `processes.zombie_count > 0` | any | Zombie Dolt servers detected |
| `orphans` non-empty | any | Advisory only — NEVER act on this count directly; verify with `gc dolt-cleanup` (hyphen, dry-run) first |

**Step 3: React to alerts**

**Server down (CRITICAL):** `server.reachable == false` — either no
process is listening on the port, or a process is listening but not
answering SQL (wedged goroutines, migration lock, saturated pool).
```bash
gc mail send mayor/ -s "ESCALATION: Dolt server unreachable [CRITICAL]" \\
  -m "gc dolt health reports server.reachable=false"
```

**Commit bloat (commits > 50k in any DB):**
The compactor dog (`mol-dog-compactor`) may have failed. Log for awareness.
If the compactor order is configured, it will self-dispatch. Otherwise
nudge the dog pool:
```bash
gc session nudge dog/ "Compactor needed: <db_name> has <count> commits"
```

**Stale backups:**
The backup dog (`mol-dog-backup`) may have failed. Same pattern — log and
nudge if order hasn't self-healed:
```bash
gc session nudge dog/ "Backup needed: dolt backup is <age> old"
```

**Zombie processes:**
Kill zombie Dolt servers not on the expected port:
```bash
kill <zombie_pid>
```

**Orphan DBs (`orphans` non-empty):**
Do NOT act on the health `orphans` count directly — the reporter can
false-positive live rig databases as orphans, and a forced removal on that
count would destroy a live rig ledger (unrecoverable). Confirm against the
rig-protected dry-run authority first:
```bash
gc dolt-cleanup --json    # hyphen, Go-side: dry-run, rig-protected
```
Real orphans are exactly the databases it lists under `dropped.names`
(`rigs_protected` are already excluded). If `dropped.names` is empty, there
is nothing to clean — the health `orphans` entries are live rig DBs (a
reporter false-positive); log and move on. `gc dolt-cleanup` (hyphen,
the Go-side command) is dry-run by default; removal happens only under
`--force`. Do NOT rely on the `gc dolt cleanup` (space) pack-script's
defaults — always use the hyphen command for orphan inspection/cleanup.
Reclaim confirmed orphans only via human-approved
`gc dolt-cleanup --force` escalated to mayor — never run a destructive
`--force` automatically from this step, and never
`gc dolt cleanup --force --server-down-ok` against a reachable server (it can
`rm -rf` an open database and corrupt NBS, #1549).

**If everything is healthy:**
Log `Dolt health: OK` and move on.

**Exit criteria:** Health check run, alerts handled or escalated."""

[[steps]]
id = "system-health"
title = "Run system diagnostics"
needs = ["dolt-health"]
description = """
Run `gc doctor` for a quick workspace health check.

```bash
gc doctor
```

**For simple findings:** Act directly (e.g., stale lock files, temp
directory cleanup).

**For complex findings:** Escalate to mayor with context:
```bash
gc mail send mayor/ -s "DOCTOR: <finding>" -m "<details>"
```

Close this step after check."""

[[steps]]
id = "next-iteration"
title = "Pour next iteration and loop"
needs = ["system-health"]
description = """
**Config: event_timeout = {{event_timeout}}**

End of patrol cycle. Pour the next iteration, then wait or exit.

**1. Context check:**

If context feels heavy or RSS is high:
```bash
gc runtime request-restart
```
This blocks forever. The controller restarts you. The next wisp
is already assigned — the new session resumes from context.

**2. Quick inbox check (end-of-cycle hygiene):**
```bash
gc mail inbox
```
Handle any urgent messages that arrived during patrol. Archive the rest.

**3. Resolve current wisp, pour next iteration, then burn this wisp (one script):**

Run this as ONE script. The burn needs the `CURRENT_WISP` this script
resolves, and a shell that forgot it between two blocks pours a successor and
burns nothing. Resolve BEFORE pouring, and pour nothing when the current wisp
cannot be named: a cycle that pours first and only then finds it cannot name
its own wisp leaks one wisp per cycle. `$GC_BEAD_ID` is not set in a patrol
session, and a patrol wisp stays `open` for its whole life (assigning it does
not claim it), so the fallback query covers `open,in_progress` and the wisps
tier (`--include-infra`), and selects only this formula's ephemeral roots.

Every failure in this script drains (`gc runtime drain-ack`) instead of only
stopping. Gas City moves an always-on deacon onto its next cycle when the wisp
it was running is gone; a turn that ends with that wisp still open, or with no
successor, is the deacon's last. A drained deacon is restarted, and its startup
reconciles the patrol wisps. That covers a failed burn of this wisp too. An
empty `GC_AGENT` stops the script first: an empty `--assignee` is no filter,
so the lookup would match every deacon's patrol wisps.
```bash
# An empty GC_AGENT would assign the successor to nobody and widen the lookup
# below to every deacon's patrol wisps: an empty --assignee is no filter.
if [ -z "${GC_AGENT:-}" ]; then
  echo "GC_AGENT is empty; not resolving, pouring or burning patrol wisps. Draining."
  gc runtime drain-ack
  exit 1
fi
CURRENT_WISP=${GC_BEAD_ID:-}
if [ -z "$CURRENT_WISP" ]; then
  CURRENT_WISP=$(gc bd list --assignee="${GC_AGENT:?}" --status=open,in_progress --type=molecule --include-infra --limit=0 --json | jq -r '[.[] | select(.title == "mol-deacon-patrol" and .ephemeral == true)] | sort_by(.created_at, .id) | last | .id // empty')
fi
if [ -z "$CURRENT_WISP" ]; then
  echo "Could not resolve the current deacon wisp; not pouring a successor."
  gc runtime drain-ack
  exit 1
fi

NEXT=$(gc bd mol wisp mol-deacon-patrol --root-only --var binding_prefix='{{binding_prefix}}' --json | jq -r '.new_epic_id // empty')
if [ -z "$NEXT" ]; then
  echo "Could not pour next deacon wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
  echo "Could not assign next deacon wisp; not burning."
  # Unassigned, no assignee-scoped query can ever find it again: reclaim it by id.
  gc bd mol burn "$NEXT" --force || echo "Could not burn the unassigned deacon wisp $NEXT; burn it by hand."
  gc runtime drain-ack
  exit 1
fi
if ! gc bd mol burn "$CURRENT_WISP" --force; then
  echo "Could not burn deacon wisp $CURRENT_WISP; draining so a restarted deacon reconciles it."
  gc runtime drain-ack
  exit 1
fi
```

**4. Burn this wisp before waiting:**

Step 3's script already burned it: the burn lives in that script because it
needs the `CURRENT_WISP` the script resolved.

Do not sleep with the current wisp still open. The backoff belongs to the
already-assigned successor wisp; if the session restarts during the sleep, the
successor remains the single resumable patrol item.

**5. Exit this turn:**
Write exactly:
```
IDLE: no work, exiting turn.
```
Then stop immediately. Do NOT sleep, call ScheduleWakeup, use Monitor, or
run `gc hook` to start the next cycle yourself: re-entering the loop from
inside this turn is a busy loop that never ends a turn. Ending the turn is
the only pacing between cycles; no sleep or idle-timeout policy paces an
always-on deacon. Gas City restarts this session on the already-assigned
successor wisp on a later pass, and the restarted session resumes from it.

**Exit criteria:** Next wisp poured and assigned, this wisp burned, turn ended with IDLE signal."""
