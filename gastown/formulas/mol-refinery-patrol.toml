description = """
Refinery patrol loop. Poured as a root-only wisp on startup:

  gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}}
  gc bd update $WISP --assignee=$GC_AGENT

Each wisp is ONE iteration: check for work, merge one branch, pour
the next iteration. On crash, re-read the formula steps and determine
where you left off from context (git state, bead state, last action).

Formula steps are NOT materialized as child beads. Read the step
descriptions below and work through them in order.

The loop mechanism: every exit path (happy or early) pours the next
wisp before burning this one. The prompt only bootstraps the first wisp.

Work beads flow directly: pool → polecat → refinery → closed.
No separate MR beads. The polecat sets metadata (branch, target) on
the work bead and assigns it to the refinery. On rejection, the
refinery puts the bead back in the pool with rejection metadata.

Merge strategy is per-work-bead metadata:
- `direct` (default): fast-forward merge to target and push
- `mr` / `pr`: publish a GitHub pull request instead of landing directly

In `mr` mode, refinery treats PR publication as the terminal handoff for
the direct-bead workflow: it records the PR URL on the work bead and
closes the bead once the PR is verified.

Before a work bead closes in either mode, hosted CI must be green on the
merge SHA. The `run-tests` step runs configured commands on THIS machine, so
it can only prove what this machine builds; the CI gate reads the verdict of
the checks it cannot run. Pending is not green and zero checks is not green.
A CI rejection uses the SAME flow as a conflict or a test failure: bead back
in the pool with a specific `rejection_reason`, branch left intact.

Read each step's description before acting — Config values override defaults."""
formula = "mol-refinery-patrol"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.binding_prefix]
description = "Import binding prefix for gastown agent identities, including trailing dot when bound."
default = ""

[vars.run_tests]
description = "Whether to run tests before merging"
default = "true"

[vars.setup_command]
description = "Setup/install command (e.g., pnpm install). Empty = skip."
default = ""

[vars.typecheck_command]
description = "Type check command (e.g., tsc --noEmit). Empty = skip."
default = ""

[vars.lint_command]
description = "Lint command (e.g., eslint .). Empty = skip."
default = ""

[vars.test_command]
description = "Test command to run (if run_tests is true)"
default = ""

[vars.build_command]
description = "Build command (e.g., go build ./...). Empty = skip."
default = ""

[vars.target_branch]
description = "Default target branch for merges"
default = "main"

[vars.delete_merged_branches]
description = "Whether to delete source branches after merge"
default = "true"

[vars.integration_branch_auto_land]
description = "Auto-create work beads to land completed integration branches"
default = "false"

[vars.event_timeout]
description = "Seconds to sleep before re-checking for work. Replaces former event-watch loop which hot-spun on cache-reconcile firehose."
default = "60"

[vars.ci_gate]
description = "Require that a work bead's hosted CI is no WORSE than the target branch it lands on before the bead closes. The commands in run-tests only prove what THIS machine can build; a Linux worker cannot build a Windows or macOS target. The gate is scoped to regressions, not to redness: a check that is already failing on the target is reported and allowed through, so a repository whose base is red is never frozen. 'false' is an explicit operator waiver; it stamps ci_gate_result=disabled on every bead it lets through. The gate never self-disables on error."
default = "true"

[vars.ci_timeout_seconds]
description = "Bounded wait for still-running checks on the head. Pending is never a pass: at this deadline the gate reports UNDETERMINED and stops without mutating bead state, because an unfinished check is not evidence the branch degraded anything and a slow CI queue is not the branch's fault."
default = "900"

[vars.ci_poll_seconds]
description = "Seconds between check-run polls while the CI gate waits."
default = "60"

[vars.ci_zero_check_grace_seconds]
description = "How long the head may report zero check-runs and zero commit statuses before the gate rules on it. Covers the seconds between a push and GitHub registering workflow runs. After it: zero on the head AND zero on the base means this repository publishes no CI on this path and the bead is allowed through; zero on the head while the base publishes checks means coverage the target has was lost here, and is a rejection."
default = "300"

[vars.ci_gate_publish_head]
description = "Direct mode only, and OFF by default because it changes what this rig pushes. When a rebase rewrites the branch, the commit that lands is one no forge has seen. 'false' (default) gates the published branch tip instead and says so out loud — direct mode publishes nothing it did not publish before. 'true' pushes the rebased head to origin/$BRANCH with --force-with-lease first, so the gate rules on the exact object that lands."
default = "false"

[[steps]]
id = "validate-identity"
title = "Validate canonical agent identity"
description = """
**Fail fast if `$GC_AGENT` is not set.**

The refinery uses `$GC_AGENT` (not `$GC_ALIAS`) as its canonical mailbox
identity. The session harness
(`internal/session/lifecycle.go:RuntimeEnvWithSessionContext`) guarantees
`$GC_AGENT` is populated for every live session — it falls back to the
session name when the alias is empty. `$GC_ALIAS` can legitimately be
empty, which is how a refinery once self-polled for 13h42m with seven
queued beads while looking healthy-idle (upstream #1833).

Verify at startup:
```bash
if [ -z "${GC_AGENT:-}" ]; then
    echo "GC_AGENT is empty — session harness did not inject the canonical identity."
    echo "Refusing to self-poll with an empty filter; escalate before proceeding."
    gc mail send mayor/ -s "ESCALATION: refinery started with empty GC_AGENT [HIGH]" \\
        -m "Session has no canonical agent identity. Investigate session harness."
    gc runtime drain-ack
    exit 1
fi
```

Close this step only when `$GC_AGENT` is confirmed non-empty."""

[[steps]]
id = "check-inbox"
title = "Context check, then mail"
needs = ["validate-identity"]
description = """
**1. Context check (FIRST — before any work):**

If context feels heavy (multi-hour session, large recent diffs, or you notice
yourself taking shortcuts or summarizing prematurely), pour and assign the next
wisp, burn the current wisp, then request a restart:
```bash
CURRENT_WISP=${GC_BEAD_ID:-}
if [ -z "$CURRENT_WISP" ]; then
  CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=in_progress --type=molecule --limit=1 --json | jq -r '.[0].id // empty')
fi
NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id // empty')
if [ -z "$NEXT" ]; then
  echo "Could not pour next refinery wisp; not requesting restart."
  gc runtime drain-ack
  exit 1
fi
if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
  echo "Could not assign next refinery wisp; not requesting restart."
  gc runtime drain-ack
  exit 1
fi
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "Could not resolve current wisp; not requesting restart."
  gc runtime drain-ack
  exit 1
fi
gc runtime request-restart
RESTART_STATUS=$?
echo "Restart request returned with status $RESTART_STATUS; stop this session now."
exit "$RESTART_STATUS"
```
This sets `GC_RESTART_REQUESTED` metadata on the session and blocks until the
controller stops this session; on controller fault it can return nonzero after
a bounded timeout. If the command returns for any reason, stop immediately. Do
not check mail, close this step, or process merge work from this old session
after burning the current wisp. On the normal path, the controller kills and
restarts the session on the next reconcile tick. The new session wakes on the
wisp you just assigned and re-reads formula steps with fresh context.

**2. Check mail:**
```bash
gc mail inbox
```

Archive any messages you handle. Note any context relevant to
upcoming merge work (e.g., priority overrides, hold requests).

Close this step and proceed."""

[[steps]]
id = "find-work"
title = "Find next work bead assigned to me or wait"
needs = ["check-inbox"]
description = """
**Config: event_timeout = {{event_timeout}}**

Search for work beads assigned to you with branch metadata:
```bash
WORK=$(gc bd list ${GC_RIG:+--rig="$GC_RIG"} --assignee=$GC_AGENT --status=open \
  --exclude-type=epic --has-metadata-key=branch --limit=1 --json | jq -r '.[0].id // empty')
```

`${GC_RIG:+--rig="$GC_RIG"}` scopes the query to this refinery's rig
database. Without it, `gc bd list` routes to the HQ database and never
sees rig-scoped work beads — the `assignee` field alone does not route
by namespace. For HQ-only refineries `$GC_RIG` is empty and the flag
expands to nothing.

If found: read the bead metadata to confirm it has a branch:
```bash
gc bd show $WORK --json | jq '.[0].metadata'
```
The bead MUST have `metadata.branch`. If `metadata.target` is missing,
use {{target_branch}} as default. Note the work bead ID and close this step.

If NO work found:
Write exactly:
```
IDLE: no work, exiting turn.
```
Then stop immediately. Do NOT sleep, call ScheduleWakeup, or use Monitor.
The session_sleep policy will restart this session after the configured idle interval.
When restarted, re-read formula steps — this step stays open until a work bead is found.

**Do not close this step until you have a work bead with branch metadata.**"""

[[steps]]
id = "rebase"
title = "Rebase branch on target"
needs = ["find-work"]
description = """
**Config: target_branch = {{target_branch}}**

Read the work bead metadata:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
```

Fetch and attempt mechanical rebase:
```bash
git fetch --prune origin
git checkout -b temp origin/$BRANCH
git rebase origin/$TARGET
```

If rebase SUCCEEDED (exit 0): close this step, proceed to run-tests.

If rebase FAILED (conflicts):

1. Abort: `git rebase --abort`
2. Clean up the existing workflow and reopen the source bead:
```bash
gc workflow delete-source $WORK --apply && gc workflow reopen-source $WORK
```
3. Put the work bead back in the pool with rejection metadata:
```bash
gc bd update $WORK \
  --status=open \
  --assignee="" \
  --set-metadata rejection_reason="Conflicts with $TARGET at $(git rev-parse origin/$TARGET)" \
  --set-metadata gc.routed_to="${GC_RIG:+$GC_RIG/}{{binding_prefix}}polecat"
```
4. Do NOT delete the branch (new polecat needs it for conflict resolution).
5. Clean up temp branch: `git checkout {{target_branch}} && git branch -D temp`
6. Pour next patrol iteration before burning:
```bash
CURRENT_WISP=${GC_BEAD_ID:-}
if [ -z "$CURRENT_WISP" ]; then
  CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=in_progress --type=molecule --limit=1 --json | jq -r '.[0].id // empty')
fi
NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id // empty')
if [ -z "$NEXT" ]; then
  echo "Could not pour next refinery wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
  echo "Could not assign next refinery wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "Could not resolve current wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
```
7. Close this step after the current wisp is burned.

**A new polecat will pick up the bead, see the branch and rejection,
rebase, and reassign to refinery.**"""

[[steps]]
id = "run-tests"
title = "Run quality checks and tests"
needs = ["rebase"]
description = """
**Config: run_tests = {{run_tests}}**
**Config: test_command = {{test_command}}**
**Config: setup_command = {{setup_command}}**
**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: build_command = {{build_command}}**

Run each configured check in order (skip empty ones silently):
```bash
{{setup_command}}
{{typecheck_command}}
{{lint_command}}
{{build_command}}
```

If run_tests = "true":
```bash
{{test_command}}
```

If run_tests = "false": skip tests entirely.

**Fallback when this wisp has no quality-gate commands configured** (all of
setup_command, typecheck_command, lint_command, build_command, test_command
empty): do not silently skip. Read the repo's project-instructions file
(CLAUDE.md or AGENTS.md — whichever the configured provider expects; your
agent prompt lists the exact filename) and run the quality gates it
documents. Treat their failures the same way you would treat failures
from configured commands. The fallback preserves the quality-gate intent
when pack-specific guidance is missing.

Track results: which checks ran, pass/fail, specific failures.
Close this step when all checks complete (pass or fail)."""

[[steps]]
id = "handle-failures"
title = "Handle quality check or test failures"
needs = ["run-tests"]
description = """
If all checks and tests PASSED: close this step, proceed to merge-push.

If any check or test FAILED:

Read the current branch and target again:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
```

1. Diagnose: branch regression or pre-existing on target?

2. If branch caused it:
   - Clean up the existing workflow and reopen the source bead:
     ```bash
     gc workflow delete-source $WORK --apply && gc workflow reopen-source $WORK
     ```
   - Put the work bead back in the pool with rejection metadata:
     ```bash
     gc bd update $WORK \
       --status=open \
       --assignee="" \
       --set-metadata rejection_reason="<failure summary>" \
       --set-metadata gc.routed_to="${GC_RIG:+$GC_RIG/}{{binding_prefix}}polecat"
     ```
   - Delete branch: `git push origin --delete $BRANCH`
   - Clean up: `git checkout "$TARGET" && git branch -D temp`
   - Pour next patrol iteration before burning:
     ```bash
     CURRENT_WISP=${GC_BEAD_ID:-}
     if [ -z "$CURRENT_WISP" ]; then
       CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=in_progress --type=molecule --limit=1 --json | jq -r '.[0].id // empty')
     fi
     NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id // empty')
     if [ -z "$NEXT" ]; then
       echo "Could not pour next refinery wisp; not burning."
       gc runtime drain-ack
       exit 1
     fi
     if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
       echo "Could not assign next refinery wisp; not burning."
       gc runtime drain-ack
       exit 1
     fi
     if [ -n "$CURRENT_WISP" ]; then
       gc bd mol burn "$CURRENT_WISP" --force
     else
       echo "Could not resolve current wisp; not burning."
       gc runtime drain-ack
       exit 1
     fi
     ```
   - Close this step after the current wisp is burned.

3. If pre-existing on target:
   - Check for duplicates first:
     ```bash
     gc bd list --type=bug --status=open --search "<failure summary>"
     ```
   - If a matching bug already exists: note its ID and proceed with merge.
   - If no duplicate: file a new bead:
     ```bash
     gc bd create --type=bug --priority=1 --title="Pre-existing failure: <summary>"
     ```
   - Proceed with merge (failure not caused by this branch)

**GATE**: Cannot merge without all checks passing OR pre-existing bug filed/found.
**FORBIDDEN**: Writing code to fix failures. You are a merge processor.

**These checks are local, and local is not enough.** Everything above runs on
this machine, so it can only prove what this machine can build. A Linux worker
cannot build `Windows x86 / Release`; a green run here says nothing about it.
Passing this step earns the right to reach the hosted-CI gate in `merge-push`,
never the right to skip it."""

[[steps]]
id = "merge-push"
title = "Merge and push"
needs = ["handle-failures"]
description = """
**Config: target_branch = {{target_branch}}**
**Config: delete_merged_branches = {{delete_merged_branches}}**

Read the merge target and merge strategy from the work bead metadata:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
MERGE_STRATEGY=$(gc bd show $WORK --json | jq -r '.[0].metadata.merge_strategy // "direct"')
EXISTING_PR=$(gc bd show $WORK --json | jq -r '.[0].metadata.existing_pr // empty')
ORIGIN_REPO_ERROR=""
if command -v gh >/dev/null 2>&1; then
  if ! ORIGIN_REPO=$(gh repo view --json nameWithOwner -q '.nameWithOwner' 2>&1); then
    ORIGIN_REPO_ERROR="gh repo view failed while resolving origin repository: $ORIGIN_REPO"
    ORIGIN_REPO=""
  fi
else
  ORIGIN_URL=$(git remote get-url origin)
  case "$ORIGIN_URL" in
    git@github.com:*|https://github.com/*)
      ORIGIN_REPO=$(printf '%s\n' "$ORIGIN_URL" \
        | sed -E 's#^git@github.com:##; s#^https://github.com/##; s#\\.git$##')
      ;;
    *)
      ORIGIN_REPO_ERROR="GitHub REST fallback supports only github.com origin remotes; install gh for $ORIGIN_URL."
      ;;
  esac
fi
if [ "$MERGE_STRATEGY" = "pr" ]; then
  MERGE_STRATEGY="mr"
fi
if [ -n "$EXISTING_PR" ] && [ "$MERGE_STRATEGY" = "direct" ]; then
  echo "metadata.existing_pr requires pull-request handoff; using merge_strategy=mr."
  MERGE_STRATEGY="mr"
fi

block_existing_pr() {
  reason="$1"
  gc bd update $WORK \
    --assignee="" \
    --set-metadata merge_result=blocked \
    --set-metadata gc.routed_to=human \
    --set-metadata blocked_reason="$reason"
  gc mail send mayor/ -s "ESCALATION: invalid existing_pr for $WORK" -m "$reason
Work bead: $WORK
Existing PR: $EXISTING_PR
Branch: $BRANCH
Target: $TARGET"
  CURRENT_WISP=${GC_BEAD_ID:-}
  if [ -z "$CURRENT_WISP" ]; then
    CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=in_progress --type=molecule --limit=1 --json | jq -r '.[0].id // empty')
  fi
  if [ -z "$CURRENT_WISP" ]; then
    echo "Could not resolve current wisp; not burning."
    echo "$reason"
    echo "STOP. Existing PR metadata needs human correction."
    gc runtime drain-ack
    exit 1
  fi
  NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id // empty')
  if [ -z "$NEXT" ]; then
    echo "Could not pour next refinery wisp; not burning."
    gc runtime drain-ack
    exit 1
  fi
  if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
    echo "Could not assign next refinery wisp; not burning."
    gc runtime drain-ack
    exit 1
  fi
  if [ -n "$CURRENT_WISP" ]; then
    gc bd mol burn "$CURRENT_WISP" --force
  else
    echo "Could not resolve current wisp; not burning."
    echo "$reason"
    echo "STOP. Existing PR metadata needs human correction."
    gc runtime drain-ack
    exit 1
  fi
  echo "$reason"
  echo "STOP. Existing PR metadata needs human correction."
  gc runtime drain-ack
  exit 1
}

branch_has_real_change() {
  # Shared false-completion predicate (0-diff/0-commit guard). Does
  # <branch-ref> introduce a real change vs its merge-base with
  # <target-ref>? Diff is authoritative — commit-count alone is a weaker
  # proxy because a branch can carry commits that net-zero — so we use
  # `git diff --quiet` and ALSO require >=1 commit beyond the base.
  #   exit 0 = real change (safe to merge / open PR)
  #   exit 1 = empty: no diff, or no commits, vs base (REFUSE close-as-merged)
  #   exit 2 = base/diff could not be computed: merge-base failed OR `git diff`
  #           itself errored (exit >1). Fail closed — a tool error is a suspect,
  #           not a licence to merge — so the caller halts, never improvises.
  bhrc_target="$1"
  bhrc_branch="$2"
  bhrc_base=$(git merge-base "$bhrc_target" "$bhrc_branch" 2>/dev/null) || return 2
  git diff --quiet "$bhrc_base" "$bhrc_branch"
  case "$?" in
    0) return 1 ;;  # no diff -> empty -> refuse
    1) : ;;         # diff present -> fall through to the commit-count check
    *) return 2 ;;  # git diff errored -> suspect -> refuse (fail closed)
  esac
  [ "$(git rev-list --count "$bhrc_base..$bhrc_branch" 2>/dev/null || echo 0)" -ge 1 ] || return 1
  return 0
}

halt_false_completion() {
  # branch_has_real_change tripped: a close-as-merged would assert "work was
  # merged" for a branch that merges to a no-op, which is definitionally
  # false. Halt-and-escalate (NEVER silent retry): leave the bead blocked
  # with a structured note, hand to human, nudge mayor + witness, then stop.
  # This surfaces the transient cause (e.g. session starvation -> 0-commit
  # polecat) instead of masking it.
  fc_branch="$1"
  fc_base="$2"
  gc bd update $WORK \
    --status=blocked \
    --assignee="" \
    --set-metadata merge_result=refused_false_completion \
    --set-metadata gc.routed_to=human \
    --set-metadata false_completion_suspected="branch $fc_branch no verified change vs $fc_base; refused merge-close"
  gc session nudge mayor "FALSE-COMPLETION HALT: $WORK — branch $fc_branch no verified change vs $fc_base; refused close-as-merged. Bead left blocked; NEVER silent retry."
  gc session nudge "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness" "FALSE-COMPLETION HALT: $WORK — branch $fc_branch no verified change vs $fc_base; refused close-as-merged."
  echo "REFUSED close-as-merged: $WORK branch $fc_branch introduces no real change vs $fc_base."
  echo "STOP. Bead left blocked + escalated to mayor/witness. NEVER silent retry."
  gc runtime drain-ack
  exit 1
}

pr_lookup_missing() {
  case "$1" in
    *"Could not resolve to a PullRequest"*|*"could not resolve to a PullRequest"*|*"no pull requests found"*|*"Not Found"*|*"not found"*|*"404"*) return 0 ;;
    *) return 1 ;;
  esac
}

pr_lookup_repo_mismatch() {
  case "$1" in
    *" belongs to repo "*", want "*) return 0 ;;
    *) return 1 ;;
  esac
}

resolve_github_token() {
  TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-${GIT_TOKEN:-}}}"
  if [ -n "$TOKEN" ]; then
    printf '%s\n' "$TOKEN"
    return
  fi
  printf 'protocol=https\nhost=github.com\n\n' \
    | GIT_TERMINAL_PROMPT=0 git credential fill 2>/dev/null \
    | sed -n 's/^password=//p' \
    | head -n 1
}

init_github_rest() {
  if [ -n "${API:-}" ] && [ -n "${TOKEN:-}" ]; then
    return 0
  fi
  if [ -n "$ORIGIN_REPO_ERROR" ]; then
    echo "$ORIGIN_REPO_ERROR" >&2
    return 1
  fi
  TOKEN=$(resolve_github_token)
  if [ -z "$TOKEN" ]; then
    echo "GitHub PR mode requires gh or a GitHub token available from env/git credential fill." >&2
    return 1
  fi
  case "$ORIGIN_REPO" in
    */*)
      OWNER=${ORIGIN_REPO%%/*}
      REPO=${ORIGIN_REPO#*/}
      ;;
    *)
      echo "Could not resolve standard github.com origin repository for REST fallback." >&2
      return 1
      ;;
  esac
  API="https://api.github.com/repos/$OWNER/$REPO"
}

curl_gh_api() {
  err_file="$1"
  shift
  curl -fsS \
    -H "Accept: application/vnd.github+json" \
    -H "Authorization: Bearer $TOKEN" \
    -H "Content-Type: application/json" \
    -H "X-GitHub-Api-Version: 2022-11-28" \
    "$@" 2>"$err_file"
}

lookup_pr_info() {
  ref="$1"
  err_file="$2"
  if command -v gh >/dev/null 2>&1; then
    gh pr view --json url,number,state,headRefName,baseRefName,headRepositoryOwner,headRepository -- "$ref" 2>"$err_file"
    return $?
  fi
  if ! init_github_rest 2>"$err_file"; then
    return 1
  fi
  PR_REF_REPO=$(printf '%s\n' "$ref" | sed -nE 's#^[Hh][Tt][Tt][Pp][Ss]://github.com/([^/]+/[^/]+)/pull/[0-9]+/?$#\\1#p' | head -n 1)
  if [ -n "$PR_REF_REPO" ] && [ "$PR_REF_REPO" != "$ORIGIN_REPO" ]; then
    echo "Pull request $ref belongs to repo $PR_REF_REPO, want $ORIGIN_REPO." >"$err_file"
    return 1
  fi
  PR_NUMBER=$(printf '%s\n' "$ref" | sed -nE 's#^[Hh][Tt][Tt][Pp][Ss]://github.com/[^/]+/[^/]+/pull/([0-9]+)/?$#\\1#p; s|^#([0-9]+)$|\\1|p; s|^([0-9]+)$|\\1|p' | head -n 1)
  if [ -z "$PR_NUMBER" ]; then
    PR_MATCHES=$(curl_gh_api "$err_file" \
      --get "$API/pulls" \
      --data-urlencode "state=open" \
      --data-urlencode "head=$OWNER:$ref" \
      --data-urlencode "base=$TARGET") || return 1
    PR_NUMBER=$(printf '%s\n' "$PR_MATCHES" | jq -r '.[0].number // empty')
  fi
  if [ -z "$PR_NUMBER" ]; then
    echo "Pull request $ref was not found." >"$err_file"
    return 1
  fi
  PR_RAW=$(curl_gh_api "$err_file" "$API/pulls/$PR_NUMBER") || return 1
  printf '%s\n' "$PR_RAW" \
    | jq '{url:.html_url, number, state:(.state | ascii_upcase), headRefName:.head.ref, baseRefName:.base.ref, headRepositoryOwner:{login:.head.repo.owner.login}, headRepository:{name:.head.repo.name}}'
}

# BEGIN REFINERY_CI_GATE
# Hosted-CI REGRESSION gate. Everything the run-tests step executes runs on
# THIS machine, so it can only prove what this machine builds. On one live rig
# every quality check the refinery ran was local, the hosted verdict was never
# read, and the target branch went success:9 -> failure:3 -> failure:11 over 55
# hours, one refinery merge at a time. Every failing check was a cross-platform
# target (Windows x86, portable macOS/Windows arm64) that a Linux worker cannot
# build.
#
# The gate is scoped to DEGRADATION, not to redness. It reads the head's check
# board AND the target tip's check board and rejects only what this branch made
# worse:
#
#   on the base   on the head   verdict
#   green         red           REGRESSION -- reject, naming the check
#   absent        red           REGRESSION -- a new failing job is worse
#   still running red           not PROVEN inherited -- reject (recoverable)
#   red           red           pre-existing -- ALLOW, reported loudly, stamped
#   anything      green         nothing to answer for -- pass
#   anything      still running bounded wait, then UNDETERMINED
#
# An absolute "red head = reject" gate cannot ship. On the operator's own rig
# the target branch went red and STAYED red; every branch cut from it inherited
# those failures, so an absolute gate would have blocked every fix -- including
# the fixes for the very failures causing the red. That repository sat frozen
# for roughly 16 hours and only moved when a human authorised a deliberate
# override. A gate that no repository with a red base can use is not a gate, it
# is a freeze, and it would be turned off on the first day it mattered.
#
# Return convention:
#   0 = no attributable degradation, or explicitly waived by ci_gate=false
#   1 = the BRANCH degraded the board -> ci_gate_reject: bead back in the pool
#       with a specific rejection_reason, branch left INTACT for fix-forward
#   2 = the gate could not be evaluated (API/tool/config fault, or the head is
#       still running) -> STOP without mutating bead state. "Cannot tell" is
#       never "no regression", and it is never blamed on the branch either.
# CI_GATE_DETAIL carries the specific, quotable reason for both 1 and 2.

CI_GATE="{{ci_gate}}"
CI_TIMEOUT_SECONDS="{{ci_timeout_seconds}}"
CI_POLL_SECONDS="{{ci_poll_seconds}}"
CI_ZERO_CHECK_GRACE_SECONDS="{{ci_zero_check_grace_seconds}}"
CI_GATE_PUBLISH_HEAD="{{ci_gate_publish_head}}"
CI_GATE_DETAIL=""
CI_GATE_SUMMARY=""
CI_GATE_LANDS=""
CI_GATE_BASE_SHA=""
CI_GATE_INHERITED_NAMES=""

ci_gate_now() {
  date +%s
}

ci_gate_reject() {
  # The EXISTING rejection flow, the same shape the rebase and handle-failures
  # steps use: reopen the source bead, work bead back in the pool with a
  # specific rejection_reason, routed to the polecat pool, then pour the next
  # wisp and burn this one so the queue keeps moving. A CI rejection is
  # fix-forward -- the polecat pushes another commit to the SAME branch -- so
  # the branch is NEVER deleted here, and in mr mode deleting it would orphan
  # an open PR. The base SHA the verdict was measured against is stamped on the
  # bead too: a reviewer must never have to guess what "worse" was worse than.
  cgr_reason="$1"
  gc workflow delete-source "$WORK" --apply && gc workflow reopen-source "$WORK"
  gc bd update "$WORK" --status=open --assignee="" --set-metadata rejection_reason="CI gate: $cgr_reason" --set-metadata ci_gate_base_sha="${CI_GATE_BASE_SHA:-unresolved}" --set-metadata ci_gate_result="rejected: $cgr_reason" --set-metadata gc.routed_to="${GC_RIG:+$GC_RIG/}{{binding_prefix}}polecat"
  echo "CI_GATE_REJECTED $WORK: $cgr_reason"
  echo "Branch $BRANCH left intact for fix-forward; bead NOT closed and NOT merged."
  CURRENT_WISP=${GC_BEAD_ID:-}
  if [ -z "$CURRENT_WISP" ]; then
    CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=in_progress --type=molecule --limit=1 --json | jq -r '.[0].id // empty')
  fi
  NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id // empty')
  if [ -z "$NEXT" ] || ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
    echo "Could not pour or assign the next refinery wisp; not burning."
    gc runtime drain-ack
    exit 1
  fi
  if [ -n "$CURRENT_WISP" ]; then
    gc bd mol burn "$CURRENT_WISP" --force
  else
    echo "Could not resolve current wisp; not burning."
    gc runtime drain-ack
    exit 1
  fi
  exit 1
}

ci_gate_api() {
  # One GitHub REST reader for the gate, over gh when present and the same
  # token/curl fallback the PR handoff already uses when it is not. No new
  # coupling: this is the plumbing lookup_pr_info and the PR handoff run on.
  cga_path="$1"
  cga_err="$2"
  if command -v gh >/dev/null 2>&1; then
    gh api -H "Accept: application/vnd.github+json" "repos/$ORIGIN_REPO/$cga_path" 2>"$cga_err"
    return $?
  fi
  init_github_rest 2>>"$cga_err" || return 1
  curl_gh_api "$cga_err" "$API/$cga_path"
}

ci_gate_stamp() {
  # Forensics written the moment the gate rules, not at close time: which SHA
  # was proven, which SHA it was measured AGAINST, and which failures were let
  # through as inherited. A bead that closed without a ci_gate_sha is a bead
  # that was never gated; a bead with a ci_gate_inherited is a bead that landed
  # onto a board that was already red, and both stay readable off the bead
  # months later.
  cgs_sha="$1"
  [ -n "${WORK:-}" ] || return 0
  gc bd update "$WORK" --set-metadata ci_gate_sha="$cgs_sha" --set-metadata ci_gate_base_sha="${CI_GATE_BASE_SHA:-none}" --set-metadata ci_gate_inherited="${CI_GATE_INHERITED_NAMES:-none}" --set-metadata ci_gate_result="$CI_GATE_SUMMARY"
}

ci_gate_resolve_base() {
  # WHICH BASE: the target branch tip at gate time, NOT the merge-base.
  #
  # The merge-base is the more theoretically honest attribution boundary -- it
  # is exactly the point the branch diverged, so everything after it is the
  # branch's own doing. It is also frequently un-gradeable: hosted CI attaches
  # check-runs to commits it was triggered for, and an arbitrary interior
  # commit of the target's history was very often never a branch tip any
  # workflow ran against. A comparison against a commit with an empty board
  # would classify every red check on the head as "absent on the base", i.e.
  # as a regression, which is the absolute gate wearing a disguise.
  #
  # The target tip does not have that problem: it is the commit `on: push`
  # workflows fire for, so a repository with CI has a board there, and it is
  # also the commit this work will actually land on. The two only differ when
  # the target moved after the rebase -- and this step rebases onto the target
  # tip immediately before gating, which makes the merge-base BE the target tip
  # in the normal case. When they do differ, a --ff-only merge onto a moved
  # target fails anyway and the branch comes back through here after another
  # rebase, so the window is a race of seconds, not a design gap.
  #
  # The residual: a check that the moved target broke is charged to the base,
  # not the branch, which is the direction that errs toward letting work land.
  CI_GATE_BASE_SHA=$(git rev-parse --verify --quiet "refs/remotes/origin/$TARGET" 2>/dev/null || true)
  if [ -z "$CI_GATE_BASE_SHA" ]; then
    CI_GATE_DETAIL="could not resolve refs/remotes/origin/$TARGET, so there is no base board to measure degradation against. Fetch origin and re-run. A missing base is UNDETERMINED, never a pass: without it the gate cannot tell a regression from an inherited failure."
    return 2
  fi
  return 0
}

ci_gate_board() {
  # Reads one commit's hosted verdict into CI_GATE_BOARD, normalised to one
  # entry per check NAME. Reads check-runs AND legacy commit statuses, because
  # a repo can publish either or both, and "I only looked at one API" is a way
  # to mistake silence for success.
  #
  # Aggregation of repeat runs of the same name is deliberately ASYMMETRIC, and
  # both directions are fail-closed:
  #   head: RED beats PENDING beats GREEN -- a red run on the head is red.
  #   base: GREEN beats RED beats PENDING -- a name only counts as already
  #         broken if nothing on the base ever passed it, so a flaky base
  #         cannot be used to excuse a head failure.
  cgb_sha="$1"
  cgb_mode="$2"
  CI_GATE_BOARD=""
  cgb_err=$(mktemp)
  cgb_checks=$(ci_gate_api "commits/$cgb_sha/check-runs?per_page=100" "$cgb_err")
  cgb_status=$?
  cgb_error=$(cat "$cgb_err")
  if [ "$cgb_status" -ne 0 ] || [ -z "$cgb_checks" ]; then
    rm -f "$cgb_err"
    CI_GATE_DETAIL="could not read check-runs for the $cgb_mode commit $cgb_sha: ${cgb_error:-no response}"
    return 2
  fi
  cgb_statuses=$(ci_gate_api "commits/$cgb_sha/status?per_page=100" "$cgb_err")
  cgb_status=$?
  cgb_error=$(cat "$cgb_err")
  rm -f "$cgb_err"
  if [ "$cgb_status" -ne 0 ] || [ -z "$cgb_statuses" ]; then
    CI_GATE_DETAIL="could not read commit statuses for the $cgb_mode commit $cgb_sha: ${cgb_error:-no response}"
    return 2
  fi
  CI_GATE_BOARD=$(jq -n -c --arg mode "$cgb_mode" --argjson checks "$cgb_checks" --argjson statuses "$cgb_statuses" '
      def clean: (. // "") | tostring | gsub("[[:space:]]+"; " ");
      def classify_run:
        (.conclusion // "") as $conclusion
        | if .status != "completed" then "PENDING"
          elif (["success","neutral","skipped"] | index($conclusion)) then "GREEN"
          else "RED" end;
      def classify_status:
        if .state == "pending" then "PENDING"
        elif .state == "success" then "GREEN"
        else "RED" end;
      ($checks.check_runs // []) as $runs
      | ($statuses.statuses // []) as $sts
      | (($runs | map({key: ("check-run:" + (.name | clean)), label: (.name | clean), state: classify_run, detail: ((.conclusion // .status // "unknown") | clean)}))
         + ($sts | map({key: ("status:" + (.context | clean)), label: (.context | clean), state: classify_status, detail: ((.state // "unknown") | clean)}))) as $all
      | {truncated: ((($checks.total_count // 0) > ($runs | length)) or (($statuses.total_count // 0) > ($sts | length))),
         checks: ($all | group_by(.key) | map(
             . as $group
             | ($group | map(.state)) as $states
             | (if $mode == "base"
                then (if ($states | index("GREEN")) then "GREEN" elif ($states | index("RED")) then "RED" else "PENDING" end)
                else (if ($states | index("RED")) then "RED" elif ($states | index("PENDING")) then "PENDING" else "GREEN" end) end) as $state
             | {key: $group[0].key, label: $group[0].label, state: $state,
                detail: (($group | map(select(.state == $state)) | .[0].detail) // $group[0].detail)}))}' 2>/dev/null)
  if [ -z "$CI_GATE_BOARD" ]; then
    CI_GATE_DETAIL="could not parse the hosted check response for the $cgb_mode commit $cgb_sha"
    return 2
  fi
  if [ "$(printf '%s\n' "$CI_GATE_BOARD" | jq -r '.truncated')" = "true" ]; then
    CI_GATE_BOARD=""
    CI_GATE_DETAIL="more checks on the $cgb_mode commit $cgb_sha than one page can report; the whole board is not visible, so nothing about it can be attributed either way"
    return 2
  fi
  return 0
}

ci_gate_compare() {
  # The whole verdict, in one pass over the two boards. A red check on the head
  # is a REGRESSION when the base is green, absent, or still running, and is
  # INHERITED when the base is red too.
  #
  # The one exception is a base with NO board at all: a repository whose CI
  # only runs on pull requests never publishes checks for its target tip, so
  # "absent on the base" there means "there is no baseline", not "this branch
  # added a failing job". Charging a head failure to the branch on that
  # evidence would freeze exactly the repositories this gate was rescoped to
  # unfreeze, so an empty base makes every red head check unattributable rather
  # than a regression, and the summary says so out loud.
  cgc_out=$(jq -n -r --argjson base "$CI_GATE_BASE_BOARD" --argjson head "$CI_GATE_HEAD_BOARD" '
      ($base.checks | map({(.key): .state}) | add // {}) as $bmap
      | ($base.checks | length) as $bcount
      | [ $head.checks[] | select(.state == "RED") | . + {base: ($bmap[.key] // "ABSENT")} ] as $reds
      | ($reds | map(select($bcount > 0 and .base != "RED"))) as $regressed
      | ($reds | map(select($bcount == 0 or .base == "RED"))) as $inherited
      | [ $head.checks[] | select(.state == "PENDING") ] as $pending
      | [ ($head.checks | length),
          $bcount,
          ($regressed | length),
          ($inherited | length),
          ($pending | length),
          ($regressed | map(.label + " [" + .detail + "; on the base: " + (if .base == "ABSENT" then "no such check" elif .base == "PENDING" then "still running" else (.base | ascii_downcase) end) + "]") | join("; ")),
          ($inherited | map(.label + " [" + .detail + "]") | join("; ")),
          ($pending | map(.label + " [" + .detail + "]") | join("; ")) ]
      | .[]' 2>/dev/null)
  if [ -z "$cgc_out" ]; then
    CI_GATE_DETAIL="could not compare the head board against the base board"
    return 2
  fi
  CI_GATE_TOTAL=$(printf '%s\n' "$cgc_out" | sed -n '1p')
  CI_GATE_BASE_TOTAL=$(printf '%s\n' "$cgc_out" | sed -n '2p')
  CI_GATE_REGRESSED=$(printf '%s\n' "$cgc_out" | sed -n '3p')
  CI_GATE_INHERITED=$(printf '%s\n' "$cgc_out" | sed -n '4p')
  CI_GATE_PENDING=$(printf '%s\n' "$cgc_out" | sed -n '5p')
  CI_GATE_REGRESSED_NAMES=$(printf '%s\n' "$cgc_out" | sed -n '6p')
  CI_GATE_INHERITED_NAMES=$(printf '%s\n' "$cgc_out" | sed -n '7p')
  CI_GATE_PENDING_NAMES=$(printf '%s\n' "$cgc_out" | sed -n '8p')
  return 0
}

ci_gate_check() {
  # Hosted CI must be no worse on the SHA this merge rests on than it already
  # is on the target it lands on.
  #   RED         failure, timed_out, cancelled, action_required, or any
  #               conclusion not on the accept list (default deny -- an
  #               unrecognized conclusion is not a pass)
  #   ACCEPTABLE  success, neutral, skipped
  #   PENDING     anything not completed: WAIT, bounded, then UNDETERMINED. A
  #               check that has not finished is not evidence of a regression,
  #               and a slow build is not the branch's fault.
  #   ZERO CHECKS on BOTH sides: this repo publishes no CI for this path and
  #               there is nothing to degrade -- allow. On the HEAD ONLY, with
  #               a base that does publish checks: coverage the target has was
  #               lost here -- reject.
  cgc_sha="$1"
  CI_GATE_DETAIL=""
  CI_GATE_SUMMARY=""
  CI_GATE_INHERITED_NAMES=""
  if [ "$CI_GATE" = "false" ]; then
    # An explicit operator waiver for a rig with no hosted CI. It is loud and
    # it is recorded on every bead it lets through. The gate itself never
    # reaches this state on its own -- no error path sets CI_GATE.
    CI_GATE_SUMMARY="disabled"
    echo "CI_GATE_DISABLED_BY_CONFIG: $cgc_sha closes without a hosted-CI comparison (ci_gate=false); stamping ci_gate_result=disabled on the bead."
    ci_gate_stamp "$cgc_sha"
    return 0
  fi
  if [ -z "${ORIGIN_REPO:-}" ]; then
    CI_GATE_DETAIL="could not resolve the origin repository to read hosted CI from: ${ORIGIN_REPO_ERROR:-origin is not a github.com remote}. Install gh, or set ci_gate=false if this rig genuinely has no hosted CI."
    return 2
  fi
  ci_gate_resolve_base || return 2
  # The base board is snapshotted ONCE, before the wait loop. The verdict is
  # then measured against a single fixed commit for the whole run rather than
  # against a target that may move underneath it mid-wait.
  ci_gate_board "$CI_GATE_BASE_SHA" base || return 2
  CI_GATE_BASE_BOARD="$CI_GATE_BOARD"
  echo "CI_GATE_BASE: measuring $cgc_sha against $TARGET at $CI_GATE_BASE_SHA."
  cgc_deadline=$(( $(ci_gate_now) + CI_TIMEOUT_SECONDS ))
  cgc_zero_deadline=$(( $(ci_gate_now) + CI_ZERO_CHECK_GRACE_SECONDS ))
  while : ; do
    ci_gate_board "$cgc_sha" head
    cgc_poll_status=$?
    if [ "$cgc_poll_status" -ne 0 ]; then
      # A transient API failure is not a green light. Retry inside the same
      # bounded window, then report it as undeterminable.
      if [ "$(ci_gate_now)" -ge "$cgc_deadline" ]; then
        return 2
      fi
      sleep "$CI_POLL_SECONDS"
      continue
    fi
    CI_GATE_HEAD_BOARD="$CI_GATE_BOARD"
    ci_gate_compare || return 2
    if [ "$CI_GATE_TOTAL" -eq 0 ]; then
      if [ "$(ci_gate_now)" -lt "$cgc_zero_deadline" ]; then
        # A push takes seconds to register workflow runs; give it the window
        # before concluding anything from an empty head board.
        sleep "$CI_POLL_SECONDS"
        continue
      fi
      if [ "$CI_GATE_BASE_TOTAL" -eq 0 ]; then
        CI_GATE_SUMMARY="no hosted checks on $cgc_sha and none on $TARGET at $CI_GATE_BASE_SHA either; this repository publishes no CI on this path, so this branch cannot have degraded it"
        echo "CI_GATE_NO_HOSTED_CI: $CI_GATE_SUMMARY"
        ci_gate_stamp "$cgc_sha"
        return 0
      fi
      CI_GATE_DETAIL="$TARGET at $CI_GATE_BASE_SHA publishes $CI_GATE_BASE_TOTAL checks and $cgc_sha publishes none after ${CI_ZERO_CHECK_GRACE_SECONDS}s. CI ran for the base and did not run here, so this branch lost coverage the target already has: a workflow was removed or renamed, or it never triggered for this ref. Nothing ran, so nothing can be compared."
      return 1
    fi
    if [ "$CI_GATE_REGRESSED" -gt 0 ]; then
      # Proven degradation. Do not wait for the rest of the board: the verdict
      # cannot improve, and the polecat can start on these names now.
      CI_GATE_DETAIL="$CI_GATE_REGRESSED of $CI_GATE_TOTAL checks are red on $cgc_sha and are NOT red on $TARGET at $CI_GATE_BASE_SHA: $CI_GATE_REGRESSED_NAMES. This branch made hosted CI worse. Fix these checks on the same branch and reassign."
      return 1
    fi
    if [ "$CI_GATE_PENDING" -gt 0 ]; then
      if [ "$(ci_gate_now)" -ge "$cgc_deadline" ]; then
        CI_GATE_DETAIL="$CI_GATE_PENDING of $CI_GATE_TOTAL checks on $cgc_sha were still running after ${CI_TIMEOUT_SECONDS}s: $CI_GATE_PENDING_NAMES. Unfinished is neither proof of a regression nor proof there is none, and a slow queue is not this branch's fault; re-run the gate once they finish."
        return 2
      fi
      sleep "$CI_POLL_SECONDS"
      continue
    fi
    if [ "$CI_GATE_INHERITED" -eq 0 ]; then
      CI_GATE_SUMMARY="$CI_GATE_TOTAL checks green on $cgc_sha, no regression against $TARGET at $CI_GATE_BASE_SHA ($CI_GATE_BASE_TOTAL checks)"
      cgc_marker="CI_GATE_GREEN"
    elif [ "$CI_GATE_BASE_TOTAL" -eq 0 ]; then
      CI_GATE_SUMMARY="$CI_GATE_TOTAL checks on $cgc_sha with $CI_GATE_INHERITED red and UNATTRIBUTABLE: $TARGET at $CI_GATE_BASE_SHA publishes no checks at all, so there is no baseline that could charge them to this branch: $CI_GATE_INHERITED_NAMES"
      cgc_marker="CI_GATE_UNATTRIBUTABLE"
    else
      CI_GATE_SUMMARY="$CI_GATE_TOTAL checks on $cgc_sha with no regression against $TARGET at $CI_GATE_BASE_SHA; $CI_GATE_INHERITED of them are already red on the base and are INHERITED, not caused here: $CI_GATE_INHERITED_NAMES"
      cgc_marker="CI_GATE_PREEXISTING_RED"
    fi
    if [ -n "$CI_GATE_LANDS" ]; then
      # Direct mode with ci_gate_publish_head=false and a rebase that rewrote
      # the branch: CI ruled on the published tip, and the commit that lands is
      # a replay of it onto a newer target. Say which SHA was proven and which
      # one lands, on stdout and on the bead, rather than implying they match.
      CI_GATE_SUMMARY="$CI_GATE_SUMMARY (landing $CI_GATE_LANDS, a rebase of it; set ci_gate_publish_head=true to gate the exact object)"
    fi
    echo "$cgc_marker: $CI_GATE_SUMMARY"
    if [ "$CI_GATE_INHERITED" -gt 0 ]; then
      echo "This work is allowed through because it did not make hosted CI worse, NOT because hosted CI is well. The base is red and stays red until something fixes it; ci_gate_inherited on the bead names what was let through."
    fi
    ci_gate_stamp "$cgc_sha"
    return 0
  done
}

ci_gate_run() {
  # Turns the gate's return code into the pack's two existing dispositions:
  # reject to the pool (the branch's fault) or STOP without mutating bead
  # state (ours). There is no third disposition and no path that silently
  # continues.
  ci_gate_check "$1"
  cgn_status=$?
  case "$cgn_status" in
    0) return 0 ;;
    1) ci_gate_reject "$CI_GATE_DETAIL" ;;
    *)
      echo "CI_GATE_UNDETERMINED: $CI_GATE_DETAIL"
      echo "STOP. Do not mutate bead state, do not merge, do not close. Cannot tell whether this branch degraded CI is not a licence to assume it did not."
      gc runtime drain-ack
      exit 1
      ;;
  esac
}
# END REFINERY_CI_GATE

if [ "$MERGE_STRATEGY" = "mr" ] && [ -n "$EXISTING_PR" ]; then
  if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
    block_existing_pr "metadata.existing_pr is set but metadata.branch is missing."
  fi

  if [ -z "$ORIGIN_REPO" ]; then
    [ -n "$ORIGIN_REPO_ERROR" ] && echo "$ORIGIN_REPO_ERROR"
    echo "Could not resolve origin repository for existing PR validation. STOP. Debug and retry without mutating bead state."
    gc runtime drain-ack
    exit 1
  fi

  EXISTING_PR_ERR=$(mktemp)
  EXISTING_PR_INFO=$(lookup_pr_info "$EXISTING_PR" "$EXISTING_PR_ERR")
  EXISTING_PR_STATUS=$?
  EXISTING_PR_ERROR=$(cat "$EXISTING_PR_ERR")
  rm -f "$EXISTING_PR_ERR"
  if [ "$EXISTING_PR_STATUS" -ne 0 ] || [ -z "$EXISTING_PR_INFO" ]; then
    if pr_lookup_repo_mismatch "$EXISTING_PR_ERROR"; then
      block_existing_pr "Existing PR $EXISTING_PR is not in $ORIGIN_REPO. $EXISTING_PR_ERROR"
    fi
    if pr_lookup_missing "$EXISTING_PR_ERROR"; then
      block_existing_pr "Existing PR $EXISTING_PR was not found or is not accessible."
    fi
    echo "Could not resolve existing PR $EXISTING_PR. STOP. Debug and retry without mutating bead state."
    [ -n "$EXISTING_PR_ERROR" ] && echo "$EXISTING_PR_ERROR"
    gc runtime drain-ack
    exit 1
  fi

  EXISTING_PR_STATE=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.state')
  EXISTING_PR_HEAD=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.headRefName')
  EXISTING_PR_BASE=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.baseRefName')
  EXISTING_PR_URL=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.url')
  EXISTING_PR_REPO=$(printf '%s\n' "$EXISTING_PR_URL" | sed -E 's#^https://github.com/([^/]+/[^/]+)/pull/[0-9]+$#\\1#')
  EXISTING_PR_HEAD_REPO=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name')

  if [ "$EXISTING_PR_STATE" != "OPEN" ]; then
    block_existing_pr "Existing PR $EXISTING_PR is $EXISTING_PR_STATE, want OPEN."
  fi
  if [ "$EXISTING_PR_HEAD" != "$BRANCH" ]; then
    block_existing_pr "Existing PR $EXISTING_PR targets branch $EXISTING_PR_HEAD, want $BRANCH."
  fi
  if [ "$EXISTING_PR_BASE" != "$TARGET" ]; then
    block_existing_pr "Existing PR $EXISTING_PR targets base $EXISTING_PR_BASE, want $TARGET."
  fi
  if [ "$EXISTING_PR_REPO" != "$ORIGIN_REPO" ]; then
    block_existing_pr "Existing PR $EXISTING_PR belongs to repo $EXISTING_PR_REPO, want $ORIGIN_REPO."
  fi
  if [ "$EXISTING_PR_HEAD_REPO" != "$ORIGIN_REPO" ]; then
    block_existing_pr "Existing PR $EXISTING_PR head repo $EXISTING_PR_HEAD_REPO, want $ORIGIN_REPO."
  fi
fi

if [ "$MERGE_STRATEGY" = "mr" ] && [ -z "$ORIGIN_REPO" ]; then
  [ -n "$ORIGIN_REPO_ERROR" ] && echo "$ORIGIN_REPO_ERROR"
  echo "Could not resolve origin repository for pull-request handoff. STOP. Debug and retry without mutating bead state."
  gc runtime drain-ack
  exit 1
fi
```

**If MERGE_STRATEGY = "direct" (default):**

**0. Merge-state gate (already-merged short-circuit + false-completion guard):**

Two failure modes share this gate, so evaluate them in one script that shares
shell state — an early `exit` in the already-merged branch below then provably
prevents the false-completion guard in this same script from running on a
closed bead. That `exit` does NOT drain: an already-merged close is a real
completion, so it skips the merge script and joins the normal path's
Cleanup -> patrol-summary -> next-iteration tail (pour next wisp, burn this
one), exactly like a normal merge. Only genuine errors drain-ack.

- **Already merged (close, do NOT halt):** a previous refinery pass merged this
  branch and the polecat crashed before the bead closed. That is a real
  completion, so close it as merged with `merged_sha` forensics rather than let
  the 0-diff guard escalate a done bead to a human. An ancestor check alone is
  not enough: a 0-commit branch is trivially an ancestor of the target (its tip
  is still the fork point), so gate the close on the branch also carrying >=1
  commit since its recorded `metadata.fork_sha`. Without `fork_sha` recorded,
  stay conservative and fall through to the false-completion guard.
- **False completion (halt):** a branch that introduces no change vs its
  merge-base is definitionally not a merge. Refuse it before touching `$TARGET`.
  Legit no-op resolutions use wontfix/duplicate/not-planned, never merged — so
  this never blocks a real merge.

```bash
FORK_SHA=$(gc bd show "$WORK" --json | jq -r '.[0].metadata.fork_sha // empty')
if ! git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"; then
  echo "git fetch failed; cannot evaluate merge state. STOP. Do not mutate bead state."
  gc runtime drain-ack
  exit 1
fi
git merge-base --is-ancestor "origin/$BRANCH" "origin/$TARGET"
ANCESTOR_STATUS=$?
case "$ANCESTOR_STATUS" in
  0)
    REAL_COMMITS=0
    if [ -n "$FORK_SHA" ]; then
      REAL_COMMITS=$(git rev-list --count "$FORK_SHA..origin/$BRANCH" 2>/dev/null || echo 0)
    fi
    if [ -n "$FORK_SHA" ] && [ "$REAL_COMMITS" -ge 1 ]; then
      ALREADY_SHA=$(git rev-parse "origin/$BRANCH")
      ALREADY_SHORT=$(git rev-parse --short "origin/$BRANCH")
      if gc bd update "$WORK" \
           --set-metadata merge_result=already_merged \
           --set-metadata merged_sha="$ALREADY_SHA" \
           --set-metadata merged_target="$TARGET" \
           --unset-metadata rejection_reason && \
         gc bd close "$WORK" --reason "Already merged to $TARGET at $ALREADY_SHORT (branch is an ancestor of target; closed instead of halting)"; then
        echo "ALREADY_MERGED: origin/$BRANCH is an ancestor of origin/$TARGET with $REAL_COMMITS commit(s) since fork — closed $WORK as merged. Skip the merge script; run Cleanup, then patrol-summary + next-iteration."
        exit 0
      fi
      # The update/close did not land (transient API failure). Do NOT report
      # merged with the bead still open; STOP so a later patrol retries.
      echo "ALREADY_MERGED close failed for $WORK; bead still open. STOP; a later patrol will retry."
      gc runtime drain-ack
      exit 1
    fi
    # Ancestor but no recorded real commits: a 0-commit branch. Fall through to
    # the false-completion guard, which refuses to close it as merged.
    ;;
  1) : ;;  # not an ancestor -> a normal merge candidate; fall through
  *)
    echo "git merge-base --is-ancestor errored (status $ANCESTOR_STATUS); cannot evaluate already-merged. STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
    ;;
esac

branch_has_real_change "origin/$TARGET" temp
BHRC_STATUS=$?
case "$BHRC_STATUS" in
  0) : ;;  # verified real change -> continue to the merge script below
  1) halt_false_completion "$BRANCH" "$(git merge-base "origin/$TARGET" temp 2>/dev/null || printf '%s' "origin/$TARGET")" ;;
  *)
    echo "branch_has_real_change could not evaluate temp vs origin/$TARGET (tool error, status $BHRC_STATUS). STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
    ;;
esac
```
If this block closed the bead as already-merged, the merge is already done:
SKIP the merge script (step 1 below) and go straight to **2. Cleanup**, then
let this step complete so **patrol-summary** and **next-iteration** run (they
pour the next wisp and burn this one) — the same tail a normal merge takes. Do
NOT drain-ack here; that would strand the loop and leak the merged branch.
Otherwise the branch has a verified real change and you continue to the merge.

**0b. Hosted-CI regression gate:**

Direct mode lands straight onto `$TARGET`, so it is the mode where a branch
that breaks a check does the damage, and it is the mode the incident happened
in. The gate runs here, before the merge script touches the target.

It asks one question: **is hosted CI worse on this branch than it already is
on `$TARGET`?** Not "is it green" — a target that is already red must still be
fixable, and a gate that blocks every branch cut from a red base freezes the
repository exactly when it most needs work to land. The base it measures
against is `origin/$TARGET`, the tip this work will land on and the commit
`on: push` workflows actually publish checks for.

**Which SHA it reads, and why direct mode does not publish anything.** Hosted
CI rules on SHAs that exist on the forge. `origin/$BRANCH` is already there —
the polecat pushed it. When the rebase onto `$TARGET` was a no-op, the commit
you are about to land IS that published tip and the gate is exact. When the
rebase rewrote the branch, the commit that lands is one no forge has seen, and
there are only two honest options: gate the published tip and say so, or push
the rewritten head first. Pushing is a real change to what this rig does with
remote refs, so it is opt-in (`ci_gate_publish_head`, default `false`) and a
rig that does not set it pushes exactly what it pushed before.

```bash
CI_GATE_SHA=$(git rev-parse temp)
if [ "$CI_GATE" != "false" ]; then
  CI_GATE_PUBLISHED_SHA=$(git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" || true)
  if [ "$CI_GATE_SHA" = "$CI_GATE_PUBLISHED_SHA" ]; then
    echo "CI_GATE_EXACT: the SHA being landed is the published tip of $BRANCH."
  elif [ "$CI_GATE_PUBLISH_HEAD" = "true" ]; then
    git checkout temp
    if ! git push origin "HEAD:$BRANCH" --force-with-lease; then
      echo "--force-with-lease refused: $BRANCH moved after your fetch. STOP, re-fetch, rebase again, and re-run the gate against the new SHA. Never plain --force, and never merge a SHA the gate did not rule on. Do not mutate bead state."
      gc runtime drain-ack
      exit 1
    fi
  elif [ -n "$CI_GATE_PUBLISHED_SHA" ]; then
    CI_GATE_LANDS="$CI_GATE_SHA"
    CI_GATE_SHA="$CI_GATE_PUBLISHED_SHA"
    echo "CI_GATE_REBASED_HEAD: gating the published tip $CI_GATE_PUBLISHED_SHA; the rebase onto $TARGET produces $CI_GATE_LANDS, which no forge has seen. Set ci_gate_publish_head=true to publish and gate the exact object."
  else
    echo "$BRANCH has no published tip to read hosted CI from. STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
  fi
fi

ci_gate_run "$CI_GATE_SHA"
```

A board this branch made worse rejects here — bead back in the pool, branch
left intact, next wisp poured — and the merge script below never runs. A board
that is red in exactly the ways `$TARGET` is already red passes, loudly, with
the inherited failures named on the bead in `ci_gate_inherited`. An unfinished
board is UNDETERMINED: it stops without touching bead state, because a check
that has not finished is not evidence against the branch.

**1. Merge, push, verify, and close work bead:**

Run this as one script. It uses a temporary detached worktree for the
target branch because the real target branch may already be checked out in
the rig's main worktree. Do not replace this with `git checkout $TARGET`.
The metadata write happens only after the remote target ref is verified at
the merged SHA.

```bash
set -e

MERGE_PARENT=$(mktemp -d "${TMPDIR:-/tmp}/gascity-refinery-merge.XXXXXX")
MERGE_WT="$MERGE_PARENT/target"
cleanup_merge_wt() {
  git worktree remove --force "$MERGE_WT" >/dev/null 2>&1 || true
  rm -rf "$MERGE_PARENT"
}
trap cleanup_merge_wt EXIT

git fetch origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"
TEMP_SHA=$(git rev-parse temp)
git worktree add --detach "$MERGE_WT" "origin/$TARGET"
git -C "$MERGE_WT" merge --ff-only "$TEMP_SHA"
MERGED_SHA=$(git -C "$MERGE_WT" rev-parse HEAD)
MERGED_SHORT=$(git -C "$MERGE_WT" rev-parse --short HEAD)
git -C "$MERGE_WT" push origin "HEAD:$TARGET"

git fetch origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"
REMOTE=$(git rev-parse "origin/$TARGET")
if [ "$MERGED_SHA" != "$REMOTE" ]; then
  echo "PUSH FAILED — origin/$TARGET is $REMOTE, want $MERGED_SHA. STOP. Do not mutate bead state."
  gc runtime drain-ack
  exit 1
fi

gc bd update "$WORK" \
  --set-metadata merge_result=merged \
  --set-metadata merged_sha="$MERGED_SHA" \
  --set-metadata merged_target="$TARGET" \
  --unset-metadata rejection_reason && \
gc bd close "$WORK" --reason "Merged to $TARGET at $MERGED_SHORT"
```

If the script exits non-zero: STOP. Debug and retry. Do NOT write merge
metadata, close the bead, or delete the source branch.

Both the `--set-metadata` write and the `gc bd close` are required —
`merged_sha` and `merged_target` are the only forensic breadcrumbs tying a
closed bead to its merge commit on `$TARGET`. `--unset-metadata
rejection_reason` clears any stale rejection field from an earlier
rejected/reworked attempt before the successful close.

`ci_gate_sha`, `ci_gate_base_sha`, `ci_gate_inherited` and `ci_gate_result`
are already on the bead — the CI gate stamped them the moment it ruled. A
`--ff-only` merge makes `merged_sha` the same object as `temp`, so
`ci_gate_sha == merged_sha` is the readable proof that hosted CI ruled on
exactly what landed; when they differ, `ci_gate_result` names the published tip
that was proven and the rebase that landed. `ci_gate_base_sha` is what "no
worse" was measured against, and `ci_gate_inherited` names every check that was
already failing there and was therefore not charged to this branch — the two
fields together are why an operator never has to guess whether a red target was
caused by a given bead or merely survived it.

**2. Cleanup:**
```bash
git checkout --detach "origin/$TARGET" >/dev/null 2>&1 || true
git branch -d temp || git branch -D temp || true
```
If delete_merged_branches = "true": `git push origin --delete $BRANCH`

**If MERGE_STRATEGY = "mr":**

Refinery does NOT land the branch directly. Instead it publishes a pull
request and treats PR creation as the terminal handoff for this work bead.

**0. Refuse a 0-diff branch (false-completion guard):**

The same predicate covers the empty-PR / 0-commit concern: do not publish a
pull request for a branch that introduces no change vs its merge-base. The
PR handoff closes the bead, so an empty PR is the same false completion as
an empty direct merge. A tool error (status 2) is not an empty branch — stop
without mutating bead state rather than halt-escalating a healthy branch.
```bash
branch_has_real_change "origin/$TARGET" temp
BHRC_STATUS=$?
case "$BHRC_STATUS" in
  0) : ;;  # verified real change -> continue to publish the PR
  1) halt_false_completion "$BRANCH" "$(git merge-base "origin/$TARGET" temp 2>/dev/null || printf '%s' "origin/$TARGET")" ;;
  *)
    echo "branch_has_real_change could not evaluate temp vs origin/$TARGET (tool error, status $BHRC_STATUS). STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
    ;;
esac
```

**1. Push the rebased branch back to origin:**
```bash
git checkout temp
git push origin HEAD:$BRANCH --force-with-lease
```
If `--force-with-lease` fails, the existing PR branch moved after your
fetch. STOP, fetch the latest branch, rebase your temp branch again, and
retry with `--force-with-lease`. Do not use plain `--force`.

**2. Reuse, create, or discover the pull request:**

Read the bead's description and notes once and stage them into a PR body
file (using `--body-file` avoids quoting/encoding hazards with multi-line
markdown). The body always carries the bead's full description (the
"why"), and includes the polecat's implementation notes (the "what")
when present.

```bash
WORK_JSON=$(gc bd show $WORK --json)
EXISTING_PR=$(printf '%s' "$WORK_JSON" | jq -r '.[0].metadata.existing_pr // empty')
ISSUE_TITLE=$(printf '%s' "$WORK_JSON" | jq -r '.[0].title')
ISSUE_DESC=$(printf '%s' "$WORK_JSON" | jq -r '.[0].description // empty')
ISSUE_NOTES=$(printf '%s' "$WORK_JSON" | jq -r '.[0].notes // empty')
ISSUE_TYPE=$(printf '%s' "$WORK_JSON" | jq -r '.[0].issue_type // "task"')
ISSUE_PRIORITY=$(printf '%s' "$WORK_JSON" | jq -r '.[0].priority // empty')

PR_BODY_FILE=$(mktemp)
{
  echo "## Summary"
  echo
  if [ -n "$ISSUE_DESC" ]; then
    printf '%s\n' "$ISSUE_DESC"
  else
    printf 'Refinery handoff for `%s` (no bead description recorded).\n' "$WORK"
  fi
  if [ -n "$ISSUE_NOTES" ]; then
    echo
    echo "## Implementation notes"
    echo
    printf '%s\n' "$ISSUE_NOTES"
  fi
  echo
  echo "## Refinery handoff"
  echo
  printf -- '- Issue: `%s` (%s%s)\n' "$WORK" "$ISSUE_TYPE" "${ISSUE_PRIORITY:+, P$ISSUE_PRIORITY}"
  printf -- '- Source branch: `%s`\n' "$BRANCH"
  printf -- '- Target: `%s`\n' "$TARGET"
  printf -- '- Rebased on `%s` via Gastown Refinery.\n' "$TARGET"
} > "$PR_BODY_FILE"

if [ -n "$EXISTING_PR" ]; then
  PR_REF="$EXISTING_PR"
else
  if command -v gh >/dev/null 2>&1; then
    PR_URL=$(gh pr create \
      --base "$TARGET" \
      --head "$BRANCH" \
      --title "$ISSUE_TITLE ($WORK)" \
      --body-file "$PR_BODY_FILE" 2>/dev/null || true)

    if [ -z "$PR_URL" ]; then
      PR_URL=$(gh pr view "$BRANCH" --json url -q '.url')
    fi
  else
    PR_ERR=$(mktemp)
    if ! init_github_rest 2>"$PR_ERR"; then
      cat "$PR_ERR"
      rm -f "$PR_ERR"
      gc runtime drain-ack
      exit 1
    fi
    EXISTING=$(curl_gh_api "$PR_ERR" \
      --get "$API/pulls" \
      --data-urlencode "state=open" \
      --data-urlencode "head=$OWNER:$BRANCH" \
      --data-urlencode "base=$TARGET")
    PR_STATUS=$?
    PR_ERROR=$(cat "$PR_ERR")
    if [ "$PR_STATUS" -ne 0 ]; then
      echo "GitHub API request failed while checking for an existing PR for $BRANCH."
      [ -n "$PR_ERROR" ] && echo "$PR_ERROR"
      rm -f "$PR_ERR"
      gc runtime drain-ack
      exit 1
    fi
    PR_NUMBER=$(printf '%s\n' "$EXISTING" | jq -r '.[0].number // empty')
    if [ -z "$PR_NUMBER" ]; then
      CREATE_PAYLOAD=$(jq -n \
        --arg title "$ISSUE_TITLE ($WORK)" \
        --arg head "$BRANCH" \
        --arg base "$TARGET" \
        --rawfile body "$PR_BODY_FILE" \
        '{title:$title, head:$head, base:$base, body:$body}')
      CREATED=$(curl_gh_api "$PR_ERR" \
        -X POST "$API/pulls" \
        -d "$CREATE_PAYLOAD")
      PR_STATUS=$?
      PR_ERROR=$(cat "$PR_ERR")
      if [ "$PR_STATUS" -ne 0 ]; then
        echo "GitHub API request failed while creating a PR for $BRANCH."
        [ -n "$PR_ERROR" ] && echo "$PR_ERROR"
        rm -f "$PR_ERR"
        gc runtime drain-ack
        exit 1
      fi
      PR_NUMBER=$(printf '%s\n' "$CREATED" | jq -r '.number // empty')
      if [ -z "$PR_NUMBER" ]; then
        echo "GitHub API response did not include a pull request number."
        rm -f "$PR_ERR"
        gc runtime drain-ack
        exit 1
      fi
    fi
    PR_RAW=$(curl_gh_api "$PR_ERR" "$API/pulls/$PR_NUMBER")
    PR_STATUS=$?
    PR_ERROR=$(cat "$PR_ERR")
    rm -f "$PR_ERR"
    if [ "$PR_STATUS" -ne 0 ]; then
      echo "GitHub API request failed while reading PR $PR_NUMBER."
      [ -n "$PR_ERROR" ] && echo "$PR_ERROR"
      gc runtime drain-ack
      exit 1
    fi
    PR_URL=$(printf '%s\n' "$PR_RAW" | jq -r '.html_url // empty')
  fi
  PR_REF="$BRANCH"
fi

rm -f "$PR_BODY_FILE"
```

**3. Verify the pull request exists:**
```bash
PR_ERR=$(mktemp)
PR_INFO=$(lookup_pr_info "$PR_REF" "$PR_ERR")
PR_STATUS=$?
PR_ERROR=$(cat "$PR_ERR")
rm -f "$PR_ERR"
if [ "$PR_STATUS" -ne 0 ] || [ -z "$PR_INFO" ]; then
  if [ -n "$EXISTING_PR" ] && pr_lookup_missing "$PR_ERROR"; then
    block_existing_pr "Existing PR $EXISTING_PR was not found or is not accessible."
  fi
  echo "Pull request $PR_REF was not found."
  [ -n "$PR_ERROR" ] && echo "$PR_ERROR"
  gc runtime drain-ack
  exit 1
fi
PR_URL=$(printf '%s\n' "$PR_INFO" | jq -r '.url')
PR_NUMBER=$(printf '%s\n' "$PR_INFO" | jq -r '.number')
PR_STATE=$(printf '%s\n' "$PR_INFO" | jq -r '.state')
PR_HEAD=$(printf '%s\n' "$PR_INFO" | jq -r '.headRefName')
PR_BASE=$(printf '%s\n' "$PR_INFO" | jq -r '.baseRefName')
PR_REPO=$(printf '%s\n' "$PR_URL" | sed -E 's#^https://github.com/([^/]+/[^/]+)/pull/[0-9]+$#\\1#')
PR_HEAD_REPO=$(printf '%s\n' "$PR_INFO" | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name')
echo "$PR_URL $PR_NUMBER $PR_STATE $PR_HEAD $PR_BASE $PR_REPO $PR_HEAD_REPO"
if [ "$PR_STATE" != "OPEN" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR is $PR_STATE, want OPEN."
  fi
  echo "Pull request $PR_REF is $PR_STATE, want OPEN."
  gc runtime drain-ack
  exit 1
fi
if [ "$PR_HEAD" != "$BRANCH" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR targets branch $PR_HEAD, want $BRANCH."
  fi
  echo "Pull request $PR_REF targets branch $PR_HEAD, want $BRANCH."
  gc runtime drain-ack
  exit 1
fi
if [ "$PR_BASE" != "$TARGET" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR targets base $PR_BASE, want $TARGET."
  fi
  echo "Pull request $PR_REF targets base $PR_BASE, want $TARGET."
  gc runtime drain-ack
  exit 1
fi
if [ "$PR_REPO" != "$ORIGIN_REPO" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR belongs to repo $PR_REPO, want $ORIGIN_REPO."
  fi
  echo "Pull request $PR_REF belongs to repo $PR_REPO, want $ORIGIN_REPO."
  gc runtime drain-ack
  exit 1
fi
if [ "$PR_HEAD_REPO" != "$ORIGIN_REPO" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR head repo $PR_HEAD_REPO, want $ORIGIN_REPO."
  fi
  echo "Pull request $PR_REF head repo $PR_HEAD_REPO, want $ORIGIN_REPO."
  gc runtime drain-ack
  exit 1
fi
```
If this command fails or prints empty output: STOP. Debug and retry. Do NOT continue.

**3b. Hosted-CI regression gate:**

The pull request exists; it is not finished. Publishing a PR closes this work
bead, so the hosted checks a local worker cannot run have to have ruled BEFORE
the close — otherwise the bead reads "done" while the branch broke a check
nobody is tracking. The question here is the same one direct mode asks: not
"is the PR green" but "is the PR worse than `$TARGET` already is". The base is
`origin/$TARGET`, the same branch the PR targets (step 3 already refused a PR
whose base is anything else).

This path gates the exact object: step 1 already pushed `temp` to
`origin/$BRANCH`, so no new push is needed here. Ask GitHub for the PR head
rather than trusting the local ref — if the two disagree, something pushed
after you and the checks you are about to read belong to a different commit.

```bash
CI_GATE_SHA=$(git rev-parse temp)
if [ "$CI_GATE" != "false" ]; then
  CI_GATE_HEAD_ERR=$(mktemp)
  CI_GATE_PR_RAW=$(ci_gate_api "pulls/$PR_NUMBER" "$CI_GATE_HEAD_ERR")
  CI_GATE_HEAD_STATUS=$?
  CI_GATE_HEAD_ERROR=$(cat "$CI_GATE_HEAD_ERR")
  rm -f "$CI_GATE_HEAD_ERR"
  if [ "$CI_GATE_HEAD_STATUS" -ne 0 ] || [ -z "$CI_GATE_PR_RAW" ]; then
    echo "Could not read the head SHA of PR #$PR_NUMBER: ${CI_GATE_HEAD_ERROR:-no response}"
    echo "STOP. Do not mutate bead state, do not close."
    gc runtime drain-ack
    exit 1
  fi
  CI_GATE_PR_HEAD_SHA=$(printf '%s' "$CI_GATE_PR_RAW" | jq -r '.head.sha // empty')
  if [ -z "$CI_GATE_PR_HEAD_SHA" ] || [ "$CI_GATE_PR_HEAD_SHA" != "$CI_GATE_SHA" ]; then
    echo "PR #$PR_NUMBER head is '${CI_GATE_PR_HEAD_SHA:-unknown}' but you pushed $CI_GATE_SHA."
    echo "STOP. Re-fetch, rebase, and re-run the gate against the SHA the PR actually carries."
    gc runtime drain-ack
    exit 1
  fi
  CI_GATE_SHA="$CI_GATE_PR_HEAD_SHA"
fi

ci_gate_run "$CI_GATE_SHA"
```

A rejection here leaves the PR open and the branch intact: the polecat pushes
a fix to the same branch, the PR updates, and the bead comes back. Deleting
the branch would orphan the PR.

**4. Record PR metadata and close the work bead:**

Run as a single chained command so the metadata write cannot be skipped
when the close-reason already names the PR. Both the `--set-metadata`
write and the `gc bd close` are required — `pr_url` and `pr_number`
are the only forensic breadcrumbs tying a closed bead to its pull
request. `--unset-metadata rejection_reason` clears any stale rejection
field from an earlier rejected/reworked attempt before the successful
close.

```bash
gc bd update $WORK \
  --set-metadata merge_result=pull_request \
  --set-metadata pr_url="$PR_URL" \
  --set-metadata pr_number="$PR_NUMBER" \
  --set-metadata merged_target="$TARGET" \
  --unset-metadata rejection_reason && \
gc bd close $WORK --reason "Pull request ready: $PR_URL"
```

**5. Cleanup:**
```bash
git checkout "$TARGET"
git branch -d temp
```
Do NOT delete `$BRANCH` in mr mode — GitHub pull requests need the source branch.

**If MERGE_STRATEGY = "local":**

STOP. Local-only merge handoff is not implemented in the Gastown example pack.
Leave the work bead assigned to refinery and escalate to mayor for manual handling:
```bash
gc mail send mayor/ -s "ESCALATION: unsupported merge_strategy=local" -m "Work bead: $WORK
Branch: $BRANCH
Target: $TARGET
The Gastown example refinery supports direct and mr/pr merge strategies only."
```
Do NOT close the bead, delete the branch, or burn the wisp until a human decides how to proceed.

**GATE**: direct mode requires verified target push. mr mode requires verified
PR URL. Both modes require the hosted-CI regression gate to have ruled that
this branch did not make hosted CI worse than `$TARGET` already is (or to have
been explicitly waived with `ci_gate=false`, which stamps
`ci_gate_result=disabled` on the bead). Bead closure only happens after the
selected handoff is confirmed AND the gate has ruled. The gate is never
skipped because the local checks passed: local checks passing while hosted CI
regressed is the exact shape of the incident this gate exists to stop. It is
also never escalated into "hosted CI must be green": inherited failures are
reported on the bead and allowed through, because a repository with a red base
that cannot land its own fix is a repository nobody can rescue."""

[[steps]]
id = "patrol-summary"
title = "Record patrol cycle summary"
needs = ["merge-push"]
description = """
Summarize this patrol cycle for handoff context. This becomes the
audit trail — the next refinery session can see what happened.

Include:
- Branch merged (name, target)
- Test results (pass/fail, which checks ran)
- Bugs filed (IDs, if any pre-existing failures were tracked)
- Rejections (if the branch was rejected back to pool)
- Any escalations sent

If the cycle ended early (conflict rejection, no work found), note
why and what state was left.

This summary is not stored separately — it lives in the wisp's
closing reason. The next session can find it via `gc bd list --type=molecule
--status=closed --limit=5` if it needs predecessor context."""

[[steps]]
id = "next-iteration"
title = "Prepare next patrol iteration"
needs = ["patrol-summary"]
description = """
**Config: integration_branch_auto_land = {{integration_branch_auto_land}}**

**1. Integration branch check (only if auto_land = "true"):**

If the merge target was an integration branch, check if the parent
owned convoy is now fully closed:
```bash
gc bd list --type=convoy --status=open
```
For each owned convoy with an integration branch: if ALL children are
closed, assign the convoy bead itself to you with the metadata needed
for a merge:
```bash
gc bd update <convoy-id> --assignee=$GC_AGENT \
  --set-metadata branch=<integration-branch> \
  --set-metadata target={{target_branch}}
```
The next patrol iteration picks up the convoy like any other work bead
and merges the integration branch to {{target_branch}} normally.

**FORBIDDEN**: Landing integration branches via raw `git merge`/`git push`.
The convoy bead assignment is the ONLY path.

If auto_land = "false": skip this entirely.

**2. Resolve the current wisp, pour next iteration, then burn this wisp:**
```bash
CURRENT_WISP=${GC_BEAD_ID:-}
if [ -z "$CURRENT_WISP" ]; then
  CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=in_progress --type=molecule --limit=1 --json | jq -r '.[0].id // empty')
fi
NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id // empty')
if [ -z "$NEXT" ]; then
  echo "Could not pour next refinery wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
  echo "Could not assign next refinery wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "Could not resolve current wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
```

Close this step. The new wisp is ready — re-read formula steps to begin."""
