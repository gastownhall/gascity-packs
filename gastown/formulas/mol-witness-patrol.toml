description = """
Witness patrol loop. Poured as a root-only wisp on startup:

  gc bd mol wisp mol-witness-patrol --root-only --var binding_prefix='{{binding_prefix}}'
  gc bd update $WISP --assignee=$GC_AGENT

Each wisp is ONE iteration: check for work, patrol, pour the next
iteration. On crash, re-read the formula steps and determine where
you left off from context (bead state, mail state, last action).

Formula steps are NOT materialized as child beads. Read the step
descriptions below and work through them in order.

The loop mechanism: EVERY step is one leg of the same wisp. Never exit
the wisp from an intermediate step — either continue to the next step
or jump directly to `next-iteration` to pour and burn. Exiting without
burning leaks wisps (see #1884). The prompt only bootstraps the first
wisp.

## Witness Role

The witness is the rig's work-health monitor. It does NOT manage processes
(the controller handles start/stop/restart/zombie detection). The witness
monitors the WORK layer:

1. **Orphaned bead recovery** — beads assigned to agents that won't spawn
   (pool max changed, agent removed from config). This is the core job.
2. **Refinery queue health** — work beads assigned to refinery, staleness.
3. **Polecat health** — detect stuck polecats, file warrants for dog pool.
4. **Help mail** — triage HELP/escalation requests from polecats.

Gate checks and convoy/swarm completion are town-wide concerns handled by
the deacon, not the per-rig witness.

## Canonical Work Chain

```
worktree → (push) → branch → (merge) → target branch
```

Each transition moves the canonical location of the work. Once moved,
the previous local execution state can be retired only after its remote
replacement is proved:
- After push: the worktree is eligible for validated cleanup (branch is
  canonical).
- After merge: the target is canonical, while the exact successfully
  handed-off source ref is retained as independent recovery evidence. Witness
  recovery never deletes that ref.

The witness's core recovery job: when a bead is orphaned (agent won't
come back), ensure the work reaches the branch (push), then clean up
the worktree. This makes the work schedulable again.

## What the witness does NOT do

- Zombie detection (controller reconcile loop handles this)
- Process start/stop (controller handles this)
- Code implementation (polecats do this)
- Gate checks (deacon handles town-wide)
- Convoy/swarm completion (deacon handles cross-rig)
- Kill stuck agents directly (files warrant, dog pool runs shutdown dance)

Read each step's description before acting — Config values override defaults."""
formula = "mol-witness-patrol"

[vars]
[vars.binding_prefix]
description = "Import binding prefix for gastown agent identities, including trailing dot when bound."
default = ""

[vars.event_timeout]
description = "Seconds to sleep before re-checking. Replaces former event-watch loop which hot-spun on cache-reconcile firehose."
default = "60"

[[steps]]
id = "check-inbox"
title = "Context check, then mail"
description = """
**1. Context check (FIRST — before any work):**
```bash
RSS=$(ps -o rss= -p $$ | tr -d ' ')
RSS_MB=$((RSS / 1024))
```

If RSS > 1500 MB or context feels heavy, request a restart:
```bash
gc runtime request-restart
```
This sets `GC_RESTART_REQUESTED` metadata on the session and blocks
forever. The controller will kill and restart the session on the next
reconcile tick. The current wisp stays assigned and the new session
the new session re-reads formula steps and resumes from context.

**2. Check mail:**
```bash
gc mail inbox
```

Handle each message type:

**HELP / Blocked:**
Classify by keyword, then act based on severity:

| Category | Keywords | Severity | Action |
|----------|----------|----------|--------|
| Emergency | crash, data loss, corruption, security | Critical | Mail mayor immediately [HIGH] |
| Failed | failed, error, cannot, broken, exception | High | Investigate; mail mayor if unresolvable |
| Blocked | blocked, waiting, depends on, need access | Medium | Try to unblock (point to docs, suggest approach); escalate if you can't |
| Decision | should I, which approach, trade-off, design | Low | Answer if you can; escalate only if architectural |
| Lifecycle | done, finished, idle, restarting | Info | Acknowledge; no escalation needed |
| General help | help, stuck, confused, how do I | Low | Point to docs/suggest approach; escalate only if truly stuck |

For escalations:
```bash
gc mail send mayor/ -s "ESCALATION: <polecat> needs help [HIGH|MED|LOW]" -m "<category>: <details>"
```
Do NOT escalate routine blocks or lifecycle messages — handle them yourself.
Archive once you have answered it, or once the escalation is represented by
durable tracked work.

**HANDOFF:**
Read predecessor context. Continue from where they left off. The handoff is
resolved once you have picked the work up — archive then, not on reading it.

**Other / informational:**
Verify there is nothing left to discharge, then archive. If something is,
resolve it or file a bead first.

**Hygiene principle**: archive a message once its obligation is resolved, or
once it is represented by durable tracked work — a bead, or a line in your
standing instructions. Reading is what clears the unread count; archiving is
what records that the obligation is discharged. Never archive to clear a
count. Reading is not parking either: `gc mail inbox` lists unread mail only,
so a message you read and leave open is not listed again. Anything you cannot
discharge this cycle becomes a bead, or goes back in your inbox with
`gc mail mark-unread <id>`.

Close this step and continue to `recover-orphaned-beads` — do NOT exit
the wisp here. The `next-iteration` step is the only place that pours
the next wisp and burns this one."""

[[steps]]
id = "recover-orphaned-beads"
title = "Recover orphaned work beads"
needs = ["check-inbox"]
description = """
**This is the witness's core job.**

Find beads assigned to agents that will never process them, salvage any
unpublished work from the worktree, and return beads to the pool.

This happens when:
- Pool max was reduced (agents that won't spawn anymore)
- An agent was removed from config
- An agent crashed and the controller decided not to restart it (quarantine)

**Step 1: Find orphaned beads via session-ID liveness.**

List beads assigned to agents in YOUR rig:
```bash
gc bd list --status=in_progress --json --limit=0
gc bd list --status=open --json --limit=0
```

Filter for beads with an assignee (skip unassigned beads). This pass does not
solve the controller race where orphaned work may already have been released to
open/unassigned before witness observes it; that requires a separate
worktree-salvage scan keyed by canonical `metadata.artifact_dir`, with a
validated legacy `metadata.work_dir` fallback. Bound Gastown polecat
assignees use the shape `<rig>/{{binding_prefix}}<polecat-suffix>`.

Get the full session roster for liveness checks:
```bash
gc session list --state=all --json
gc bd list --type=session --label=gc:session --include-infra --include-gates --all --json --limit=0
```

For each bead with an assignee, check **session-ID liveness** — NOT
template pattern matching. Pool instances get new IDs on restart, so
matching against a template pattern (e.g., `worker-3` matches template
`worker`) gives false negatives: the old session ID is dead but the
witness skips it thinking "the pool will restart it." The pool creates
a NEW session with a different ID — the old one never comes back.

**Liveness check procedure:**

1. Build the assignee→state liveness map ONCE per cycle (before the
   per-bead loop), then resolve each bead's assignee against it. Resolve by
   exact identifier lookup — do NOT extract a session ID with a regex or
   fixed prefix list: rig prefixes are configuration-derived, and assignees
   may be a session bead ID, session name, alias, concrete agent name, or
   configured named identity.

   Two schema facts this recipe depends on (verified live, gc-3tn8g):
   - `gc session list --json` returns an OBJECT `{sessions:[...], ...}`, not
     a top-level array — iterate `.sessions[]`, never the top level (the
     top-level values include booleans, so `$x.id` on them errors).
   - Session fields are lowercase snake_case: `id / name / session_name /
     alias / agent_name / state / closed`. Key the map on `id`, `name`,
     `session_name`, `alias`, and `agent_name` — the exact identifier forms
     an assignee may take.

   Stream both JSON blobs through temp files, never `--argjson` on argv: on a
   busy city the session `command` fields are large and overflow ARG_MAX
   (`argument list too long: jq`). Build the map through this function rather
   than inline — Step 2a re-runs it per orphan candidate, and a single
   definition is what stops the pre-destruction re-check from drifting away
   from this classification: same two legs, same identifier forms, same
   last-write-wins tie-break on duplicate identifiers.
   ```bash
   build_liveness_map() {
     # Stamp the watermark BEFORE the snapshot. Everything touched from this
     # instant onward is by definition not represented in the map about to be
     # built, so the staleness guard has to measure against the START of the
     # build, not its end. Measured on a 36-session city, the two queries plus
     # the jq build take 2.56s — stamping last put that whole window on the
     # wrong side of the comparison, which is the fail-open direction.
     MAP_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
     LIVENESS_MAP='{}'; MAP_COUNT=0; SESSION_COUNT=0; MAP_QUERY_RC=0

     SESSIONS_FILE=$(mktemp); SESSION_BEADS_FILE=$(mktemp)
     gc session list --state=all --json > "$SESSIONS_FILE" || MAP_QUERY_RC=1
     gc bd list --type=session --label=gc:session --include-infra --include-gates --all --json --limit=0 > "$SESSION_BEADS_FILE" || MAP_QUERY_RC=1

     if [ "$MAP_QUERY_RC" -eq 0 ]; then
       LIVENESS_MAP=$(jq -n --slurpfile sessions "$SESSIONS_FILE" --slurpfile session_beads "$SESSION_BEADS_FILE" '
         def add($m; $key; $state; $closed):
           if (($key // "") | length) == 0 then $m
           else $m + {($key): (if $closed then "closed" else ($state // "") end)}
           end;
         (reduce ($sessions[0].sessions // [])[] as $s ({};
             add(.; $s.id;         $s.state; ($s.closed // false))
           | add(.; $s.name;       $s.state; ($s.closed // false))
           | add(.; $s.session_name; $s.state; ($s.closed // false))
           | add(.; $s.alias;      $s.state; ($s.closed // false))
           | add(.; $s.agent_name; $s.state; ($s.closed // false))
         )) as $from_sessions
         | reduce ($session_beads[0] // [])[] as $b ($from_sessions;
             add(.; $b.metadata.configured_named_identity; $b.metadata.state; ($b.status == "closed")))') || MAP_QUERY_RC=1
       SESSION_COUNT=$(jq -r '(.sessions // []) | length' "$SESSIONS_FILE" 2>/dev/null || echo 0)
       MAP_COUNT=$(printf '%s' "$LIVENESS_MAP" | jq -r 'length' 2>/dev/null || echo 0)
     fi
     rm -f "$SESSIONS_FILE" "$SESSION_BEADS_FILE"

     # Non-zero means "could not verify liveness" — it never means "nobody is
     # alive". Callers must read it as a reason to leave beads alone, never as
     # a licence to orphan them.
     if [ "$MAP_QUERY_RC" -ne 0 ]; then return 1; fi
     if [ "${MAP_COUNT:-0}" -eq 0 ] && [ "${SESSION_COUNT:-0}" -gt 0 ]; then return 1; fi
     return 0
   }

   build_liveness_map; MAP_BUILD_RC=$?

   # Pin the cycle's opening watermark. Step 2a rebuilds the map per candidate,
   # which re-stamps MAP_BUILT_AT to ~now; comparing a bead against *that* would
   # leave a guard that only ever catches a sub-second window. This is the
   # baseline that stays fixed for the whole cycle.
   CYCLE_MAP_BUILT_AT="$MAP_BUILT_AT"
   ```

   `CYCLE_MAP_BUILT_AT` is the instant this cycle's first snapshot was
   *started* — anything the map cannot know about was touched at or after it.
   A bead whose own `updated_at` is not strictly older than that watermark was
   changed during this cycle, by someone other than us, so its classification
   may already be stale. Step 2a uses that to skip such a bead before anything
   acts on it.

   **Fail safe — never orphan on an unusable map.** If either query failed, or
   the map is empty while sessions exist, the schema has drifted again (the
   exact failure in gc-3tn8g). An empty or unbuilt map resolves every assignee
   to `absent` and would false-orphan live agents. ABORT recovery this cycle —
   do NOT classify any bead as orphaned — escalate, then continue to
   `check-refinery`:
   ```bash
   if [ "${MAP_BUILD_RC:-1}" -ne 0 ]; then
     if [ "${MAP_COUNT:-0}" -eq 0 ] && [ "${SESSION_COUNT:-0}" -gt 0 ]; then
       echo "FAIL-SAFE: empty liveness map with $SESSION_COUNT live sessions — skipping orphan recovery (treat all assignees as live)."
     else
       echo "FAIL-SAFE: liveness map could not be built (gc session list / gc bd list did not both succeed) — skipping orphan recovery (treat all assignees as live)."
     fi
     gc mail send mayor/ -s "WITNESS: orphan-recovery disabled — liveness map unusable" -m "Could not build a usable assignee->state map (build rc=$MAP_BUILD_RC, map entries=$MAP_COUNT, live sessions=$SESSION_COUNT). Either a query failed or the gc session list --json schema drifted again (gc-3tn8g); skipping orphan recovery this cycle to avoid false-orphaning live agents. Re-check the recover-orphaned-beads liveness recipe."
     # Skip the rest of this step; proceed to check-refinery.
   fi
   ```

   Resolve each bead's assignee against the prebuilt map:
   ```bash
   STATE=$(printf '%s' "$LIVENESS_MAP" | jq -r --arg a "$ASSIGNEE" '.[$a] // "absent"')
   ```

2. An `absent` lookup (assignee not in the map) is orphaned only for
   pool/ephemeral work identities. If the assignee is a refinery, witness, or
   other configured infrastructure identity, skip it instead of recovering it.

3. Classify:
   - `active` or `awake` → **not orphaned** (may be stuck —
     `check-polecat-health` handles that separately)
   - `creating`, `asleep`, `drained`, `suspended`, `draining`, or
     `quarantined` → **not orphaned** (controller or operator state still owns
     the session)
   - `archived`, `closed`, or `absent` after the exact lookup → **orphaned
     bead** for pool/ephemeral work — the owning session is gone and will never
     come back, regardless of whether the pool template still exists

**Important**: Beads assigned to the refinery, witness, or other
infrastructure agents (not pool instances) should be skipped — those
agents have persistent identity and the controller manages their
lifecycle directly.

**Step 2: For each orphaned bead, salvage work from the worktree.**

The canonical work chain: `worktree → (push) → branch → (merge) → target`.
Our job is to ensure work reaches the branch so it's schedulable.

Read the bead metadata to find the artifact worktree and branch. Canonical
`artifact_dir` wins. A legacy `work_dir` may be adopted in place only if its
physical path is this city's exact historical
`.gc/worktrees/<rig>/polecats/<provider>/worktrees/<bead>` layout and the
worktree belongs to this rig repository. Same-repository paths from another
city, rig, or namespace are unsafe. The persistent Gastown provider home
itself cannot pass the bead-scoped shape check.
```bash
RECOVERY_BLOCKED=false
BEAD_JSON=$(gc bd show <bead> --json) || {
  echo "Cannot read metadata for orphan candidate <bead>; leaving it untouched." >&2
  RECOVERY_BLOCKED=true
  BEAD_JSON='[]'
}
META=$(printf '%s' "$BEAD_JSON" | jq -ce '
  if type == "array" and length == 1 and (.[0] | type) == "object" and
     ((.[0].metadata // {}) | type) == "object"
  then .[0].metadata // {}
  else error("expected exactly one work bead object")
  end
') || {
  echo "Invalid metadata response for orphan candidate <bead>; leaving it untouched." >&2
  RECOVERY_BLOCKED=true
  META='{}'
}
ARTIFACT_DIR=$(printf '%s' "$META" | jq -r '.artifact_dir // empty')
LEGACY_WORK_DIR=$(printf '%s' "$META" | jq -r '.work_dir // empty')
BRANCH=$(printf '%s' "$META" | jq -r '.branch // empty')
if [ -z "${GC_CITY_PATH:-}" ] || [ -z "${GC_RIG:-}" ] ||
   [ -z "${GC_RIG_ROOT:-}" ]; then
  echo "GC_CITY_PATH, GC_RIG, and GC_RIG_ROOT are required for orphan artifact recovery." >&2
  RECOVERY_BLOCKED=true
fi
case "${GC_RIG:-}" in
  ""|"."|".."|*[!A-Za-z0-9._-]*)
    echo "Unsafe or missing rig name for orphan artifact recovery: ${GC_RIG:-<empty>}" >&2
    RECOVERY_BLOCKED=true
    ;;
esac

recovery_git_common_dir() {
  local repo_dir=$1 common_dir
  common_dir=$(git -C "$repo_dir" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) ||
    return 1
  (CDPATH= cd -- "$common_dir" 2>/dev/null && pwd -P)
}

validate_recovery_artifact_worktree() {
  local candidate=$1 city_root=$2 rig_name=$3 rig_root=$4 bead_id=$5
  local candidate_real candidate_top candidate_common rig_common
  local city_real rig_namespace rig_namespace_real canonical_path
  local worktrees_parent provider_home provider_root provider_name

  [ -n "$candidate" ] && [ -d "$candidate" ] || return 1
  candidate_real=$(CDPATH= cd -- "$candidate" 2>/dev/null && pwd -P) || return 1
  [ "$(basename -- "$candidate_real")" = "$bead_id" ] || return 1
  [ "$(basename -- "$(dirname -- "$candidate_real")")" = "worktrees" ] || return 1

  city_real=$(CDPATH= cd -- "$city_root" 2>/dev/null && pwd -P) || return 1
  rig_namespace="$city_real/.gc/worktrees/$rig_name"
  rig_namespace_real=$(CDPATH= cd -- "$rig_namespace" 2>/dev/null && pwd -P) ||
    return 1
  [ "$rig_namespace_real" = "$rig_namespace" ] || return 1
  canonical_path="$rig_namespace_real/artifacts/worktrees/$bead_id"
  if [ "$candidate_real" != "$canonical_path" ]; then
    worktrees_parent=$(dirname -- "$candidate_real")
    provider_home=$(dirname -- "$worktrees_parent")
    provider_root=$(dirname -- "$provider_home")
    provider_name=$(basename -- "$provider_home")
    [ "$provider_root" = "$rig_namespace_real/polecats" ] || return 1
    case "$provider_name" in
      ""|"."|".."|*[!A-Za-z0-9._-]*) return 1 ;;
    esac
  fi

  candidate_top=$(git -C "$candidate_real" rev-parse --show-toplevel 2>/dev/null) ||
    return 1
  candidate_top=$(CDPATH= cd -- "$candidate_top" 2>/dev/null && pwd -P) || return 1
  [ "$candidate_top" = "$candidate_real" ] || return 1
  candidate_common=$(recovery_git_common_dir "$candidate_real") || return 1
  rig_common=$(recovery_git_common_dir "$rig_root") || return 1
  [ "$candidate_common" = "$rig_common" ] || return 1
  printf '%s\n' "$candidate_real"
}

# Re-check immediately before recovery mutations. The cycle-wide liveness map
# is only a classifier; a replacement may have started since it was built.
confirm_orphan_still_unowned() {
  local current current_status current_assignee sessions live_count
  current=$(gc bd show <bead> --json) || return 1
  current=$(printf '%s' "$current" | jq -ce '
    if type == "array" and length == 1 and (.[0] | type) == "object"
    then .[0]
    else error("expected exactly one current work bead")
    end
  ') || return 1
  current_status=$(printf '%s' "$current" | jq -r '.status // empty') ||
    return 1
  current_assignee=$(printf '%s' "$current" | jq -r '.assignee // empty') ||
    return 1
  { [ "$current_status" = open ] || [ "$current_status" = in_progress ]; } ||
    return 1
  [ "$current_assignee" = "$ASSIGNEE" ] || return 1

  sessions=$(gc session list --state=all --json) || return 1
  live_count=$(printf '%s' "$sessions" | jq -r --arg owner "$current_assignee" '
    def identities: [.id, .name, .session_name, .alias, .agent_name]
      | map(select((. // "") | length > 0));
    [.sessions[]
     | select((identities | index($owner)) != null)
     | select(.state == "active" or .state == "awake" or
              .state == "creating" or .state == "asleep" or
              .state == "drained" or .state == "suspended" or
              .state == "draining" or .state == "quarantined")]
    | length') || return 1
  [ "$live_count" -eq 0 ]
}

WORKTREE=
ARTIFACT_SOURCE=
if [ -n "$ARTIFACT_DIR" ]; then
  ARTIFACT_CANDIDATE=$ARTIFACT_DIR
  ARTIFACT_SOURCE=artifact_dir
elif [ -n "$LEGACY_WORK_DIR" ]; then
  ARTIFACT_CANDIDATE=$LEGACY_WORK_DIR
  ARTIFACT_SOURCE=work_dir
else
  ARTIFACT_CANDIDATE=
fi

if [ "$RECOVERY_BLOCKED" != true ] && [ -n "$ARTIFACT_CANDIDATE" ]; then
  if WORKTREE=$(validate_recovery_artifact_worktree \
      "$ARTIFACT_CANDIDATE" "$GC_CITY_PATH" "$GC_RIG" \
      "$GC_RIG_ROOT" <bead>); then
    if [ "$ARTIFACT_SOURCE" = work_dir ]; then
      if confirm_orphan_still_unowned; then
        gc bd update <bead> \
          --set-metadata artifact_dir="$WORKTREE" \
          --unset-metadata work_dir || RECOVERY_BLOCKED=true
      else
        RECOVERY_BLOCKED=true
      fi
    fi
  else
    echo "Unsafe $ARTIFACT_SOURCE=$ARTIFACT_CANDIDATE for <bead>; it is not a recoverable task worktree." >&2
    if [ "$ARTIFACT_SOURCE" = artifact_dir ]; then
      echo "Canonical artifact metadata is present but invalid; preserving the bead for manual recovery." >&2
      RECOVERY_BLOCKED=true
    fi
    WORKTREE=
  fi
fi

# Recover an interrupted branch-metadata write without resetting work.
if [ "$RECOVERY_BLOCKED" != true ] && [ -z "$BRANCH" ] && [ -n "$WORKTREE" ]; then
  if ! confirm_orphan_still_unowned; then
    echo "Orphan ownership changed before branch recovery; leaving bead untouched." >&2
    RECOVERY_BLOCKED=true
  fi
fi
if [ "$RECOVERY_BLOCKED" != true ] && [ -z "$BRANCH" ] && [ -n "$WORKTREE" ]; then
  EXPECTED_BRANCH="polecat/<bead>"
  CURRENT_BRANCH=$(git -C "$WORKTREE" branch --show-current)
  if [ "$CURRENT_BRANCH" = "$EXPECTED_BRANCH" ]; then
    BRANCH=$EXPECTED_BRANCH
  elif [ -z "$CURRENT_BRANCH" ] &&
       ! git -C "$WORKTREE" show-ref --verify --quiet "refs/heads/$EXPECTED_BRANCH" &&
       ! git -C "$WORKTREE" show-ref --verify --quiet "refs/remotes/origin/$EXPECTED_BRANCH"; then
    # Preserve detached HEAD exactly; do not reset it to the target.
    if git -C "$WORKTREE" checkout -b "$EXPECTED_BRANCH"; then
      BRANCH=$EXPECTED_BRANCH
    else
      echo "Cannot attach detached orphan work to $EXPECTED_BRANCH; leaving bead untouched." >&2
      RECOVERY_BLOCKED=true
    fi
  else
    echo "Ambiguous orphan branch state for <bead>; refusing to reset or delete a ref." >&2
    RECOVERY_BLOCKED=true
  fi
  if [ -n "$BRANCH" ]; then
    gc bd update <bead> --set-metadata branch="$BRANCH" ||
      RECOVERY_BLOCKED=true
  fi
fi
if [ -n "$BRANCH" ] && ! git check-ref-format --branch "$BRANCH" >/dev/null 2>&1; then
  echo "Unsafe metadata.branch=$BRANCH for <bead>; leaving bead untouched." >&2
  RECOVERY_BLOCKED=true
fi
```

If `RECOVERY_BLOCKED=true`, escalate and stop processing this bead. Do not run
Cases A-E, cleanup, or workflow reset for it during this patrol.

**Step 2a: Re-verify liveness before anything acts on this bead.**

Step 1's classification is a snapshot, and the per-bead loop can run for
minutes after it. An agent that spawned in between resolves to `absent` there
while being alive and mid-edit right now. Re-check here — **above** the
salvage cases and all three destructive paths — rather than at any one of
them:

- Step 3 closes the bead with `gc bd close --force` and deletes its worktree
  when the branch reads as already on main;
- Step 3a reassigns the bead with `gc bd update --force` and runs
  `gc workflow delete-source` (leaving the task artifact for the refinery's
  terminal cleanup), then skips Step 3b entirely, so a guard placed there
  would never see this path;
- Step 3b removes the validated worktree and resets the bead to pool.

All three use `--force`, which overrides exactly the cross-actor claim guard
that would otherwise refuse a write against a live agent, and all three act on
this same Step 2 snapshot. One check above them covers all three; three copies
would drift. Salvage (Cases C and D below) is gated on the same verdict: it
commits and pushes whatever is in the worktree, which is not something to do
to an agent that is still editing it.

Only `absent`/orphan candidates reach here — beads classified `active`,
`asleep` or another do-not-touch state in Step 1 never enter this loop — so
this is one extra map build per candidate orphan, not per bead.

```bash
# Fail closed by construction: the verdict starts at "do not touch" and is
# only promoted by a check that provably succeeded. Every arm below that
# cannot prove orphanhood leaves it false, so an unset, errored or
# half-computed verdict skips rather than destroys.
STILL_ORPHANED=false

if [ "$RECOVERY_BLOCKED" = true ]; then
  # Step 2's artifact/branch validation already refused this bead.
  echo "SKIP: <bead> artifact or branch metadata is unsafe/ambiguous (RECOVERY_BLOCKED) — escalate; do not act on it this cycle."
elif [ -z "$ASSIGNEE" ]; then
  echo "SKIP: <bead> has no assignee to re-verify — cannot confirm it is orphaned; leaving it alone this cycle."
elif ! build_liveness_map; then
  # Same fail-safe as Step 1's: a failed query or an empty map is "cannot
  # verify", never "the assignee is gone". Escalate; do not fall through.
  echo "SKIP: <bead> liveness re-check unavailable (map build rc=1) — cannot verify, leaving it alone this cycle."
  gc mail send mayor/ -s "WITNESS: orphan re-check inconclusive for <bead>" -m "The pre-destruction liveness rebuild failed for assignee $ASSIGNEE (map entries=$MAP_COUNT, live sessions=$SESSION_COUNT). Skipped this candidate rather than acting on an unverified classification."
else
  # Re-read the bead itself. Two fields matter and both must be current: the
  # assignee (a human or the controller may have handed this bead to a live
  # agent since Step 1, which would make Step 1's $ASSIGNEE the wrong identity
  # to resolve) and updated_at.
  #
  # `updated_at` is a TOP-LEVEL bead field, never a metadata key, so reading it
  # off Step 2's $META (which is `jq '.[0].metadata'`) returned empty on every
  # bead and this guard could never fire.
  BEAD_JSON=$(gc bd show <bead> --json) || BEAD_JSON=""
  FRESH_ASSIGNEE=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].assignee // empty' 2>/dev/null || true)
  FRESH_ASSIGNEE="${FRESH_ASSIGNEE:-$ASSIGNEE}"
  BEAD_UPDATED_AT=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].updated_at // empty' 2>/dev/null || true)

  FRESH_STATE=$(printf '%s' "$LIVENESS_MAP" | jq -r --arg a "$FRESH_ASSIGNEE" '.[$a] // "absent"')

  # Normalize away fractional seconds before comparing. The watermark is stamped
  # whole-second by `date`, while `gc bd show` emits whole seconds for rig beads
  # and nanoseconds for graph-resident ones; comparing those two shapes as
  # strings inverts, because "." (0x2E) sorts before "Z" (0x5A), and it inverts
  # toward destroying. Truncating both to whole seconds and skipping unless the
  # bead is *strictly older* than the watermark keeps the boundary second on the
  # safe side: a bead touched in the same second the cycle started costs one
  # wasted cycle, which is the direction to be wrong in.
  BEAD_UPDATED_AT="${BEAD_UPDATED_AT%%.*}"
  case "$BEAD_UPDATED_AT" in ""|*Z) ;; *) BEAD_UPDATED_AT="${BEAD_UPDATED_AT}Z" ;; esac

  if [ "$FRESH_ASSIGNEE" != "$ASSIGNEE" ]; then
    echo "SKIP: <bead> was reassigned from $ASSIGNEE to $FRESH_ASSIGNEE since Step 1 — someone else owns it now; leave it alone."
  elif [ "$FRESH_STATE" != "absent" ] && [ "$FRESH_STATE" != "closed" ] && [ "$FRESH_STATE" != "archived" ]; then
    echo "SKIP: <bead> assignee $FRESH_ASSIGNEE is now '$FRESH_STATE' — spawned after the Step 1 snapshot. Not orphaned; leave it alone."
  elif [ -z "$BEAD_UPDATED_AT" ]; then
    echo "SKIP: <bead> updated_at could not be read — cannot confirm the classification is current; leaving it alone this cycle."
  elif ! [[ "$BEAD_UPDATED_AT" < "$CYCLE_MAP_BUILT_AT" ]]; then
    echo "SKIP: <bead> updated_at ($BEAD_UPDATED_AT) is not older than this cycle's liveness snapshot ($CYCLE_MAP_BUILT_AT) — something touched it mid-cycle. Not acting on a stale classification."
  else
    STILL_ORPHANED=true
  fi
fi
```

If `STILL_ORPHANED` is not `true`, skip this bead entirely and continue the
per-bead loop — do not salvage, do not close, do not reassign, do not delete
the worktree. Everything from here to Step 4 assumes `STILL_ORPHANED=true`
and each destructive site re-states the check, so a step reached out of order
still fails closed.

Only Cases B-D apply when `WORKTREE` is non-empty after this validation.
Never `cd` to, scan, or remove the unvalidated candidate. Check the bead and
validated worktree state, then act:

**Case A: Branch exists on origin (work already published).**
The worktree is eligible for validated cleanup — canonical work is on the
branch. The exact remote branch remains recovery evidence and is not deleted.
```bash
if [ -n "$BRANCH" ]; then
  git ls-remote --exit-code --heads origin "refs/heads/$BRANCH"
fi
```
Only an exit-0 exact-ref lookup proves that the branch exists on origin. An
empty branch is never passed to `ls-remote` (empty would list every head). If
the exact branch exists on origin → skip to Step 3 (cleanup).

**Case B: Worktree exists, branch pushed but not on origin yet.**
Branch is recorded in metadata but polecat may have crashed before push.
```bash
cd "$WORKTREE"
git ls-remote --exit-code --heads origin "refs/heads/$BRANCH"
```
If branch IS on origin → skip to Step 3.
If branch is NOT on origin → fall through to Case C.

**Case C: Worktree exists with unpushed commits.**
Work is committed locally but never pushed. Branch is not yet canonical.
```bash
confirm_orphan_still_unowned || {
  echo "Orphan ownership changed before salvage; do not commit or push." >&2
  gc runtime drain-ack
  exit 1
}
cd "$WORKTREE"
BRANCH=$(git branch --show-current)
if [ -z "$BRANCH" ]; then
  echo "Validated orphan worktree is detached; refusing an ambiguous push." >&2
  gc runtime drain-ack
  exit 1
fi
git log origin/main..HEAD --oneline  # Shows unpushed commits
```
Commit any remaining uncommitted/untracked work first (safeguard):
```bash
git status --porcelain
# If any output:
git add -A
git commit -m "witness: salvage uncommitted work (<bead>)"
```
Publish the work to make branch canonical:
```bash
git push origin "HEAD:refs/heads/$BRANCH"
gc bd update <bead> --set-metadata branch=$BRANCH
```
Skip to Step 3 (cleanup).

**Case D: Worktree exists with ONLY uncommitted/untracked changes (no commits).**
Same resolution as Case C. All work is useful work — never discard.
```bash
confirm_orphan_still_unowned || {
  echo "Orphan ownership changed before salvage; do not commit or push." >&2
  gc runtime drain-ack
  exit 1
}
cd "$WORKTREE"
git add -A
git commit -m "witness: salvage work from orphaned agent (<bead>)"
BRANCH=$(git branch --show-current)
if [ -z "$BRANCH" ]; then
  echo "Validated orphan worktree is detached; refusing an ambiguous push." >&2
  gc runtime drain-ack
  exit 1
fi
git push origin "HEAD:refs/heads/$BRANCH"
gc bd update <bead> --set-metadata branch=$BRANCH
```
Skip to Step 3 (cleanup).

**Case E: Canonical `metadata.artifact_dir` is absent, no validated legacy
worktree exists, and no branch exists on origin.**
Nothing to salvage. The bead goes back to pool and a new polecat
starts fresh.

**Step 3: Verify work on main before resetting.**

Before resetting the bead to pool, check if the branch was already merged
to main (polecat finished, pushed, but crashed before closing the bead).

**Ancestry alone is not enough.** `git merge-base --is-ancestor` only holds
when the branch's own commit objects are literally reachable from main —
true for a plain fast-forward or a real merge commit. It false-negatives
whenever the refinery lands the branch by *recreating* its commits
(rebase-then-fast-forward onto a main that has moved since the branch was
cut, or a squash) — main then carries a new commit with a different SHA
that contains exactly the branch's changes, and ancestry can never see
that. This is the normal case, not an edge case: any queue with 2+ beads
produces it as soon as a second bead lands after the first was rebased.
A false negative here re-dispatches already-merged work.

Run this merge-evidence check only for a validated, non-empty branch.
An empty branch with no worktree is Case E and must skip it entirely
(`ON_MAIN=false`); an empty branch name would otherwise be read as a
refspec-less fetch and an ancestry check against nothing.

```bash
# Every check below reads *local* remote-tracking refs, while Step 2's
# existence checks used live `ls-remote` — two freshness sources in one flow.
# Refresh first. A failed fetch must not be read as "nothing changed": fall
# back to not-merged, which re-dispatches (wasteful) rather than closing
# (terminal).
if [ -z "$BRANCH" ]; then
  ON_MAIN=false   # Case E: no validated branch, nothing to check
elif ! git fetch -q origin main "$BRANCH"; then
  ON_MAIN=false
# Cheap first pass — catches the plain fast-forward/merge-commit case:
elif git merge-base --is-ancestor origin/$BRANCH origin/main; then
  ON_MAIN=true
else
  # Rebase/squash recreates commits, so a "not an ancestor" result does
  # NOT mean "not merged" -- fall back to a content test, scoped to the
  # branch's own changed files. Bound, stated honestly: this holds while main
  # has not itself touched those files since the landing, and while the refs
  # above are fresh. Outside that bound it answers not-merged and the bead is
  # re-dispatched -- the pre-PR direction, wasteful but never destructive.
  MERGE_BASE=$(git merge-base origin/$BRANCH origin/main 2>/dev/null || true)
  if [ -z "$MERGE_BASE" ]; then
    ON_MAIN=false   # no shared history found; treat conservatively as not-yet-merged
  else
    # Collect NUL-separated into a quoted array. Both halves are load-bearing:
    # an unquoted `-- $CHANGED_FILES` word-splits, so a path containing
    # whitespace becomes pathspecs matching nothing -- and `git diff --quiet`
    # over pathspecs that match nothing exits 0, i.e. an UNMERGED branch reads
    # as merged and gets force-closed with its worktree deleted. `-z` is needed
    # as well as the quoting: without it `--name-only` C-quotes a path
    # containing a newline, and re-reading that quoted form yields a pathspec
    # that matches nothing in exactly the same way.
    # `while read -d ''` rather than `mapfile -d ''`: mapfile is a bash-4
    # builtin, and gastown/tests/test_witness_heartbeat_check.sh bans bash-4
    # constructs outright because the fleet includes macOS on bash 3.2.
    CHANGED=(); CHANGED_COUNT=0
    while IFS= read -r -d '' f; do
      CHANGED[$CHANGED_COUNT]="$f"; CHANGED_COUNT=$((CHANGED_COUNT + 1))
    done < <(git diff --name-only -z "$MERGE_BASE" "origin/$BRANCH")
    if [ "$CHANGED_COUNT" -eq 0 ]; then
      ON_MAIN=false   # branch introduced nothing beyond the merge-base; nothing to confirm
    elif git diff --quiet "origin/main" "origin/$BRANCH" -- "${CHANGED[@]}"; then
      ON_MAIN=true    # main's current content for exactly these files matches the branch
    else
      ON_MAIN=false
    fi
  fi
fi
```

If the work is already on main (`ON_MAIN=true`):
- **Close the bead** (work is done, don't re-dispatch). Use `--force`: the bead
  is still assigned to the crashed polecat, so this is a cross-actor close and
  bd's close-authority guard (gastownhall/beads#3734) would otherwise refuse it.
  `--force` is also what makes this destructive against a *live* agent, so it
  runs only on Step 2a's verdict — a terminal close on a bead whose work never
  landed cannot be undone by the next patrol cycle:
```bash
if [ "$STILL_ORPHANED" = "true" ] && [ "$ON_MAIN" = "true" ]; then
  if confirm_orphan_still_unowned; then
    gc bd close <bead> --force
    gc mail send mayor/ -s "ORPHAN_CLOSED: <bead> already merged" \
      -m "Branch $BRANCH already on main. Closed instead of resetting."
  else
    echo "Orphan ownership changed before close; leaving bead untouched." >&2
    RECOVERY_BLOCKED=true
  fi
fi
```
- Clean up worktree and skip to Step 4.

If the work is NOT on main, check for a completed-but-unhanded-off submit
before resetting to pool:

**Step 3a: Was this bead already handed off to the refinery step, just not
reassigned?** (gastownhall/gascity-packs#276)

`submit-and-exit` records `handoff_stage=target_recorded` in its step 5, then
reassigns the bead to the refinery in step 6 — two separate,
independently-interruptible `gc bd update` calls. A polecat killed in that
exact window (pool reclaim, host restart, context exhaustion) has already
pushed the branch, run its final clean-state check, and recorded the stage
marker; the only thing it never did was the reassignment itself. Resetting a
bead in this state to pool is safe (no data is lost — `workspace-setup`'s
rejection-aware resume picks the existing branch back up) but wasteful and
confusing: a fresh polecat spins up just to re-run branch-shape/clean-state
checks and a no-op push before reaching the same step 6 the witness can
complete directly, right now, with the information already on hand.

```bash
HANDOFF_STAGE=$(echo "$META" | jq -r '.handoff_stage // empty')
BEAD_TARGET=$(echo "$META" | jq -r '.target // empty')
BRANCH_ON_ORIGIN=""
# Query the fully-qualified ref. ls-remote patterns match ref *tails*, so the
# bare "$BRANCH" form stays truthy for a branch that is NOT on origin whenever
# a tail-colliding ref outlives it (say an archive/polecat/<id> convention):
# measured on git 2.43, deleting refs/heads/polecat/tst-1 still returns
# refs/heads/nested/polecat/tst-1 for the pattern, and 0 lines for the
# refs/heads/ form. Keep the -n guard too: an unset BRANCH must never be
# mistaken for a live branch.
[ -n "$BRANCH" ] && BRANCH_ON_ORIGIN=$(git ls-remote --heads origin "refs/heads/$BRANCH" 2>/dev/null)
```

Key this recovery on `handoff_stage`, **not** on `metadata.target`. `target`
is not a completion signal: `gc sling` accepts it as a documented mint-time
input (`mol-polecat-work.toml` workspace-setup resolves `base_branch` from
`metadata.target` first), nothing in the tree ever unsets it, and it survives
both `mol-refinery-patrol` rejection paths — so beads that never reached step 5
already carry it, and keying on it hands already-rejected or never-submitted
work back to a refinery whose only merge gate is tests-pass.
`handoff_stage=target_recorded` is written in exactly one place
(`submit-and-exit` step 5) and cleared in three (`workspace-setup` on every
fresh attempt, and both refinery rejection paths), so its presence means this
bead genuinely completed step 5 and nothing has since invalidated that. The
branch-on-origin conjunct is a fail-closed backstop: there is nothing to hand
off if the refinery's `--has-metadata-key=branch` query cannot see the work.

```bash
# STILL_ORPHANED is re-stated here because this arm never reaches Step 3b:
# `:455` skips straight to Step 4, so this is the one destructive path a guard
# placed at the pool reset would miss entirely.
# RECOVERY_BLOCKED and the fresh owner fence gate it exactly as they gate the
# Step 3 close and Step 3b reset.
if [ "$STILL_ORPHANED" = "true" ] && [ "$HANDOFF_STAGE" = "target_recorded" ] && [ -n "$BRANCH_ON_ORIGIN" ]; then
  REFINERY_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery"
  # --force: this is a cross-actor write against the dead polecat's live
  # in_progress claim, which bd refuses without it (the same claim guard
  # Step 3's close cites, gastownhall/beads#3734). Step 6 needs no --force
  # only because the polecat runs it as the bead's own actor.
  if gc bd update <bead> --status=open --assignee="$REFINERY_TARGET" \
       --set-metadata gc.routed_to="" --force; then
    # Close the crashed polecat's workflow subtree, as Step 3b does. Only the
    # delete-source half: reopen-source would clear the assignee just set.
    # Ordered after the reassignment so the failure arm mutates nothing, and
    # before the wake/nudge so the refinery is never signalled mid-cleanup.
    # Best-effort, like the wake/nudge below: the reassignment has already
    # succeeded by the time this runs, so a failure here leaves inert step
    # beads behind, never an unhandled handoff, and the mail stays truthful.
    gc workflow delete-source <bead> --apply || true
    gc mail send mayor/ -s "ORPHAN_HANDED_OFF: <bead> completed submit, missing only reassignment" \
      -m "Branch $BRANCH is on origin and handoff_stage=target_recorded was already set (target=$BEAD_TARGET) -- the crashed polecat had finished submit-and-exit through step 5. Completed step 6 (reassign to refinery) instead of resetting to pool."
    # Wake before nudge, exactly as submit-and-exit step 7: the refinery is
    # an on_demand session with a 2h idle timeout, and nudge alone leaves a
    # stopped one asleep with the handoff unprocessed.
    gc session wake "$REFINERY_TARGET" || true
    gc session nudge "$REFINERY_TARGET" "Run 'gc prime' to check merge queue and begin processing." || true
    # Leave the task artifact in place. This is now an ordinary refinery
    # handoff: exactly as after a normal submit-and-exit step 6, the
    # refinery's terminal `gc gastown task-artifact-cleanup` retires
    # `metadata.artifact_dir` only after a verified merge. Removing it here
    # would destroy the artifact before its source-SHA proof is captured.
    # Skip to Step 4 -- do NOT fall through to Step 3b's pool reset.
  else
    # The reassignment did not happen, and nothing above it mutated anything.
    # Never mail ORPHAN_HANDED_OFF and never remove the worktree on this path:
    # claiming a handoff that failed would strand the bead in_progress under a
    # dead assignee with its worktree gone, and the next patrol would
    # re-orphan it every cycle. Fall through to Step 3b, which sees exactly
    # the state it would have seen without Step 3a, and recovers to pool.
    echo "Step 3a: reassignment of <bead> failed; falling through to Step 3b."
  fi
fi
```

If `handoff_stage` is unset or the branch is not on origin, fall through to
Step 3b: the crash landed earlier than step 5, the bead was deliberately left
branch-ready by an `auto_push=false` halt (which never writes the marker), or
a rejection cleared it — and pool reset is the correct recovery.

**Step 3b: Clean up worktree and return bead to pool.**

**This bead is about to have its worktree deleted and be reset to pool.**
That is destructive, but it is *not* the only destructive action in this
recipe, and it is the mildest of the three: Step 3 closes the bead
terminally with `gc bd close --force`, and Step 3a reassigns it with
`gc bd update --force` and tears down its workflow subtree before skipping
here entirely. All three are covered by Step 2a's `STILL_ORPHANED` verdict,
which is re-stated at each of them so a step reached out of order still fails
closed.

```bash
if [ "$STILL_ORPHANED" != "true" ]; then
  echo "SKIP: <bead> did not pass the Step 2a liveness re-check — not deleting its worktree or resetting it."
  # Continue the per-bead loop; this bead is retried next cycle.
fi
```

Immediately before any removal or workflow reset, re-read ownership and
revalidate the current canonical-first artifact path. A restarted agent or
changed artifact path means the earlier orphan decision is stale; leave
everything untouched for the next patrol:
```bash
CURRENT_BEAD=$(gc bd show <bead> --json) || {
  echo "Cannot refresh <bead> before cleanup; preserving artifact and workflow." >&2
  RECOVERY_BLOCKED=true
  CURRENT_BEAD='[]'
}
CURRENT_RECORD=$(printf '%s' "$CURRENT_BEAD" | jq -ce '
  if type == "array" and length == 1 and (.[0] | type) == "object" and
     ((.[0].metadata // {}) | type) == "object"
  then .[0]
  else error("expected exactly one current work bead object")
  end
') || {
  echo "Invalid refreshed metadata for <bead>; preserving artifact and workflow." >&2
  RECOVERY_BLOCKED=true
  CURRENT_RECORD='{"metadata":{}}'
}
CURRENT_STATUS=$(printf '%s' "$CURRENT_RECORD" | jq -r '.status // empty')
CURRENT_ASSIGNEE=$(printf '%s' "$CURRENT_RECORD" | jq -r '.assignee // empty')
CURRENT_META=$(printf '%s' "$CURRENT_RECORD" | jq '.metadata // {}')
CURRENT_CANONICAL_ARTIFACT=$(printf '%s' "$CURRENT_META" |
  jq -r '.artifact_dir // empty')
CURRENT_ARTIFACT=$(printf '%s' "$CURRENT_META" | jq -r '
  if ((.artifact_dir // "") | length) > 0
  then .artifact_dir
  else (.work_dir // empty)
  end')
OWNER_LIVE_COUNT=1
if CURRENT_SESSIONS=$(gc session list --state=all --json); then
  OWNER_LIVE_COUNT=$(printf '%s' "$CURRENT_SESSIONS" |
    jq -r --arg owner "$CURRENT_ASSIGNEE" --arg original "$ASSIGNEE" '
      def identities: [.id, .name, .session_name, .alias, .agent_name]
        | map(select((. // "") | length > 0));
      [.sessions[]
       | select((identities | index($owner)) != null or
                (identities | index($original)) != null)
       | select(.state == "active" or .state == "awake" or
                .state == "creating" or .state == "asleep" or
                .state == "drained" or .state == "suspended" or
                .state == "draining" or .state == "quarantined")]
      | length') || OWNER_LIVE_COUNT=1
fi
RECOVERY_MODE=none
if [ "$RECOVERY_BLOCKED" != true ] && [ "$STILL_ORPHANED" = true ] &&
   [ "$OWNER_LIVE_COUNT" -eq 0 ]; then
  if [ "$CURRENT_STATUS" = closed ]; then
    RECOVERY_MODE=closed
  elif { [ "$CURRENT_STATUS" = open ] || [ "$CURRENT_STATUS" = in_progress ]; } &&
       [ "$CURRENT_ASSIGNEE" = "$ASSIGNEE" ]; then
    RECOVERY_MODE=reset
  fi
fi

# BEGIN WITNESS_ARTIFACT_SAFETY_GATE
ARTIFACT_SAFE=false
if [ "$RECOVERY_MODE" != none ]; then
  if [ -z "$WORKTREE" ]; then
    if [ -z "$CURRENT_CANONICAL_ARTIFACT" ] &&
       { [ -z "$CURRENT_ARTIFACT" ] ||
       ! validate_recovery_artifact_worktree \
         "$CURRENT_ARTIFACT" "$GC_CITY_PATH" "$GC_RIG" \
         "$GC_RIG_ROOT" <bead> >/dev/null; }; then
      ARTIFACT_SAFE=true
    fi
  elif REVALIDATED_WORKTREE=$(validate_recovery_artifact_worktree \
      "$CURRENT_ARTIFACT" "$GC_CITY_PATH" "$GC_RIG" \
      "$GC_RIG_ROOT" <bead>) &&
       [ "$REVALIDATED_WORKTREE" = "$WORKTREE" ]; then
    LOCAL_SHA=$(git -C "$WORKTREE" rev-parse HEAD 2>/dev/null || true)
    REMOTE_SHA=$(git -C "$GC_RIG_ROOT" ls-remote --heads origin \
      "refs/heads/$BRANCH" 2>/dev/null | cut -f1)
    if [ -n "$BRANCH" ] && [ -n "$LOCAL_SHA" ] &&
       [ "$LOCAL_SHA" = "$REMOTE_SHA" ]; then
      if WORKTREE_STATUS=$(git -C "$WORKTREE" status --porcelain); then
        if [ -z "$WORKTREE_STATUS" ]; then
          ARTIFACT_SAFE=true
        fi
      else
        echo "Cannot inspect <bead> artifact status; blocking cleanup and escalating for manual recovery." >&2
        RECOVERY_BLOCKED=true
        if ! gc mail send mayor/ \
          -s "RECOVERY_BLOCKED: artifact status unreadable for <bead>" \
          -m "Witness could not run git status for validated artifact $WORKTREE. The worktree and workflow were preserved; inspect Git and retry recovery manually."; then
          echo "Could not notify mayor about blocked recovery for <bead>; artifact remains preserved." >&2
        fi
      fi
    fi
  fi
fi
# END WITNESS_ARTIFACT_SAFETY_GATE

if [ "$ARTIFACT_SAFE" = true ]; then
  cd "$GC_RIG_ROOT" || {
    echo "Rig root disappeared before artifact removal; preserving bead state." >&2
    ARTIFACT_SAFE=false
  }
fi

if [ "$ARTIFACT_SAFE" = true ]; then
  if [ -n "$WORKTREE" ] &&
     ! git -C "$GC_RIG_ROOT" worktree remove "$WORKTREE"; then
    echo "Validated artifact could not be removed cleanly; preserving bead state." >&2
    ARTIFACT_SAFE=false
  fi
fi

if [ "$ARTIFACT_SAFE" = true ]; then
  if ! gc bd update <bead> \
      --unset-metadata artifact_dir \
      --unset-metadata work_dir; then
    echo "Artifact removed but metadata cleanup failed; do not reopen this bead until the stale canonical path is cleared." >&2
    ARTIFACT_SAFE=false
  fi
fi

if [ "$ARTIFACT_SAFE" = true ] && [ "$RECOVERY_MODE" = reset ]; then
  gc workflow delete-source <bead> --apply && gc workflow reopen-source <bead>
elif [ "$ARTIFACT_SAFE" = true ] && [ "$RECOVERY_MODE" = closed ]; then
  echo "Closed orphan artifact cleaned; leaving the closed bead closed."
else
  echo "Orphan ownership/artifact changed for <bead>; skipping cleanup and reset." >&2
fi
```

**Step 4: Assess and notify.**

Always log each recovery as an event. Mail the mayor only when the
recovery is unexpected or concerning — use your judgment:

| Situation | Action |
|-----------|--------|
| Pool resize / config change removed agent | Log only. Routine. |
| Agent crashed mid-work, branch already on origin | Log + nudge mayor. Low urgency. |
| Work salvaged from worktree (data was at risk) | Log + mail mayor. Work was nearly lost. |
| Same bead recovered before (check `metadata.recovered`) | Log + mail mayor. Possible crash loop. |

When you do mail:
```bash
gc mail send mayor/ -s "ORPHAN_RECOVERED: <bead>" \
  -m "Bead <bead> was assigned to <agent> which is no longer active.
Recovery: <what was done — branch pushed / metadata set / work salvaged / nothing to salvage>
Branch: <branch name or 'none'>
Status: Reset to open pool for re-dispatch.
Concern: <why this one warrants attention>"
```

Mark recovered beads so spawn storm detection can track patterns:
```bash
gc bd update <bead> --set-metadata recovered=true
```

**Exit criteria:** All orphaned beads recovered, worktrees cleaned.
Or no orphans found. Continue to `check-refinery` — do NOT exit the
wisp here. The `next-iteration` step is the only place that pours the
next wisp and burns this one."""

[[steps]]
id = "check-refinery"
title = "Check refinery queue health"
needs = ["recover-orphaned-beads"]
description = """
Ensure the refinery is processing work and the queue is healthy.

**Step 1: Check work beads assigned to refinery:**
```bash
gc bd list --assignee=<rig>/{{binding_prefix}}refinery --status=open --json
```

These are work beads with `metadata.branch` and `metadata.target` that
polecats have submitted for merging. Look for:

- **Stale beads**: Assigned to refinery but old `UpdatedAt`. The refinery
  may be stuck or the bead may have been missed.
- **Queue depth**: Many beads waiting may indicate the refinery is
  overwhelmed or down.
- **Empty queue**: No work assigned — refinery is idle, which is fine.

**Step 1b: Wake the refinery for due pull-request merge checks:**

`merge_strategy=mr` handoffs wait `blocked` until the refinery's find-work
step runs `gc gastown pr-merge-reconcile`. Blocked beads are not session
demand, so once the refinery idles out nothing else wakes it — and the
dependents of a pending PR are themselves blocked, so no new merge work
arrives to wake it either. A merged PR would then never release its
dependency chain. Wake it whenever a pending check is due (never checked, or
last checked more than 10 minutes ago); the refinery reconciles one pending
PR per wake, least-recently-checked first:
```bash
REFINERY_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery"
PENDING_PR_JSON=$(gc bd list ${GC_RIG:+--rig="$GC_RIG"} --all \
  --has-metadata-key=pr_reconcile_pending --limit=0 --json) || PENDING_PR_JSON='[]'
PENDING_PR_DUE=$(printf '%s' "$PENDING_PR_JSON" | jq -r '
  [ .[]?
    | select(((.metadata.pr_reconcile_pending // "") | tostring) == "true")
    | (.metadata.pr_last_checked_at // "")
    | select(. == "" or ((try fromdateiso8601 catch 0) < (now - 600))) ]
  | length' 2>/dev/null) || PENDING_PR_DUE=0
case "$PENDING_PR_DUE" in ''|*[!0-9]*) PENDING_PR_DUE=0 ;; esac
if [ "$PENDING_PR_DUE" -gt 0 ]; then
  # Wake before nudge: a stopped on-demand refinery ignores a bare nudge.
  gc session wake "$REFINERY_TARGET" || true
  gc session nudge "$REFINERY_TARGET" "Run 'gc prime' to check merge queue and begin processing." || true
fi
```
A failed listing reads as "nothing due" — this step only ever adds wakes; it
never mutates the pending beads themselves.

**Step 2: Assess refinery wisp freshness:**

Check when the refinery last completed a patrol cycle by looking at
recent burned wisps. If the refinery has work assigned but its last
wisp is stale, the refinery may be stuck.

**Step 3: Nudge if needed:**
```bash
gc session nudge <rig>/{{binding_prefix}}refinery "Work beads waiting for merge. Please check queue."
```

**Step 4: Escalate if needed:**
```bash
gc mail send mayor/ -s "QUEUE_HEALTH: <summary>" \
  -m "Work bead IDs: <ids>
Observation: <what you found>
Recommendation: <what should happen>"
```

**Exit criteria:** Queue health assessed; nudge sent or escalation
filed if needed. Continue to `check-polecat-health` — do NOT exit the
wisp here. The `next-iteration` step is the only place that pours the
next wisp and burns this one."""

[[steps]]
id = "check-polecat-health"
title = "Check polecat work progress"
needs = ["check-refinery"]
description = """
Detect polecats that are alive but not making progress on their work.

The controller detects dead agents and restarts them. But a polecat can
be alive and stuck — infinite loop, blocked on something, or just not
progressing. The controller can't detect this; it's a work-layer judgment.

**Step 1: Find active polecat work beads:**
```bash
gc bd list --status=in_progress --json --limit=0
```
Filter for beads assigned to polecat-pattern agents in YOUR rig.

**Step 2: For each, assess progress:**

Check the work bead's `UpdatedAt` timestamp and the polecat's molecule
wisp freshness. Consider:

- **Recently updated** → making progress, skip
- **Stale but agent is in a long tool call** → might be fine, use judgment
- **Very stale, no wisp progress** → likely stuck

There are no hardcoded thresholds. Consider the nature of the work, the
time elapsed, and whether the agent shows any signs of activity. This is
judgment work — exactly why an LLM does it, not Go code.

**Step 3: For stuck polecats, file a warrant (deduped).**

Do NOT kill the agent directly. File a warrant bead and let the dog pool
handle the shutdown dance (multi-stage interrogation with due process).

First check for an existing open warrant against the same target — a second
warrant spawns a second shutdown dance racing the first (duplicate kills,
wasted dog cycles). Skip filing if one is already open or in progress:

```bash
TARGET_SESSION="<session-name>"
EXISTING_WARRANT=$(gc bd list --label=warrant --json --limit=0 \
  | jq -r --arg t "$TARGET_SESSION" \
      '[.[] | select((.status == "open" or .status == "in_progress") and (.metadata.target == $t))] | length')
if [ "${EXISTING_WARRANT:-0}" -gt 0 ]; then
  echo "Skipping warrant for $TARGET_SESSION — an open warrant already exists."
else
  gc bd create --type=task \
    --title="Stuck: <session-name>" \
    --metadata '{"target":"<session-name>","reason":"No progress on <bead> for <duration>","requester":"witness","gc.routed_to":"{{binding_prefix}}dog"}' \
    --labels=warrant
fi
```

The dog pool picks up the warrant and runs `mol-shutdown-dance`, which
gives the polecat 3 chances to prove it's alive before killing it.

**Step 4: Log assessment:**

Note which polecats were checked and their status for observability.
Don't escalate to mayor for individual stuck polecats — the warrant
system handles it. Only escalate if you see a pattern (many stuck
polecats, systemic issue).

**Exit criteria:** All active polecat work beads assessed. Warrants
filed for stuck agents. Or no stuck polecats found. Continue to
`next-iteration` — do NOT exit the wisp here. The `next-iteration` step
is the only place that pours the next wisp and burns this one."""

[[steps]]
id = "next-iteration"
title = "Pour next iteration and loop"
needs = ["check-polecat-health"]
description = """
**Config: event_timeout = {{event_timeout}}**

End of patrol cycle. Pour the next iteration, then wait or exit.

**1. Context check:**

If context feels heavy or RSS is high:
```bash
gc runtime request-restart
```
This blocks forever. The controller restarts you. The next wisp
is already assigned — the new session resumes from context.

**2. Pour next iteration BEFORE burning (reconcile to exactly one):**

Reuse an already-queued wisp instead of pouring a duplicate. A prior cycle
may have poured a next wisp without burning, or a restart may have raced —
keep one open patrol wisp and burn any surplus, so wisps never accumulate.
Wisp roots are `issue_type=molecule` (never `--type=wisp`, which is not a
valid gc bd type and matches nothing). They are also ephemeral, so they live
in the wisps tier that `gc bd list` hides without `--include-infra` — drop that
flag and this query returns `[]` even when a wisp is already queued.
```bash
OPEN_WISPS=$(gc bd list --assignee="$GC_AGENT" --status=open --type=molecule --include-infra --limit=0 --json | jq -r '.[].id')
NEXT=$(printf '%s\n' $OPEN_WISPS | sed -n '1p')
for extra in $(printf '%s\n' $OPEN_WISPS | sed '1d'); do
  gc bd mol burn "$extra" --force
done
if [ -z "$NEXT" ]; then
  NEXT=$(gc bd mol wisp mol-witness-patrol --root-only --var binding_prefix='{{binding_prefix}}' --json | jq -r '.new_epic_id')
  gc bd update "$NEXT" --assignee="$GC_AGENT"
fi
```

**3. Burn this wisp:**
```bash
gc bd mol burn <this-wisp-id> --force
```

**4. Exit this turn:**
Write exactly:
```
IDLE: no work, exiting turn.
```
Then stop immediately. Do NOT sleep, call ScheduleWakeup, or use Monitor.
The idle_timeout (1h for this agent) will recycle this session after the idle
interval; the next wisp is already assigned and the recycled session re-reads
the formula and resumes from the beads ledger.

**Exit criteria:** Next wisp poured, this wisp burned, turn ended with IDLE signal."""
