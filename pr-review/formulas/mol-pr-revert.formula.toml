description = """
PR revert — 5 steps to PREPARE the revert of a merged PR.

Mayor-only invocation initially (no PL dispatch row). Reverts a merged PR
via `git revert <merge-sha>` on a fresh branch off `origin/<default>`,
composes the revert PR body and the comment for the original PR, and
records the commands that publish them.

**This formula performs no upstream write.** It used to perform three --
a push, a `gh pr create` and a `gh pr comment` -- under an `auto_push` /
`GASCITY_SHIP_BYPASS=mayor_revert` carve-out, now retired. All three sat
at the end of the chain, where a failure arrives after the work is done.
The recommended deployment gives unattended pool seats a READ-ONLY
`GH_TOKEN`. Without it the pool itself can publish, and nothing but this
formula's prose stands between an unreviewed branch and the forge.

The revert work stays in the pool. The three writes move to the publisher
named by `publish_owner`, who performs them from its own login after a
human approves that artifact. `hand-off-publish` records each command
verbatim with its identifiers already resolved.

The `verify-revertable` verdict still gates the work: `revert-branch`
refuses to prepare a revert the verifier did not clear
so a crash-resumed polecat with no env carryover stays authorized.

`mol-pr-from-issue` ends at the same kind of hand-off, for the same
reason and with the same evidence keys.

The molecule root bead IS the control bead — all run state lives in its
notes/metadata. Crash-safe: `gc bd mol current` resumes at the right step.

## Contract

1. Caller (mayor) slings with: `--var pr=<N> --var reason="<text>"`.
   No authorization var is needed or read: nothing here writes upstream.
2. Polecat executes steps in order.
3. Chain ends with either:
   - a revert branch plus a staged PR body and comment, with the three
     publish commands recorded on the root bead for the publisher to
     run after human approval (nothing is opened or posted here), OR
   - a halt with `metadata.summary_for_human` set on the root bead.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| pr | caller | PR number to revert (must be merged on the default branch) |
| reason | caller | Explanation for the revert; lands in PR comment + commit message + revert-PR body |

## Failure Modes

| Situation | Action |
|-----------|--------|
| PR not merged (state != MERGED or mergedAt is null) | intake-pr halts; summary_for_human set |
| PR merge commit no longer on default branch (already reverted, or branch reset) | verify-revertable halts |
| Subsequent commits modify the same files as the merge | verify-revertable records warning; verdict still pass; revert may produce conflicts caught downstream |
| verify-revertable verdict is not pass | revert-branch halts before creating the branch; no branch, no writes |
| `git revert` produces conflicts | revert-branch aborts the revert, halts; manual revert recommended |
| a publish identifier cannot be read from the forge | hand-off-publish records what it resolved and names the missing one; the revert branch is still prepared |"""
formula = "mol-pr-revert"
phase = "vapor"
# pour = true eager-materializes the steps. Without it this compiles RootOnly
# (internal/formula/compile.go: `(!f.Pour && f.Phase == "vapor") || len(f.Steps) == 0`)
# and all seven steps are dropped at instantiation. The failure is silent
# rather than loud: RecipeHasReadySurface returns true because RootOnly itself
# satisfies it, so a pool sling is accepted and only the work goes missing.
pour = true
version = 1

[vars]
[vars.pr]
description = "PR number to revert. Must be merged on the default branch."
required = true

[vars.publish_owner]
description = "Who runs the recorded publish commands. Recorded as evidence.publish_owner so the hand-off names its publisher. Default: maintainer."
default = "maintainer"

[vars.reason]
description = "Explanation for the revert. Lands in revert-PR title/body and original-PR comment."
required = true

[[steps]]
id = "intake-pr"
title = "Parse PR #{{pr}} and assert merged"
description = """
Fetch PR metadata, assert it is merged, and record initial state in the
root bead notes.

**1. Find root bead and resolve repo:**
```bash
ROOT_ID=$(gc bd mol current --json | jq -r '.molecule_id')
REPO=$(gh repo view --json nameWithOwner -q .nameWithOwner)
UPSTREAM_REPO=$(gh repo view --json parent --jq '.parent.nameWithOwner // empty')
[ -z "$UPSTREAM_REPO" ] && UPSTREAM_REPO="$REPO"
```

**2. Fetch PR metadata:**
```bash
gh pr view {{pr}} --repo "$UPSTREAM_REPO" \\
    --json title,author,baseRefName,headRefName,number,state,url,mergedAt,mergeCommit
```

**3. Assert merged:**

Parse the response. Required: `state == "MERGED"`, `mergedAt` non-null,
`mergeCommit.oid` non-empty.

If not merged:
```bash
gc bd update "$ROOT_ID" \\
  --set-metadata "gc.halt_chain=true" \\
  --set-metadata "summary_for_human=Cannot revert PR #{{pr}}: state=<state>, mergedAt=<value>. Only merged PRs are revertable through this formula."
gc bd close "$ROOT_ID" --reason "PR #{{pr}} not merged"
exit 0
```

**4. Record state in root bead notes:**
```bash
gc bd update "$ROOT_ID" --notes "pr_number: {{pr}}
pr_url: <url>
pr_title: <title>
pr_author: <author.login>
upstream_repo: $UPSTREAM_REPO
local_repo: $REPO
merge_sha: <mergeCommit.oid>
head_ref: <headRefName>
base_branch: <baseRefName>
merged_at: <mergedAt>
reason: {{reason}}"
```

**5. Display:**
```
[pr-revert] Intake complete
[pr-revert]   PR #{{pr}}: "<title>"
[pr-revert]   Author: <author.login>
[pr-revert]   Merged at <mergedAt> via commit <mergeCommit.oid>
[pr-revert]   Reason: {{reason}}
```

**Exit criteria:** PR confirmed merged; merge_sha + repo identifiers
recorded in root bead notes."""

[[steps]]
id = "verify-revertable"
title = "Verify PR #{{pr}} is safely revertable"
needs = ["intake-pr"]
description = """
Confirm the merge commit is still on the default branch and scan history
for commits that touch the same files. Sets `evidence.reviewer_verdict`,
which revert-branch refuses to proceed without.

**1. Find root bead and resolve identifiers:**
```bash
ROOT_ID=$(gc bd mol current --json | jq -r '.molecule_id')
NOTES=$(gc bd show "$ROOT_ID" --json | jq -r '.[0].notes // ""')
MERGE_SHA=$(echo "$NOTES" | awk -F': ' '/^merge_sha:/ {print $2}')
UPSTREAM_REPO=$(echo "$NOTES" | awk -F': ' '/^upstream_repo:/ {print $2}')
DEFAULT_BRANCH=$(gh repo view "$UPSTREAM_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name // "main"')
REPO_ROOT=$(git rev-parse --show-toplevel)
cd "$REPO_ROOT"
```

**2. Ensure local main is up-to-date and merge_sha is fetchable:**
```bash
git fetch origin "$DEFAULT_BRANCH"
git cat-file -e "$MERGE_SHA" 2>/dev/null || git fetch origin "$MERGE_SHA"
```

If `git cat-file -e` still fails after fetch, the merge SHA is not
reachable — halt:
```bash
gc bd update "$ROOT_ID" \\
  --set-metadata "gc.halt_chain=true" \\
  --set-metadata "evidence.reviewer_verdict=blocked" \\
  --set-metadata "summary_for_human=Cannot revert PR #{{pr}}: merge_sha $MERGE_SHA is not reachable from this checkout. Branch may have been force-pushed or deleted."
gc bd close "$ROOT_ID" --reason "merge_sha not reachable"
exit 0
```

**3. Assert merge_sha is on default branch:**
```bash
if ! git merge-base --is-ancestor "$MERGE_SHA" "origin/$DEFAULT_BRANCH"; then
    gc bd update "$ROOT_ID" \\
      --set-metadata "gc.halt_chain=true" \\
      --set-metadata "evidence.reviewer_verdict=blocked" \\
      --set-metadata "summary_for_human=Cannot revert PR #{{pr}}: merge_sha $MERGE_SHA is not an ancestor of origin/$DEFAULT_BRANCH. The merge may have already been reverted, or $DEFAULT_BRANCH was reset."
    gc bd close "$ROOT_ID" --reason "merge_sha not on default branch"
    exit 0
fi
```

**4. Scan subsequent history for file overlap:**

Files touched by the merge commit (use `-m` to include merge commits):
```bash
MERGE_FILES=$(git show -m --name-only --pretty=format: "$MERGE_SHA" | sort -u | grep -v '^$')
```

Files touched by any commit between merge_sha and HEAD of default:
```bash
RANGE="${MERGE_SHA}..origin/${DEFAULT_BRANCH}"
SUBSEQUENT_COUNT=$(git rev-list --count "$RANGE")
SUBSEQUENT_FILES=$(git log --name-only --pretty=format: "$RANGE" | sort -u | grep -v '^$')
```

Compute overlap (files modified both in the merge and subsequently):
```bash
OVERLAP=$(comm -12 <(echo "$MERGE_FILES") <(echo "$SUBSEQUENT_FILES"))
OVERLAP_COUNT=$(echo "$OVERLAP" | grep -c '^[^[:space:]]' || true)
```

**5. Set verdict:**

The verdict is `pass` even when overlap exists — `git revert` may still
succeed, and if it conflicts we catch it in revert-branch. Overlap is
recorded as evidence so the report and PR body can reference it.

```bash
gc bd update "$ROOT_ID" \\
  --set-metadata "evidence.reviewer_verdict=pass" \\
  --set-metadata "evidence.reviewer_agent=<this polecat session>" \\
  --set-metadata "evidence.subsequent_commits=$SUBSEQUENT_COUNT" \\
  --set-metadata "evidence.overlap_files=$OVERLAP_COUNT"
gc bd update "$ROOT_ID" --notes "$(echo "$NOTES")
default_branch: $DEFAULT_BRANCH
subsequent_commits: $SUBSEQUENT_COUNT
overlap_files: $OVERLAP_COUNT
overlap_file_list: $(echo "$OVERLAP" | tr '\\n' ',' | sed 's/,$//')"
```

**6. Display:**
```
[pr-revert] verify-revertable: pass
[pr-revert]   merge_sha $MERGE_SHA is on origin/$DEFAULT_BRANCH
[pr-revert]   $SUBSEQUENT_COUNT subsequent commits; $OVERLAP_COUNT overlap with merge files
```

**Exit criteria:** verdict recorded; overlap stats noted. revert-branch
reads these to decide whether to proceed."""

[[steps]]
id = "revert-branch"
title = "Create revert branch and run git revert (local only)"
needs = ["verify-revertable"]
description = """
**LOCAL-ONLY STEP — this step performs no upstream write.**

Creates branch `revert/pr-{{pr}}` off `origin/<default>` and runs
`git revert --no-edit <merge_sha>`. The branch stays local; the
`hand-off-publish` step records the command that would push it.

**1. Find root bead and read state:**
```bash
ROOT_ID=$(gc bd mol current --json | jq -r '.molecule_id')
META=$(gc bd show "$ROOT_ID" --json | jq '.[0].metadata')
VERDICT=$(echo "$META" | jq -r '."evidence.reviewer_verdict" // ""')
NOTES=$(gc bd show "$ROOT_ID" --json | jq -r '.[0].notes // ""')
MERGE_SHA=$(echo "$NOTES" | awk -F': ' '/^merge_sha:/ {print $2}')
DEFAULT_BRANCH=$(echo "$NOTES" | awk -F': ' '/^default_branch:/ {print $2}')
PR_TITLE=$(echo "$NOTES" | awk -F': ' '/^pr_title:/ {print $2}')
REPO_ROOT=$(git rev-parse --show-toplevel)
cd "$REPO_ROOT"
```

**2. Refuse a revert the verifier did not clear:**

The old carve-out gated a push. There is no push here, but preparing a
revert the verifier called unsafe still burns a branch and invites a
publisher to trust it, so the verdict is still load-bearing:
```bash
if [ "$VERDICT" != "pass" ]; then
    gc bd update "$ROOT_ID" \\
      --set-metadata "gc.halt_chain=true" \\
      --set-metadata "summary_for_human=Not preparing a revert of PR #{{pr}}: verify-revertable verdict=$VERDICT, not pass. No branch was created and nothing was written upstream."
    gc bd close "$ROOT_ID" --reason "verify-revertable verdict not pass"
    exit 0
fi
```

**3. Confirm tree is clean before creating the branch:**
```bash
if [ -n "$(git status --porcelain | grep -v '^??')" ]; then
    gc bd update "$ROOT_ID" \\
      --set-metadata "gc.halt_chain=true" \\
      --set-metadata "summary_for_human=Refusing to revert PR #{{pr}}: working tree is dirty. Commit or stash before retrying."
    gc bd close "$ROOT_ID" --reason "dirty working tree"
    exit 0
fi
```

**4. Create the revert branch and run git revert:**
```bash
git fetch origin "$DEFAULT_BRANCH"
BRANCH="revert/pr-{{pr}}"
git checkout -B "$BRANCH" "origin/$DEFAULT_BRANCH"
```

Run `git revert`. Use `-m 1` for merge commits (revert the changes
relative to the first parent, i.e. the base branch). Detect merge vs
non-merge:
```bash
PARENT_COUNT=$(git cat-file -p "$MERGE_SHA" | grep -c '^parent ')
if [ "$PARENT_COUNT" -gt 1 ]; then
    REVERT_CMD=(git revert --no-edit -m 1 "$MERGE_SHA")
else
    REVERT_CMD=(git revert --no-edit "$MERGE_SHA")
fi

if ! "${REVERT_CMD[@]}"; then
    git revert --abort 2>/dev/null || true
    gc bd update "$ROOT_ID" \\
      --set-metadata "gc.halt_chain=true" \\
      --set-metadata "summary_for_human=git revert of $MERGE_SHA produced conflicts on branch $BRANCH. Aborted. Manual revert recommended — subsequent commits likely modified the same code paths."
    gc bd close "$ROOT_ID" --reason "git revert conflict"
    exit 0
fi
```

**5. Amend the revert commit message to include the reason:**

`git revert --no-edit` produces "Revert \\"<original subject>\\"". Append
the reason so the commit message references both:
```bash
ORIGINAL_MSG=$(git log -1 --pretty=%B)
git commit --amend -m "$ORIGINAL_MSG" -m "Reverts PR #{{pr}}." -m "Reason: {{reason}}"
REVERT_SHA=$(git rev-parse HEAD)
```

**6. Resolve the fork remote. Do not push.**

The remote is resolved here so `hand-off-publish` can record an exact
command. `gh repo view` and `git remote -v` are reads:
```bash
LOCAL_REPO=$(gh repo view --json nameWithOwner --jq '.nameWithOwner')
FORK_REMOTE=$(git remote -v | awk -v fork="$LOCAL_REPO" 'index($2, fork) && /\\(push\\)/ {print $1; exit}')
[ -z "$FORK_REMOTE" ] && FORK_REMOTE="origin"
```

**7. Record state:**
```bash
gc bd update "$ROOT_ID" \\
  --set-metadata "evidence.revert_branch=$BRANCH" \\
  --set-metadata "evidence.revert_sha=$REVERT_SHA" \\
  --set-metadata "evidence.fork_remote=$FORK_REMOTE"
gc bd update "$ROOT_ID" --notes "$(echo "$NOTES")
revert_branch: $BRANCH
revert_sha: $REVERT_SHA
fork_remote: $FORK_REMOTE"
```

**8. Display:**
```
[pr-revert] revert-branch: reverted locally, nothing pushed
[pr-revert]   Branch: $BRANCH
[pr-revert]   Revert commit: $REVERT_SHA
[pr-revert]   Reverts: $MERGE_SHA ("$PR_TITLE")
```

**Exit criteria:** revert branch exists locally with the revert commit;
evidence.revert_branch and evidence.revert_sha recorded. Nothing pushed."""

[[steps]]
id = "hand-off-publish"
title = "Record the revert publish hand-off for the publisher"
needs = ["revert-branch"]
description = """
The pool half of this chain ENDS HERE. This step performs NO upstream
write: no `git push`, no `gh pr create`, no `gh pr comment`. It composes
the revert PR body and the comment that goes on the original PR, leaves
both on disk, records the three commands that would publish them, and
closes the molecule at branch-ready.

**Why this step does not publish.** The recommended deployment gives unattended pool seats a READ-ONLY
`GH_TOKEN`. Without it the pool itself can publish, and nothing but this
formula's prose stands between an unreviewed branch and the forge. Under that
deployment the old `auto_push` / `GASCITY_SHIP_BYPASS=mayor_revert`
carve-out ends in a refusal at the forge AFTER the revert has been
prepared. The revert work stays in the pool; the three writes move to the
publisher named by `publish_owner`, who performs them from its own login
after a human approves that artifact.

**1. Find root bead and read state:**
```bash
ROOT_ID=$(gc bd mol current --json | jq -r '.molecule_id')
META=$(gc bd show "$ROOT_ID" --json | jq '.[0].metadata')
NOTES=$(gc bd show "$ROOT_ID" --json | jq -r '.[0].notes // ""')
UPSTREAM_REPO=$(echo "$NOTES" | awk -F': ' '/^upstream_repo:/ {print $2}')
DEFAULT_BRANCH=$(echo "$NOTES" | awk -F': ' '/^default_branch:/ {print $2}')
BRANCH=$(echo "$NOTES" | awk -F': ' '/^revert_branch:/ {print $2}')
REVERT_SHA=$(echo "$NOTES" | awk -F': ' '/^revert_sha:/ {print $2}')
MERGE_SHA=$(echo "$NOTES" | awk -F': ' '/^merge_sha:/ {print $2}')
PR_TITLE=$(echo "$NOTES" | awk -F': ' '/^pr_title:/ {print $2}')
PR_URL=$(echo "$NOTES" | awk -F': ' '/^pr_url:/ {print $2}')
SUBSEQUENT_COUNT=$(echo "$META" | jq -r '."evidence.subsequent_commits" // "0"')
OVERLAP_COUNT=$(echo "$META" | jq -r '."evidence.overlap_files" // "0"')
LOCAL_REPO=$(gh repo view --json nameWithOwner --jq '.nameWithOwner')
FORK_OWNER=$(echo "$LOCAL_REPO" | cut -d/ -f1)
```

`gh repo view` is a read and works under the pool credential.

**2. Compose the revert PR body and leave it on disk.**

Not a `mktemp`: the publisher runs in a different process, so a temp file
deleted at the end of this step is no use to them. Read MERGE_SHA out of
notes first so the heredoc only does variable interpolation:
```bash
REVERT_REASON=$(cat <<'REASON'
{{reason}}
REASON
)
REVERT_TITLE="Revert PR #{{pr}}: $REVERT_REASON"
BODY_DIR="${GC_CITY_PATH:?}/.gc/staged-gh/$ROOT_ID-pr-{{pr}}"
mkdir -p "$BODY_DIR"
BODY_FILE="$BODY_DIR/revert-pr-body.md"
cat > "$BODY_FILE" <<MD
Reverts PR #{{pr}} ($PR_URL): "$PR_TITLE".

## Reason

{{reason}}

## Context

- Original merge commit: $MERGE_SHA
- Revert commit: $REVERT_SHA on branch $BRANCH
- Subsequent commits on $DEFAULT_BRANCH since the merge: $SUBSEQUENT_COUNT
- Files modified both in the merge and subsequently: $OVERLAP_COUNT

Generated by mol-pr-revert (mayor-invoked).
MD
```

**3. Compose the comment for the original PR and leave it on disk.**

It cannot name the revert PR URL, because no revert PR exists yet. Leave
the placeholder; the recorded comment command in step 4 fills it from the
open revert PR at publish time:
```bash
PUBLISH_OWNER=$(cat <<'OWNER'
{{publish_owner}}
OWNER
)
COMMENT_FILE="$BODY_DIR/revert-comment.md"
cat > "$COMMENT_FILE" <<MD
This PR has been reverted: <REVERT_PR_URL>

**Reason:** {{reason}}

_Prepared by mol-pr-revert; posted by $PUBLISH_OWNER._
MD
```

**4. Record the three publish commands on the root bead.**

Verbatim, in the order the publisher runs them, with every identifier
resolved. The comment command looks the revert PR URL up itself (a read),
accepting exactly one open PR whose head owner, head SHA and base match
this revert, and fills it into the staged body, so nothing is edited by
hand; it refuses to post on a missing or ambiguous match:
```bash
PUBLISH_OWNER=$(cat <<'OWNER'
{{publish_owner}}
OWNER
)
GIT_DIR_ABS=$(git rev-parse --path-format=absolute --git-common-dir)
git update-ref "refs/staged-gh/$ROOT_ID" "$REVERT_SHA"
PUBLISH_PUSH="git --git-dir=$(printf %q "$GIT_DIR_ABS") push $(printf %q "https://github.com/$LOCAL_REPO.git") $(printf %q "$REVERT_SHA:refs/heads/$BRANCH")"
PUBLISH_CREATE="gh pr create --repo $(printf %q "$UPSTREAM_REPO") --base $(printf %q "$DEFAULT_BRANCH") --head $(printf %q "$FORK_OWNER:$BRANCH") --title $(printf %q "$REVERT_TITLE") --body-file $(printf %q "$BODY_FILE")"
REVERT_URL_JQ=$(jq -nr --arg o "$FORK_OWNER" --arg s "$REVERT_SHA" --arg b "$DEFAULT_BRANCH" '"[.[] | select(.headRepositoryOwner.login == \\($o|@json) and .headRefOid == \\($s|@json) and .baseRefName == \\($b|@json))] | if length == 1 then .[0].url else empty end"')
PUBLISH_COMMENT="url=\\$(gh pr list --repo $(printf %q "$UPSTREAM_REPO") --head $(printf %q "$BRANCH") --state open --json url,headRefOid,headRepositoryOwner,baseRefName --jq $(printf %q "$REVERT_URL_JQ")) && test -n \\"\\$url\\" && sed \\"s|<REVERT_PR_URL>|\\$url|\\" $(printf %q "$COMMENT_FILE") | gh pr comment {{pr}} --repo $(printf %q "$UPSTREAM_REPO") --body-file -"

gc bd update "$ROOT_ID" \\
  --set-metadata "evidence.revert_branch=$BRANCH" \\
  --set-metadata "evidence.revert_sha=$REVERT_SHA" \\
  --set-metadata "evidence.pr_body_path=$BODY_FILE" \\
  --set-metadata "evidence.comment_body_path=$COMMENT_FILE" \\
  --set-metadata "evidence.publish_push_cmd=$PUBLISH_PUSH" \\
  --set-metadata "evidence.publish_create_cmd=$PUBLISH_CREATE" \\
  --set-metadata "evidence.publish_comment_cmd=$PUBLISH_COMMENT" \\
  --set-metadata "evidence.publish_owner=$PUBLISH_OWNER" \\
  --set-metadata "gc.outcome=branch-ready"
gc bd update "$ROOT_ID" --notes "$(echo "$NOTES")
pr_body_path: $BODY_FILE
comment_body_path: $COMMENT_FILE
publish_owner: $PUBLISH_OWNER"
```

**5. Display:**
```
[pr-revert] hand-off-publish: prepared, nothing published
[pr-revert]   Revert branch: $BRANCH at $REVERT_SHA (local only)
[pr-revert]   Reverts: #{{pr}} ($PR_URL)
[pr-revert]   Publish commands recorded on $ROOT_ID
```

**Exit criteria:** revert branch local at `evidence.revert_sha`, both
bodies on disk, all three publish commands recorded on the root bead. No
upstream write performed."""

[[steps]]
id = "report"
title = "Synthesize summary_for_human and close molecule at branch-ready"
needs = ["hand-off-publish"]
description = """
Final step. Compose `summary_for_human` from collected evidence and close
the molecule. No revert PR exists yet, so there is no PR URL to record.

**1. Find root bead and read state:**
```bash
ROOT_ID=$(gc bd mol current --json | jq -r '.molecule_id')
META=$(gc bd show "$ROOT_ID" --json | jq '.[0].metadata')
NOTES=$(gc bd show "$ROOT_ID" --json | jq -r '.[0].notes // ""')
PR_NUM={{pr}}
PR_URL=$(echo "$NOTES" | awk -F': ' '/^pr_url:/ {print $2}')
PR_TITLE=$(echo "$NOTES" | awk -F': ' '/^pr_title:/ {print $2}')
REVERT_BRANCH=$(echo "$META" | jq -r '."evidence.revert_branch" // ""')
PUSH_CMD=$(echo "$META" | jq -r '."evidence.publish_push_cmd" // ""')
REVERT_SHA=$(echo "$META" | jq -r '."evidence.revert_sha" // ""')

OVERLAP_COUNT=$(echo "$META" | jq -r '."evidence.overlap_files" // "0"')
```

**2. Compose summary:**

`summary_for_human` is the message the loop-close handler surfaces. Keep
it tight; the maintainer can drill into evidence/notes for detail.

```bash
PUBLISH_OWNER=$(cat <<'OWNER'
{{publish_owner}}
OWNER
)
OVERLAP_NOTE=""
[ "$OVERLAP_COUNT" -gt 0 ] && OVERLAP_NOTE=" $OVERLAP_COUNT files were modified after the original merge — watch CI once the revert PR is opened."

gc bd update "$ROOT_ID" \\
  --set-metadata "evidence.reviewer_verdict=pass" \\
  --set-metadata "evidence.artifact_path=git:$REVERT_SHA" \\
  --set-metadata "summary_for_human=Revert of PR #$PR_NUM (\\"$PR_TITLE\\") is PREPARED, not published. Revert commit $REVERT_SHA is on local branch $REVERT_BRANCH; nothing has been pushed, no revert PR exists, and the original PR has not been commented on.$OVERLAP_NOTE Publishing is $PUBLISH_OWNER's step, from its own login, after a human approves this artifact; the three commands are on this bead as evidence.publish_push_cmd, evidence.publish_create_cmd and evidence.publish_comment_cmd. Reason: {{reason}}"
```

**3. Close the molecule:**
```bash
gc bd close "$ROOT_ID" --reason "revert of #$PR_NUM prepared at $REVERT_SHA; branch-ready to publish"
```

**4. Display:**
```
[pr-revert] Complete — prepared, nothing published
[pr-revert]   Reverts #$PR_NUM: $PR_URL
[pr-revert]   Revert commit: $REVERT_SHA on $REVERT_BRANCH (local only)
[pr-revert]   Publish starts with: $PUSH_CMD
```

**Exit criteria:** evidence.revert_sha, the three publish commands and
summary_for_human set; molecule closed at branch-ready."""
