# transcript-archive preserves agent session transcripts at session close.
# Transcripts are the one volatile source a retroactive run profile depends
# on (provider/user-owned files under ~/.claude/projects, ~/.codex, ...);
# archiving them at session close means `gc profile collect` still has
# per-turn timing evidence for runs profiled days later.
#
# Mechanical (bead lookup + file copy), no LLM judgment — runs via exec.
[order]
description = "Archive the session transcript when a managed session stops"
trigger = "event"
on = "session.stopped"
exec = "$PACK_DIR/assets/scripts/transcript-archive.sh"
