[pack]
name = "gastown-lazyjj"
version = "0.1.2"
schema = 2
description = "LazyJJ workspace and stack workflow for Gas Town jj workers."

[imports.jjw]
source = "../jjw"

[global]
session_live = [
    "{{.ConfigDir}}/assets/scripts/tmux-scroll.sh {{.Session}}",
]

[providers.codex-gpt-5-5]
base = "builtin:codex"
option_defaults = { model = "gpt-5.5", effort = "medium" }

[[named_session]]
template = "jedi"
scope = "rig"
mode = "on_demand"

[[named_session]]
template = "tasksmith"
scope = "rig"
mode = "always"

[[named_session]]
template = "runner"
scope = "rig"
mode = "always"
