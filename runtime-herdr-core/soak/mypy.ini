# mypy --strict for the soak harness and its unit tests. Run from this
# directory:
#
#   python -m mypy --config-file mypy.ini [--python-version 3.12]
#   python -m mypy --config-file mypy.ini [--python-version 3.12] bin/soak-agent
#
# (two runs: both entries are extensionless scripts, so mypy names both
# ``__main__``)
# The harness runs on the soak VM's Python 3.12 and keeps the pack's 3.9
# floor; CI checks both.

[mypy]
python_version = 3.9
strict = True
warn_unreachable = True
mypy_path = lib:../tests:../assets
files = lib, bin/soak, tests
