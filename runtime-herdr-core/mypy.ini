# mypy --strict for the pack and its test tier. Run from the
# pack directory:
#
#   python -m mypy --config-file mypy.ini [--python-version 3.12]
#
# The floor is Python 3.9; CI checks both 3.9 and 3.12 with mypy 1.19.1, the
# last release that runs on 3.9.

[mypy]
python_version = 3.9
strict = True
warn_unreachable = True
mypy_path = assets:tests
files = assets/gc_runtime_herdr_core, assets/bin/gc-runtime-herdr-core, tests/fakehc, tests/unit

# The provider-neutral kit takes no Any: JSON is decoded only through the
# typed readers in rpp/jsonval.py (an annotated assignment or a cast).
[mypy-gc_runtime_herdr_core.rpp.*]
disallow_any_expr = True

# So do the runtime semantics.
[mypy-gc_runtime_herdr_core.herdrcore.*]
disallow_any_expr = True
